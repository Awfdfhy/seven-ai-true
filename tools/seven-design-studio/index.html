<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Seven Design Studio V0</title>
<link rel="stylesheet" href="https://unpkg.com/grapesjs/dist/css/grapes.min.css" />
<style>
:root{--bg:#08101f;--panel:#0d1728;--panel2:#121e33;--text:#f4f6fb;--muted:#93a4bf;--line:#22304a;--blue:#4166f5;--cyan:#32becf;--violet:#8265dc;--danger:#ff5576;--safe:env(safe-area-inset-bottom)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
button,input,select{font:inherit}.shell{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(circle at 50% 0%,rgba(65,102,245,.14),transparent 28%),var(--bg)}
.topbar{height:58px;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line);background:rgba(8,16,31,.92);backdrop-filter:blur(14px);z-index:20}.brand{display:flex;align-items:center;gap:9px;min-width:0}.mark{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--cyan),var(--blue) 52%,var(--violet));display:grid;place-items:center;font-weight:900;color:white;box-shadow:0 0 24px rgba(65,102,245,.28)}.title{font-weight:800;font-size:14px;letter-spacing:.08em}.badge{font-size:10px;color:var(--muted);border:1px solid var(--line);padding:3px 6px;border-radius:999px}.spacer{flex:1}.iconbtn,.toolbtn,.chip,.action{border:1px solid var(--line);background:var(--panel);color:var(--text);min-width:44px;min-height:44px;border-radius:13px;display:inline-grid;place-items:center}.iconbtn:active,.toolbtn:active,.chip:active,.action:active{transform:scale(.97)}.iconbtn.active,.chip.active{border-color:rgba(65,102,245,.7);background:rgba(65,102,245,.14)}
.work{position:relative;min-height:0;display:grid;place-items:center;padding:10px;background:linear-gradient(180deg,#07101e,#091323)}.canvas-frame{width:min(100%,393px);height:100%;min-height:0;border:1px solid #273650;border-radius:24px;overflow:hidden;background:#10192a;box-shadow:0 24px 70px rgba(0,0,0,.35);transition:width .18s ease}.canvas-frame[data-width="320"]{width:320px}.canvas-frame[data-width="360"]{width:360px}.canvas-frame[data-width="393"]{width:393px}.canvas-frame[data-width="412"]{width:412px}.canvas-frame[data-width="480"]{width:480px;max-width:100%}#gjs{height:100%;border:0}.gjs-editor,.gjs-cv-canvas{background:transparent!important}.gjs-cv-canvas{width:100%!important;height:100%!important;top:0!important}.gjs-frame{background:white}.gjs-badge,.gjs-toolbar{font-family:inherit!important}
.bottomnav{padding:8px 10px calc(8px + var(--safe));display:grid;grid-template-columns:repeat(5,1fr);gap:7px;border-top:1px solid var(--line);background:rgba(8,16,31,.96);backdrop-filter:blur(14px);z-index:20}.toolbtn{min-width:0;min-height:50px;font-size:11px;gap:3px;padding:6px}.toolbtn b{font-size:18px;line-height:1}.toolbtn.primary{background:linear-gradient(135deg,rgba(50,190,207,.17),rgba(65,102,245,.2),rgba(130,101,220,.18));border-color:rgba(65,102,245,.55)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:linear-gradient(180deg,#111d31,#0a1424);border:1px solid #273650;border-bottom:0;border-radius:22px 22px 0 0;max-height:min(76dvh,680px);transform:translateY(105%);transition:transform .2s ease;box-shadow:0 -24px 70px rgba(0,0,0,.45);display:grid;grid-template-rows:auto 1fr}.sheet.open{transform:translateY(0)}.sheethead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}.sheethead h2{font-size:15px;margin:0}.handle{position:absolute;top:7px;left:50%;width:38px;height:4px;border-radius:999px;background:#40506a;transform:translateX(-50%)}.sheetbody{overflow:auto;padding:14px;padding-bottom:calc(18px + var(--safe))}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.block{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:15px;padding:13px;text-align:left;min-height:72px}.block strong{display:block;font-size:13px}.block small{display:block;color:var(--muted);margin-top:4px;font-size:11px}.section{margin:0 0 16px}.section h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}.rows{display:grid;gap:8px}.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(34,48,74,.7)}.row label{font-size:13px}.row small{color:var(--muted)}select,input[type="text"],input[type="number"]{background:#0b1526;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:42px;max-width:160px}input[type="color"]{width:48px;height:40px;border:1px solid var(--line);background:#0b1526;border-radius:10px;padding:4px}.tokens{display:flex;flex-wrap:wrap;gap:8px}.token{width:38px;height:38px;border-radius:12px;border:2px solid rgba(255,255,255,.18)}.layer{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;color:var(--text);padding:9px;border-radius:10px;text-align:left}.layer:hover,.layer.sel{background:rgba(65,102,245,.13)}.indent{display:inline-block;width:calc(var(--depth)*14px)}.empty{color:var(--muted);padding:18px 4px;text-align:center}.actions{display:flex;gap:8px;flex-wrap:wrap}.action{padding:0 13px}.action.danger{border-color:rgba(255,85,118,.4);color:#ff8da4}.action.primary{background:linear-gradient(135deg,var(--blue),var(--violet));border:0}.toast{position:fixed;left:50%;bottom:92px;z-index:80;transform:translate(-50%,20px);opacity:0;background:#121f34;color:#fff;border:1px solid #2a3b5b;padding:10px 14px;border-radius:12px;font-size:12px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:350px){.title{font-size:12px}.badge{display:none}.topbar{padding-left:8px;padding-right:8px}.work{padding:4px}.canvas-frame{border-radius:18px}.toolbtn{font-size:10px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><div class="mark">7</div><div><div class="title">SEVEN DESIGN</div></div><span class="badge">V0</span></div>
    <div class="spacer"></div>
    <button id="themeBtn" class="iconbtn" aria-label="Toggle theme">☾</button>
    <button id="rtlBtn" class="iconbtn" aria-label="Toggle RTL">⇄</button>
    <select id="deviceSelect" aria-label="Preview width" style="max-width:84px;min-height:44px">
      <option value="320">320</option><option value="360">360</option><option value="393" selected>393</option><option value="412">412</option><option value="480">480</option>
    </select>
  </header>
  <main class="work"><div class="canvas-frame" id="frame" data-width="393"><div id="gjs"></div></div></main>
  <nav class="bottomnav" aria-label="Studio tools">
    <button class="toolbtn primary" data-open="add"><b>＋</b><span>Add</span></button>
    <button class="toolbtn" data-open="layers"><b>≡</b><span>Layers</span></button>
    <button class="toolbtn" data-open="design"><b>◫</b><span>Design</span></button>
    <button class="toolbtn" id="saveBtn"><b>✓</b><span>Save</span></button>
    <button class="toolbtn" data-open="export"><b>↗</b><span>Export</span></button>
  </nav>
</div>

<section class="sheet" id="sheet" aria-modal="true" role="dialog" aria-hidden="true">
  <div class="handle"></div>
  <div class="sheethead"><h2 id="sheetTitle">Add</h2><div class="spacer"></div><button class="iconbtn" id="closeSheet" aria-label="Close">×</button></div>
  <div class="sheetbody" id="sheetBody"></div>
</section>
<div class="toast" id="toast"></div>
<script src="https://unpkg.com/grapesjs"></script>
<script>
(() => {
const TOKENS={navy:'#0A1022',off:'#F4F6FB',blue:'#4166F5',cyan:'#32BECF',violet:'#8265DC',surface:'#111B2F',text:'#F4F6FB',muted:'#93A4BF'};
const STARTER=`<main class="seven-home"><header class="seven-header"><div class="seven-brand"><span class="seven-logo">7</span><strong>SEVEN</strong></div><button class="avatar">You</button></header><section class="intent"><p>What do you want to do?</p></section><section class="composer"><textarea placeholder="Ask, build, research, imagine..."></textarea><div class="composer-actions"><button class="ghost">＋</button><span class="grow"></span><button class="ghost">◉</button><button class="send">↑</button></div></section><section class="continue"><div class="eyebrow">Continue</div><article class="continue-card"><div><strong>Seven Home</strong><small>Design workspace</small></div><span>›</span></article></section></main>`;
const CSS=`*{box-sizing:border-box}body{margin:0;background:#0A1022;color:#F4F6FB;font-family:Inter,system-ui,sans-serif;min-height:100vh}.seven-home{min-height:100vh;padding:18px 16px 90px;background:radial-gradient(circle at 80% 0%,rgba(65,102,245,.13),transparent 30%),#0A1022}.seven-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:42px}.seven-brand{display:flex;align-items:center;gap:9px;letter-spacing:.08em}.seven-logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,#32BECF,#4166F5 55%,#8265DC);box-shadow:0 0 24px rgba(65,102,245,.26)}button{font:inherit}.avatar,.ghost{min-width:44px;min-height:44px;border-radius:13px;border:1px solid #263653;background:#111B2F;color:#F4F6FB}.intent p{font-size:24px;line-height:1.2;font-weight:700;margin:0 0 16px}.composer{border:1px solid #2A3A59;background:#101A2C;border-radius:22px;padding:13px;box-shadow:0 18px 50px rgba(0,0,0,.24)}.composer:focus-within{border-color:#4166F5;box-shadow:0 0 0 3px rgba(65,102,245,.12),0 18px 50px rgba(0,0,0,.24)}.composer textarea{width:100%;min-height:98px;border:0;outline:0;resize:vertical;background:transparent;color:#F4F6FB;font:inherit;font-size:16px}.composer textarea::placeholder{color:#8495B1}.composer-actions{display:flex;align-items:center;gap:8px}.grow{flex:1}.send{width:44px;height:44px;border:0;border-radius:14px;background:linear-gradient(135deg,#4166F5,#8265DC);color:white;font-weight:800}.continue{margin-top:28px}.eyebrow{font-size:12px;color:#93A4BF;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}.continue-card{display:flex;align-items:center;justify-content:space-between;padding:15px;border:1px solid #22304A;border-radius:17px;background:#0E1829}.continue-card div{display:grid;gap:4px}.continue-card small{color:#93A4BF}.seven-home.day{background:#F4F6FB;color:#0A1022}.seven-home.day .composer,.seven-home.day .continue-card,.seven-home.day .avatar,.seven-home.day .ghost{background:white;color:#0A1022;border-color:#DCE3EE}.seven-home.day .composer textarea{color:#0A1022}.seven-home.day .eyebrow,.seven-home.day .continue-card small{color:#61708A}[dir=rtl] .seven-brand{flex-direction:row-reverse}`;

const editor=grapesjs.init({container:'#gjs',height:'100%',width:'auto',fromElement:false,panels:{defaults:[]},storageManager:{type:'local',autosave:true,autoload:true,stepsBeforeSave:1,options:{local:{key:'seven-design-studio-v0'}}},deviceManager:{devices:[{id:'p320',name:'320',width:'320px'},{id:'p360',name:'360',width:'360px'},{id:'p393',name:'393',width:'393px'},{id:'p412',name:'412',width:'412px'},{id:'p480',name:'480',width:'480px'}]},canvas:{styles:[]}});

let isDay=false, isRtl=false;
editor.on('load',()=>{ if(!editor.getHtml().trim()){editor.setComponents(STARTER);editor.setStyle(CSS)} else if(!editor.getCss().trim()){editor.setStyle(CSS)} applyCanvasMode(); refreshLayers(); });
editor.on('component:selected component:add component:remove component:update',()=>{refreshLayers(); if(document.getElementById('sheet').classList.contains('open')&&currentPanel==='design')renderDesign();});

function applyCanvasMode(){const body=editor.Canvas.getBody();if(!body)return;body.setAttribute('dir',isRtl?'rtl':'ltr');const home=editor.getWrapper().find('.seven-home')[0];if(home){home.getClasses().includes('day')!==isDay && home.addClass(isDay?'day':'noop'); if(!isDay)home.removeClass('day');home.removeClass('noop')}}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),1400)}
function add(html){const c=editor.addComponents(html);const target=Array.isArray(c)?c[c.length-1]:c;target&&editor.select(target);toast('Added');closeSheet()}

const blocks=[
 ['Frame','Section container',`<section style="padding:20px;border:1px solid #22304A;border-radius:18px;min-height:120px">Frame</section>`],
 ['Stack','Flex layout',`<div style="display:flex;gap:12px;align-items:center;padding:12px"><div style="padding:12px;border-radius:12px;background:#111B2F">Item A</div><div style="padding:12px;border-radius:12px;background:#111B2F">Item B</div></div>`],
 ['Text','Editable copy',`<p style="font-size:18px;line-height:1.5">Edit this text</p>`],
 ['Button','Seven action',`<button style="min-height:48px;padding:0 18px;border:0;border-radius:14px;background:linear-gradient(135deg,#4166F5,#8265DC);color:white;font-weight:700">Action</button>`],
 ['Card','Neutral surface',`<article style="padding:16px;border:1px solid #22304A;border-radius:18px;background:#0E1829"><strong>Card title</strong><p style="color:#93A4BF">Useful supporting content.</p></article>`],
 ['Composer','Seven input',`<section class="composer"><textarea placeholder="Ask SEVEN..."></textarea><div class="composer-actions"><button class="ghost">＋</button><span class="grow"></span><button class="ghost">◉</button><button class="send">↑</button></div></section>`],
 ['Sheet','Bottom surface',`<section style="padding:18px;border-radius:22px 22px 0 0;background:#111B2F;border:1px solid #273650"><strong>Sheet</strong><p style="color:#93A4BF">Place mobile actions here.</p></section>`],
 ['Nav','Mobile navigation',`<nav style="display:flex;justify-content:space-around;align-items:center;padding:12px;border:1px solid #22304A;border-radius:18px;background:#0E1829"><span>Home</span><span>Spaces</span><strong>7</strong><span>Library</span><span>You</span></nav>`]
];

const sheet=document.getElementById('sheet'),sheetBody=document.getElementById('sheetBody'),sheetTitle=document.getElementById('sheetTitle');let currentPanel='';
function openSheet(name){currentPanel=name;sheet.classList.add('open');sheet.setAttribute('aria-hidden','false');renderPanel(name)}
function closeSheet(){sheet.classList.remove('open');sheet.setAttribute('aria-hidden','true')}
document.getElementById('closeSheet').onclick=closeSheet;
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openSheet(b.dataset.open));

function renderPanel(name){if(name==='add')renderAdd();if(name==='layers')refreshLayers();if(name==='design')renderDesign();if(name==='export')renderExport()}
function renderAdd(){sheetTitle.textContent='Add component';sheetBody.innerHTML='<div class="grid">'+blocks.map((b,i)=>`<button class="block" data-bi="${i}"><strong>${b[0]}</strong><small>${b[1]}</small></button>`).join('')+'</div>';sheetBody.querySelectorAll('[data-bi]').forEach(btn=>btn.onclick=()=>add(blocks[+btn.dataset.bi][2]))}

function refreshLayers(){if(currentPanel!=='layers'&&!(sheet.classList.contains('open')&&currentPanel==='layers'))return;sheetTitle.textContent='Layers';const root=editor.getWrapper();const selected=editor.getSelected();let out='';function walk(list,d){list.forEach(c=>{const name=c.get('custom-name')||c.getName()||c.get('tagName')||'Layer';out+=`<button class="layer ${c===selected?'sel':''}" data-cid="${c.cid}" style="--depth:${d}"><span class="indent"></span><span>▱</span><span>${escapeHtml(name)}</span></button>`;if(c.components&&c.components().length)walk(c.components(),d+1)})}walk(root.components(),0);sheetBody.innerHTML=out||'<div class="empty">No layers yet.</div>';sheetBody.querySelectorAll('[data-cid]').forEach(b=>b.onclick=()=>{const c=findByCid(root,b.dataset.cid);if(c){editor.select(c);refreshLayers()}})}
function findByCid(c,cid){if(c.cid===cid)return c;let hit=null;c.components&&c.components().each(x=>{if(!hit)hit=findByCid(x,cid)});return hit}

function renderDesign(){sheetTitle.textContent='Design';const c=editor.getSelected();if(!c){sheetBody.innerHTML='<div class="empty">Select an element on the canvas first.</div>';return}const s=c.getStyle();sheetBody.innerHTML=`
<div class="section"><h3>Selected</h3><div class="rows"><div class="row"><label>Name</label><input id="pname" type="text" value="${escapeAttr(c.get('custom-name')||c.getName()||c.get('tagName')||'Layer')}"></div><div class="row"><label>Display</label><select id="pdisplay"><option>block</option><option>flex</option><option>grid</option><option>inline-flex</option></select></div><div class="row"><label>Direction</label><select id="pdir"><option value="row">row</option><option value="column">column</option></select></div><div class="row"><label>Gap</label><input id="pgap" type="text" value="${escapeAttr(s.gap||'0px')}"></div><div class="row"><label>Padding</label><input id="ppad" type="text" value="${escapeAttr(s.padding||'0px')}"></div><div class="row"><label>Radius</label><input id="prad" type="text" value="${escapeAttr(s['border-radius']||'0px')}"></div><div class="row"><label>Font size</label><input id="pfont" type="text" value="${escapeAttr(s['font-size']||'')}"></div><div class="row"><label>Background</label><input id="pbg" type="color" value="${toColor(s.background||s['background-color']||'#111B2F')}"></div><div class="row"><label>Text color</label><input id="pcolor" type="color" value="${toColor(s.color||'#F4F6FB')}"></div></div></div>
<div class="section"><h3>Seven tokens</h3><div class="tokens">${Object.entries(TOKENS).slice(0,5).map(([k,v])=>`<button class="token" data-token="${v}" title="${k}" style="background:${v}"></button>`).join('')}</div></div>
<div class="section"><h3>Actions</h3><div class="actions"><button class="action" id="dup">Duplicate</button><button class="action danger" id="del">Delete</button></div></div>`;
const bind=(id,prop)=>{const el=document.getElementById(id);el.value=s[prop]||el.value;el.onchange=()=>{const ns={...c.getStyle(),[prop]:el.value};c.setStyle(ns)}};document.getElementById('pname').onchange=e=>c.set('custom-name',e.target.value);bind('pdisplay','display');bind('pdir','flex-direction');bind('pgap','gap');bind('ppad','padding');bind('prad','border-radius');bind('pfont','font-size');bind('pbg','background-color');bind('pcolor','color');sheetBody.querySelectorAll('[data-token]').forEach(b=>b.onclick=()=>{c.setStyle({...c.getStyle(),'background-color':b.dataset.token});renderDesign()});document.getElementById('dup').onclick=()=>{const clone=c.clone();c.parent().components().add(clone,{at:c.index()+1});editor.select(clone);toast('Duplicated');renderDesign()};document.getElementById('del').onclick=()=>{c.remove();toast('Deleted');renderDesign()}}

function renderExport(){sheetTitle.textContent='Export';sheetBody.innerHTML=`<div class="section"><h3>Project</h3><div class="actions"><button class="action primary" id="expHtml">HTML package</button><button class="action" id="expJson">Project JSON</button></div></div><div class="section"><h3>Boundary</h3><p style="color:var(--muted);font-size:13px;line-height:1.6">V0 exports design code only. It does not claim real SEVEN runtime, permissions, tools or verification.</p></div>`;document.getElementById('expHtml').onclick=()=>download('seven-design.html','<!DOCTYPE html><html><head><meta charset="utf-8"><style>'+editor.getCss()+'</style></head><body>'+editor.getHtml()+'</body></html>','text/html');document.getElementById('expJson').onclick=()=>download('seven-design-project.json',JSON.stringify(editor.getProjectData(),null,2),'application/json')}
function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Exported')}

document.getElementById('saveBtn').onclick=async()=>{await editor.store();toast('Saved locally')};
document.getElementById('deviceSelect').onchange=e=>{document.getElementById('frame').dataset.width=e.target.value;const map={'320':'p320','360':'p360','393':'p393','412':'p412','480':'p480'};editor.setDevice(map[e.target.value]);toast(e.target.value+' px')};
document.getElementById('themeBtn').onclick=e=>{isDay=!isDay;e.currentTarget.classList.toggle('active',isDay);e.currentTarget.textContent=isDay?'☀':'☾';applyCanvasMode();toast(isDay?'Day preview':'Night preview')};
document.getElementById('rtlBtn').onclick=e=>{isRtl=!isRtl;e.currentTarget.classList.toggle('active',isRtl);applyCanvasMode();toast(isRtl?'RTL preview':'LTR preview')};
function escapeHtml(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function escapeAttr(s){return escapeHtml(s).replace(/"/g,'&quot;')}function toColor(v){const m=String(v).match(/#[0-9a-fA-F]{6}/);return m?m[0]:'#111B2F'}
})();
</script>
</body>
</html>
