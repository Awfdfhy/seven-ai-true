<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0A1022" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="Seven Design Studio — mobile-first visual UI design environment for Seven." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>Seven Design Studio</title>
  <link rel="stylesheet" href="https://unpkg.com/grapesjs@0.23.6/dist/css/grapes.min.css" />
  <link rel="stylesheet" href="./studio.css" />
  <link rel="stylesheet" href="./mobile-polish.css" />
</head>
<body>
  <div class="app-shell" id="appShell">
    <header class="topbar">
      <button class="brand" id="brandBtn" aria-label="Seven Design Studio home">
        <span class="brand-mark" aria-hidden="true">7</span>
        <span class="brand-copy"><strong>SEVEN DESIGN</strong><small id="docName">Untitled</small></span>
      </button>
      <div class="top-actions">
        <button class="icon-button" id="undoBtn" aria-label="Undo">↶</button>
        <button class="icon-button" id="redoBtn" aria-label="Redo">↷</button>
        <button class="icon-button accent" id="previewBtn" aria-label="Preview design">▶</button>
      </div>
    </header>

    <section class="subbar" aria-label="Preview controls">
      <select id="deviceSelect" aria-label="Preview width">
        <option value="320">320px</option>
        <option value="360">360px</option>
        <option value="393" selected>393px</option>
        <option value="412">412px</option>
        <option value="480">480px</option>
      </select>
      <button class="chip" id="themeBtn" aria-label="Toggle theme">Night</button>
      <button class="chip" id="dirBtn" aria-label="Toggle text direction">LTR</button>
      <button class="chip" id="densityBtn" aria-label="Cycle performance tier">Balanced</button>
      <span class="save-state" id="saveState" aria-live="polite">Saved</span>
    </section>

    <main class="workspace" id="workspace">
      <div class="phone-stage" id="phoneStage" data-width="393">
        <div id="gjs"></div>
      </div>
    </main>

    <nav class="dock" aria-label="Design tools">
      <button class="dock-button active" data-panel="add"><span>＋</span><small>Add</small></button>
      <button class="dock-button" data-panel="layers"><span>≡</span><small>Layers</small></button>
      <button class="dock-button" data-panel="design"><span>◫</span><small>Design</small></button>
      <button class="dock-button" data-panel="states"><span>◉</span><small>States</small></button>
      <button class="dock-button" data-panel="more"><span>•••</span><small>More</small></button>
    </nav>
  </div>

  <div class="backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="sheetTitle">
    <div class="sheet-handle" aria-hidden="true"></div>
    <header class="sheet-header">
      <div><h2 id="sheetTitle">Add</h2><p id="sheetSubtitle"></p></div>
      <button class="icon-button" id="closeSheet" aria-label="Close panel">×</button>
    </header>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <section class="preview-shell" id="previewShell" hidden>
    <header class="preview-bar">
      <button class="icon-button" id="exitPreview" aria-label="Exit preview">×</button>
      <strong>Prototype Preview</strong>
      <span class="spacer"></span>
      <span id="previewDeviceLabel">393px</span>
    </header>
    <div class="preview-stage"><iframe id="previewFrame" title="Seven prototype preview"></iframe></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/grapesjs@0.23.6/dist/grapes.min.js"></script>
  <script src="./studio-bridge.js"></script>
  <script src="./studio.js"></script>
  <script src="./home-2026.js"></script>
  <script src="./mobile-polish.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
