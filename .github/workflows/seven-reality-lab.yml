name: Seven Reality Lab

on:
  workflow_run:
    workflows: ["Seven Remake Android Release Gate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Exact candidate commit SHA or ref to evaluate
        required: true
        type: string
      source_run:
        description: Source Superloop run ID
        required: false
        default: manual
        type: string

permissions:
  contents: read
  actions: read

jobs:
  installed-android-evidence:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    env:
      CANDIDATE_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event.inputs.candidate_ref }}
      SOURCE_RUN: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.event.inputs.source_run }}
    timeout-minutes: 75
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Initialize Reality Lab evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reality-evidence
          git rev-parse HEAD | tee reality-evidence/source-sha.txt
          printf '%s\n' "$SOURCE_RUN" > reality-evidence/source-run.txt
          printf '%s\n' "ARTIFACT_BINDING_PENDING" > reality-evidence/status.txt

      - name: Download exact Android Gate artifacts via REST
        if: ${{ env.SOURCE_RUN != '' && env.SOURCE_RUN != 'manual' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p reality-source-apk reality-source-identity
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          artifacts_json="$(curl -fsSL --retry 8 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/actions/runs/$SOURCE_RUN/artifacts?per_page=100")"
          apk_id="$(jq -r '.artifacts[] | select(.name=="Seven-Remake-V3.apk") | .id' <<<"$artifacts_json" | head -1)"
          identity_id="$(jq -r '.artifacts[] | select(.name=="Seven-Remake-V3-Release-Identity.json") | .id' <<<"$artifacts_json" | head -1)"
          test -n "$apk_id" && test "$apk_id" != null
          test -n "$identity_id" && test "$identity_id" != null
          printf '%s\n' "$apk_id" > reality-evidence/apk-artifact-id.txt
          printf '%s\n' "$identity_id" > reality-evidence/identity-artifact-id.txt

          download_raw_artifact() {
            local id="$1" output="$2"
            curl -fL --retry 10 --retry-all-errors --retry-delay 2 \
              --connect-timeout 20 --max-time 180 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api/actions/artifacts/$id/zip" -o "$output"
            test -s "$output"
          }

          # Android Gate uploads these with archive:false. The artifact download
          # endpoint therefore returns the raw APK / JSON bytes, not a ZIP wrapper.
          download_raw_artifact "$apk_id" reality-source-apk/Seven-Remake-V3.apk
          download_raw_artifact "$identity_id" reality-source-identity/Seven-Remake-V3-Release-Identity.json
          unzip -t reality-source-apk/Seven-Remake-V3.apk
          jq -e . reality-source-identity/Seven-Remake-V3-Release-Identity.json >/dev/null
          printf '%s\n' "ARTIFACTS_DOWNLOADED" > reality-evidence/status.txt

      - name: Bind exact release artifact evidence
        if: ${{ env.SOURCE_RUN != '' && env.SOURCE_RUN != 'manual' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reality-evidence
          apk="$(find reality-source-apk -type f -name '*.apk' -print -quit)"
          identity="$(find reality-source-identity -type f -name '*.json' -print -quit)"
          test -n "$apk"
          test -n "$identity"
          cp "$apk" reality-evidence/candidate.apk
          cp "$identity" reality-evidence/release-identity.json
          sha256sum reality-evidence/candidate.apk | tee reality-evidence/apk.sha256
          git rev-parse HEAD | tee reality-evidence/source-sha.txt
          printf '%s\n' "ARTIFACT_IDENTITY_BOUND" > reality-evidence/status.txt
          unzip -p reality-evidence/candidate.apk assets/public/seven-remake-release.json > reality-evidence/embedded-release-identity.json
          cmp reality-evidence/release-identity.json reality-evidence/embedded-release-identity.json
          node - <<'NODE'
          const fs=require('fs');
          const identity=JSON.parse(fs.readFileSync('reality-evidence/release-identity.json','utf8'));
          const source=fs.readFileSync('reality-evidence/source-sha.txt','utf8').trim();
          if(identity.sourceCommit && identity.sourceCommit!==source){
            throw new Error(`release identity source mismatch: ${identity.sourceCommit} != ${source}`);
          }
          if(identity.artifactId!=='ai.seven.remake.v3')throw new Error('wrong artifact identity');
          if(!/^[a-f0-9]{64}$/.test(identity.payloadSha256||''))throw new Error('invalid payload identity');
          console.log('Exact Android Gate artifact identity: PASS', identity.payloadSha256);
          NODE

      - name: Build candidate APK for manual Reality Lab
        if: ${{ env.SOURCE_RUN == '' || env.SOURCE_RUN == 'manual' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reality-evidence
          test -f remake/package.json
          cd remake
          npm install --no-audit --no-fund
          node - <<'NODE' > /tmp/seven-build-command
          const p=require('./package.json');
          const s=p.scripts||{};
          for (const k of ['android:ci','android:build','android:generate']) {
            if (s[k]) { console.log(k); process.exit(0); }
          }
          process.exit(2);
          NODE
          script="$(cat /tmp/seven-build-command)"
          npm run "$script"
          cd ..
          apk="$(find remake -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" reality-evidence/candidate.apk
          sha256sum reality-evidence/candidate.apk | tee reality-evidence/apk.sha256
          git rev-parse HEAD | tee reality-evidence/source-sha.txt
          printf '%s\n' "$SOURCE_RUN" > reality-evidence/source-run.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Materialize Reality Lab journey script
        shell: bash
        run: |
          set -euo pipefail
          cat > reality-evidence/run-reality-lab.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          apk="reality-evidence/candidate.apk"
          test -s "$apk"
          adb install -r "$apk"
          pkg="$(aapt dump badging "$apk" | sed -n "s/package: name='\([^']*\)'.*/\1/p" | head -1)"
          test -n "$pkg"
          printf '%s\n' "$pkg" > reality-evidence/package.txt
          adb shell monkey -p "$pkg" -c android.intent.category.LAUNCHER 1
          sleep 5
          adb exec-out screencap -p > reality-evidence/cold-launch.png
          adb shell uiautomator dump /sdcard/seven-ui.xml >/dev/null
          adb pull /sdcard/seven-ui.xml reality-evidence/cold-launch-ui.xml
          adb shell input keyevent KEYCODE_BACK || true
          sleep 1
          adb exec-out screencap -p > reality-evidence/after-back.png
          adb shell am force-stop "$pkg"
          adb shell monkey -p "$pkg" -c android.intent.category.LAUNCHER 1
          sleep 3
          adb exec-out screencap -p > reality-evidence/relaunch.png
          adb shell cmd uimode night yes || true
          adb shell am force-stop "$pkg"
          adb shell monkey -p "$pkg" -c android.intent.category.LAUNCHER 1
          sleep 3
          adb exec-out screencap -p > reality-evidence/night.png
          node - <<'NODE'
          const fs=require('fs');
          const sha=fs.readFileSync('reality-evidence/apk.sha256','utf8').trim().split(/\s+/)[0];
          const source=fs.readFileSync('reality-evidence/source-sha.txt','utf8').trim();
          const files=fs.readdirSync('reality-evidence').sort();
          fs.writeFileSync('reality-evidence/reality-summary.json',JSON.stringify({
            schemaVersion:1,status:'INSTALLED_ARTIFACT_EVIDENCE_CAPTURED',
            evidenceTier:'ANDROID_EMULATOR',sourceSha:source,apkSha256:sha,
            journeysProven:['cold-launch','system-back-smoke','force-stop-relaunch','night-theme-launch-smoke'],
            journeysNotYetProven:['full-chat','stream-stop','room-race','arabic-rtl','ime','files','search','process-state-assertion'],
            files
          },null,2));
          NODE
          SH
          chmod +x reality-evidence/run-reality-lab.sh

      - name: Installed-artifact Reality Lab
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash reality-evidence/run-reality-lab.sh

      - name: Upload Reality Lab evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seven-reality-lab-${{ github.run_number }}
          path: reality-evidence
          if-no-files-found: error
          retention-days: 30
