name: Seven Remake Zero Bug Direct 32

on:
  workflow_dispatch:
  push:
    branches:
      - remake-manager/zero-bug-pass-01
    paths:
      - '.github/workflows/seven-remake-zero-bug-direct32.yml'

permissions:
  contents: write

concurrency:
  group: seven-remake-zero-bug-direct32
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remake-manager/zero-bug-pass-01
          fetch-depth: 0
          persist-credentials: false

      - name: Pin target and prepare evidence
        run: |
          set -euo pipefail
          cp .seven-team/zero-bug/manifest.json /tmp/manifest.json
          TARGET_SHA="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/manifest.json'))['targetHead'])
          PY
          )"
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
          git fetch origin "$TARGET_SHA"
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git show "$TARGET_SHA":.seven-team/runtime/kilo_anonymous_relay.py > /tmp/kilo_anonymous_relay.py
          python - <<'PY'
          from pathlib import Path
          roots=[
              Path('remake/src/core'),
              Path('remake/src/domain'),
              Path('remake/src/storage'),
              Path('remake/src/application'),
              Path('remake/src/providers'),
              Path('remake/src/routing'),
              Path('remake/src/integration/phase12'),
          ]
          files=[]
          for root in roots:
              if root.exists():
                  files.extend(sorted(p for p in root.rglob('*') if p.is_file() and p.suffix in {'.ts','.tsx'}))
          chunks=[]; total=0; cap=160000
          for p in files:
              raw=p.read_text(encoding='utf-8',errors='replace')
              block="===== "+p.as_posix()+" =====\n"+raw+"\n"
              if total+len(block)>cap:
                  rem=cap-total
                  if rem>500: chunks.append(block[:rem])
                  break
              chunks.append(block); total+=len(block)
          evidence='\n'.join(chunks)
          Path('/tmp/evidence.txt').write_text(evidence,encoding='utf-8')
          print('evidence chars',len(evidence),'files',len(files))
          PY

      - name: Start guarded relay
        run: |
          set -euo pipefail
          python /tmp/kilo_anonymous_relay.py >/tmp/relay.log 2>&1 &
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8877/v1/models >/tmp/models.json; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1

      - name: Run 32 independent direct auditors
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures as cf
          import json, pathlib, time, urllib.request

          manifest=json.load(open('/tmp/manifest.json'))
          evidence=pathlib.Path('/tmp/evidence.txt').read_text(encoding='utf-8')
          target=manifest['targetHead']
          auditors=manifest['auditors']
          catalog=json.load(open('/tmp/models.json'))
          rows=catalog.get('data',catalog if isinstance(catalog,list) else [])
          mids=[]
          for row in rows:
              mid=row.get('id') if isinstance(row,dict) else row if isinstance(row,str) else None
              if isinstance(mid,str) and ':free' in mid and not mid.startswith('kilo-auto/'):
                  mids.append(mid)

          def rank(mid):
              low=mid.lower()
              preferred=('qwen','z-ai/glm','minimax/','moonshot','google/','nvidia/nemotron')
              for score,key in enumerate(preferred):
                  if key in low: return (score,mid)
              return (20,mid)

          mids=sorted(dict.fromkeys(mids),key=rank)
          if not mids:
              raise SystemExit('No direct free models')
          pool=mids[:min(14,len(mids))]
          base='http://127.0.0.1:8877/v1'
          severities={'CRITICAL','HIGH','MEDIUM','LOW'}
          banned={
              'short title','file/function and concrete reason',
              'deterministic test/repro','minimal root-cause fix',
              'CRITICAL|HIGH|MEDIUM|LOW'
          }

          def validate(aid,text):
              lines=[x.strip() for x in text.splitlines() if x.strip()]
              marker=[x for x in lines if x.startswith('ZERO_AUDIT_JSON=')]
              if len(marker)!=1: raise ValueError('one marker required')
              data=json.loads(marker[0][len('ZERO_AUDIT_JSON='):])
              if data.get('id')!=aid: raise ValueError('wrong id')
              if data.get('status') not in {'PASS','BUG'}: raise ValueError('bad status')
              findings=data.get('findings')
              if not isinstance(findings,list) or len(findings)>8: raise ValueError('bad findings')
              if data['status']=='PASS' and findings: raise ValueError('PASS with findings')
              if data['status']=='BUG' and not findings: raise ValueError('BUG without findings')
              titles=set()
              for f in findings:
                  if not isinstance(f,dict): raise ValueError('bad finding')
                  sev=f.get('severity'); title=f.get('title'); ev=f.get('evidence'); repro=f.get('repro'); fix=f.get('fix')
                  if sev not in severities: raise ValueError('bad severity')
                  if not isinstance(title,str) or len(title.strip())<8 or title in titles: raise ValueError('bad title')
                  titles.add(title)
                  if not isinstance(ev,str) or len(ev.strip())<20 or 'remake/src/' not in ev: raise ValueError('bad evidence')
                  if not isinstance(repro,str) or len(repro.strip())<20: raise ValueError('bad repro')
                  if not isinstance(fix,str) or len(fix.strip())<15: raise ValueError('bad fix')
                  joined=' '.join([sev,title,ev,repro,fix])
                  if any(x in joined for x in banned): raise ValueError('placeholder')
              return data

          def run_one(auditor):
              aid=auditor['id']; focus=auditor['focus']
              slot=max(0,int(aid[1:])-1)
              rotated=pool[slot%len(pool):]+pool[:slot%len(pool)]
              system=(
                  'You are a meticulous adversarial software auditor. '
                  'Use only supplied source evidence. Do not invent facts. '
                  'Future milestones are not bugs. Return a machine result only.'
              )
              user=(
                  'AUDITOR ID: '+aid+'\n'
                  'FOCUS: '+focus+'\n\n'
                  'Audit Seven Remake Phase 1-2 only. A finding must be a concrete existing bug. '
                  'If none survive scrutiny, report PASS.\n'
                  'Your response must contain one final line whose literal prefix is ZERO_AUDIT_JSON= '
                  'followed by compact JSON with id, status, findings. '
                  'PASS has empty findings. BUG has 1-8 findings. '
                  'Each finding requires severity exactly CRITICAL/HIGH/MEDIUM/LOW, a specific title, '
                  'evidence citing an exact remake/src/... path and logic, a deterministic repro, '
                  'and a minimal root-cause fix. Do not emit templates or placeholders.\n\n'
                  'SOURCE EVIDENCE:\n'+evidence
              )
              failures=[]
              for mid in rotated:
                  body=json.dumps({
                      'model':mid,
                      'messages':[{'role':'system','content':system},{'role':'user','content':user}],
                      'temperature':0,
                      'max_tokens':2800,
                      'stream':False
                  }).encode()
                  req=urllib.request.Request(base+'/chat/completions',data=body,headers={'Content-Type':'application/json'})
                  try:
                      with urllib.request.urlopen(req,timeout=150) as res:
                          data=json.load(res)
                      choices=data.get('choices') or []
                      msg=(choices[0].get('message') or {}) if choices else {}
                      texts=[x for x in (msg.get('content'),msg.get('reasoning_content')) if isinstance(x,str) and x.strip()]
                      for raw in texts:
                          try:
                              report=validate(aid,raw)
                              return {'auditor':aid,'model':mid,'targetSha':target,'report':report}
                          except Exception:
                              pass
                      failures.append(mid+':invalid')
                  except Exception as exc:
                      failures.append(mid+':'+type(exc).__name__)
                  time.sleep(0.5)
              raise RuntimeError(aid+' no valid model result: '+'; '.join(failures))

          results=[]; errors=[]
          with cf.ThreadPoolExecutor(max_workers=6) as executor:
              future_map={executor.submit(run_one,a):a['id'] for a in auditors}
              for fut in cf.as_completed(future_map):
                  aid=future_map[fut]
                  try:
                      result=fut.result()
                      results.append(result)
                      print('AUDIT',aid,result['report']['status'],len(result['report']['findings']),result['model'],flush=True)
                  except Exception as exc:
                      errors.append((aid,str(exc)))
                      print('AUDIT_FAIL',aid,str(exc),flush=True)

          results.sort(key=lambda x:x['auditor'])
          pathlib.Path('/tmp/audit-results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          if errors:
              pathlib.Path('/tmp/audit-errors.json').write_text(json.dumps(errors,ensure_ascii=False,indent=2),encoding='utf-8')
              raise SystemExit('Missing valid auditor reports: '+', '.join(a for a,_ in errors))
          if len(results)!=32:
              raise SystemExit(f'Expected 32 reports, got {len(results)}')
          PY

      - name: Build strict summary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          results=json.load(open('/tmp/audit-results.json'))
          findings=[]
          lines=[
              '# Seven Remake — Strict Direct 32-Agent Zero Bug Audit',
              '',
              'Target SHA: '+str(results[0]['targetSha'] if results else 'NONE'),
              f'Valid auditor reports: {len(results)}/32',
              '',
              '## Auditor status',
          ]
          for w in results:
              r=w['report']
              lines.append(f"- {w['auditor']}: {r['status']} ({len(r['findings'])} findings) via {w['model']}")
              for finding in r['findings']:
                  findings.append((w['auditor'],finding))
          lines += ['', '## Concrete findings']
          if not findings:
              lines.append('No concrete bugs reported.')
          else:
              for aid,f in findings:
                  lines += [
                      f"### {aid} — {f['severity']} — {f['title']}",
                      '- Evidence: '+f['evidence'],
                      '- Repro: '+f['repro'],
                      '- Fix: '+f['fix'],
                      ''
                  ]
          lines += [
              '',
              f'VALID_REPORTS={len(results)}/32',
              f'CONCRETE_FINDINGS={len(findings)}',
              'TARGET_SHA='+str(results[0]['targetSha'] if results else 'NONE'),
              'ZERO_BUG_DIRECT32=COMPLETE',
              ''
          ]
          out=pathlib.Path('.seven-team/zero-bug/AUDIT_DIRECT32_SUMMARY.md')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text('\n'.join(lines),encoding='utf-8')
          pathlib.Path('/tmp/counts.json').write_text(json.dumps({'reports':len(results),'findings':len(findings)}))
          print('\n'.join(lines[-6:]))
          PY

      - name: Commit audit summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git checkout remake-manager/zero-bug-pass-01
          git pull --rebase origin remake-manager/zero-bug-pass-01
          cp .seven-team/zero-bug/AUDIT_DIRECT32_SUMMARY.md /tmp/direct32-summary.md || true
          git checkout "$TARGET_SHA" -- .seven-team/zero-bug 2>/dev/null || true
          mkdir -p .seven-team/zero-bug
          cp /tmp/direct32-summary.md .seven-team/zero-bug/AUDIT_DIRECT32_SUMMARY.md
          git add -f .seven-team/zero-bug/AUDIT_DIRECT32_SUMMARY.md
          if ! git diff --cached --quiet; then
            git config user.name 'Seven Direct32 Audit'
            git config user.email 'actions@users.noreply.github.com'
            git commit -m 'Collect strict Direct32 zero-bug audit'
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:remake-manager/zero-bug-pass-01
          fi

      - name: Enforce zero findings
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/counts.json'))
          assert d['reports']==32, d
          assert d['findings']==0, d
          print('DIRECT32 ZERO BUG GATE PASS')
          PY
