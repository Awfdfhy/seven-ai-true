name: Seven Remake Dependency Audit Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - remake-manager/zero-bug-pass-01
    paths:
      - '.github/workflows/seven-remake-dependency-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: remake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Print vulnerability summary
        run: |
          set +e
          npm audit --json > /tmp/audit.json
          set -e
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'));
          console.log('metadata',JSON.stringify(d.metadata?.vulnerabilities||{}));
          for (const [name,v] of Object.entries(d.vulnerabilities||{})) {
            console.log(JSON.stringify({
              name,
              severity:v.severity,
              isDirect:v.isDirect,
              via:(v.via||[]).map(x=>typeof x==='string'?x:{source:x.source,name:x.name,severity:x.severity,title:x.title,range:x.range}),
              effects:v.effects,
              range:v.range,
              nodes:v.nodes,
              fixAvailable:v.fixAvailable
            }));
          }
          NODE
