name: Seven Cline Live Agent Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.seven-team/prompts/live-smoke/team-a-cline.md'
      - '.seven-team/prompts/live-smoke/team-b-cline.md'
      - '.github/workflows/agent-live-cline-smoke.yml'

permissions:
  contents: write

concurrency:
  group: seven-cline-live-smoke
  cancel-in-progress: true

jobs:
  cline-live:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: Team A Cline live edit
            branch: agent/01-ui-ux
            prompt_path: .seven-team/prompts/live-smoke/team-a-cline.md
            report: .seven-team/reports/team-a-cline-live-smoke.md
            commit_message: Agent A01 Cline live runtime smoke report
            data_dir: /tmp/cline-a
          - name: Team B Cline live edit
            branch: agent-b/01-rpg-ux
            prompt_path: .seven-team/prompts/live-smoke/team-b-cline.md
            report: .seven-team/reports/team-b-cline-live-smoke.md
            commit_message: Agent B01 Cline live runtime smoke report
            data_dir: /tmp/cline-b

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Cline
        run: npm install -g cline

      - name: Materialize guarded runtime and prompt from main
        run: |
          git fetch origin main
          git show origin/main:.seven-team/runtime/kilo_anonymous_relay.py > /tmp/kilo_anonymous_relay.py
          git show origin/main:${{ matrix.prompt_path }} > /tmp/cline-prompt.md

      - name: Start guarded relay
        run: |
          python /tmp/kilo_anonymous_relay.py > /tmp/seven-relay.log 2>&1 &
          ready=0
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8877/v1/models >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1

      - name: Configure isolated OpenAI-compatible provider
        run: |
          cline --data-dir "${{ matrix.data_dir }}" auth \
            --provider openai-compatible \
            --apikey local-dummy-key \
            --modelid kilo-auto/free \
            --baseurl http://127.0.0.1:8877/v1

      - name: Run real Cline agent
        run: |
          set -u
          mkdir -p "$(dirname "${{ matrix.report }}")"
          set +e
          timeout 150s cline \
            --data-dir "${{ matrix.data_dir }}" \
            --yolo \
            --timeout 120 \
            --retries 1 \
            "$(cat /tmp/cline-prompt.md)"
          rc=$?
          set -e
          if test -f "${{ matrix.report }}" && grep -q 'LIVE_AGENT_SMOKE=PASS' "${{ matrix.report }}"; then
            echo "Cline produced required report; accepting output (rc=$rc)."
          else
            echo "Cline did not produce required report (rc=$rc)." >&2
            exit "${rc:-1}"
          fi

      - name: Sanitize to allowed output only
        run: |
          set -euo pipefail
          EXPECTED='${{ matrix.report }}'
          cp "$EXPECTED" /tmp/seven-agent-report.md
          git reset --hard HEAD
          git clean -fdx
          mkdir -p "$(dirname "$EXPECTED")"
          cp /tmp/seven-agent-report.md "$EXPECTED"
          git add -f "$EXPECTED"
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "$EXPECTED"

      - name: Commit and push controlled report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'Seven Team Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m "${{ matrix.commit_message }}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${{ matrix.branch }}
