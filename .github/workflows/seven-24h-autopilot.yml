name: Seven 24h Autopilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seven-24h-autopilot.yml'
      - '.seven-team/prompts/autopilot-24h.md'
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: seven-24h-autopilot
  cancel-in-progress: false

env:
  AUTOPILOT_START_UTC: '2026-10-03T21:42:00Z'
  AUTOPILOT_END_UTC: '2026-10-04T21:42:00Z'
  AUTOPILOT_BRANCH: 'autopilot/seven-24h-work'
  BASE_BRANCH: 'seven-remake-v3'

jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout workflow control branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce 24 hour window
        id: window
        shell: bash
        run: |
          set -euo pipefail
          now="$(date -u +%s)"
          start="$(date -u -d "$AUTOPILOT_START_UTC" +%s)"
          end="$(date -u -d "$AUTOPILOT_END_UTC" +%s)"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "expired=false" >> "$GITHUB_OUTPUT"
          elif (( now < start )); then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "expired=false" >> "$GITHUB_OUTPUT"
          elif (( now >= end )); then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "expired=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "expired=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Self-deactivate after 24 hours
        if: steps.window.outputs.expired == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'Seven 24h Autopilot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/seven-24h-autopilot.yml .seven-team/prompts/autopilot-24h.md
          git commit -m "Deactivate completed Seven 24h autopilot"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: Stop outside active window
        if: steps.window.outputs.active != 'true'
        run: echo "Seven 24h autopilot is outside its active window."

      - name: Prepare persistent work branch
        if: steps.window.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_BRANCH" main
          if git ls-remote --exit-code --heads origin "$AUTOPILOT_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$AUTOPILOT_BRANCH"
            git checkout -B "$AUTOPILOT_BRANCH" "origin/$AUTOPILOT_BRANCH"
            git merge --no-edit "origin/$BASE_BRANCH"
          else
            git checkout -B "$AUTOPILOT_BRANCH" "origin/$BASE_BRANCH"
          fi

      - name: Setup Node
        if: steps.window.outputs.active == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Codex
        if: steps.window.outputs.active == 'true'
        run: npm install -g @openai/codex@latest

      - name: Materialize guarded agent runtime
        if: steps.window.outputs.active == 'true'
        run: |
          set -euo pipefail
          git show origin/main:.seven-team/runtime/kilo_anonymous_relay.py > /tmp/kilo_anonymous_relay.py
          git show origin/main:.seven-team/runtime/codex_responses_bridge.py > /tmp/codex_responses_bridge.py
          git show origin/main:.seven-team/prompts/autopilot-24h.md > /tmp/base-prompt.md
          mkdir -p .seven-team/reports/autopilot
          REPORT=".seven-team/reports/autopilot/run-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.md"
          {
            cat /tmp/base-prompt.md
            echo
            echo "## This batch"
            echo "GitHub run: ${GITHUB_RUN_ID}"
            echo "Run number: ${GITHUB_RUN_NUMBER}"
            echo "UTC: $(date -u +%FT%TZ)"
            echo "Required report path: ${REPORT}"
          } > /tmp/autopilot-prompt.md
          echo "AUTOPILOT_REPORT=${REPORT}" >> "$GITHUB_ENV"

      - name: Start anonymous relay
        if: steps.window.outputs.active == 'true'
        run: |
          set -euo pipefail
          python /tmp/kilo_anonymous_relay.py >/tmp/seven-relay.log 2>&1 &
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8877/v1/models >/tmp/models.json; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1

      - name: Select a healthy free coding model
        if: steps.window.outputs.active == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, os
          payload=json.load(open('/tmp/models.json'))
          rows=payload.get('data', payload if isinstance(payload,list) else [])
          ids=[]
          for row in rows:
              mid=row.get('id') if isinstance(row,dict) else row if isinstance(row,str) else None
              if isinstance(mid,str) and ':free' in mid and not mid.startswith('kilo-auto/'):
                  ids.append(mid)
          preferred=('qwen','z-ai/glm','minimax/','nvidia/nemotron','moonshot','google/')
          def rank(mid):
              low=mid.lower()
              for i,key in enumerate(preferred):
                  if key in low: return (i,mid)
              return (20,mid)
          ids=sorted(dict.fromkeys(ids),key=rank)
          selected=None
          for mid in ids[:16]:
              req=urllib.request.Request(
                  'http://127.0.0.1:8877/v1/chat/completions',
                  data=json.dumps({
                      'model':mid,
                      'messages':[{'role':'user','content':'Reply exactly OK'}],
                      'temperature':0,'max_tokens':12,'stream':False
                  }).encode(),
                  headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=40) as response:
                      data=json.load(response)
                  msg=((data.get('choices') or [{}])[0].get('message') or {})
                  if (msg.get('content') or msg.get('reasoning_content') or '').strip():
                      selected=mid
                      break
              except Exception:
                  pass
          if not selected:
              selected='kilo-auto/free'
          print('Selected',selected)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('AUTOPILOT_MODEL='+selected+'\n')
          PY

      - name: Start Codex compatibility bridge
        if: steps.window.outputs.active == 'true'
        run: |
          set -euo pipefail
          SEVEN_CODEX_MODEL="$AUTOPILOT_MODEL" python /tmp/codex_responses_bridge.py >/tmp/codex-bridge.log 2>&1 &
          ready=0
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8878/v1/models >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1

      - name: Run autonomous coding batch
        if: steps.window.outputs.active == 'true'
        env:
          SEVEN_CODEX_KEY: local-dummy-key
          CODEX_HOME: /tmp/seven-24h-codex
        run: |
          set -u
          mkdir -p "$CODEX_HOME"
          ok=0
          for attempt in 1 2; do
            set +e
            timeout 2100s codex exec               --skip-git-repo-check               -m "$AUTOPILOT_MODEL"               -c 'approval_policy="never"'               -c 'sandbox_mode="danger-full-access"'               -c 'model_provider="seven"'               -c 'model_providers.seven={name="Seven Local Bridge",base_url="http://127.0.0.1:8878/v1",env_key="SEVEN_CODEX_KEY",wire_api="responses",requires_openai_auth=false,supports_websockets=false,request_max_retries=2,stream_max_retries=2}'               "$(cat /tmp/autopilot-prompt.md)"
            rc=$?
            set -e
            if test -f "$AUTOPILOT_REPORT" && grep -q '^AUTOPILOT_BATCH=COMPLETE$' "$AUTOPILOT_REPORT"; then
              ok=1
              break
            fi
            echo "Agent attempt $attempt incomplete (rc=$rc)." >&2
          done
          test "$ok" -eq 1

      - name: Enforce write boundaries
        if: steps.window.outputs.active == 'true'
        run: |
          set -euo pipefail
          rm -rf remake/dist
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          test "${#changed[@]}" -gt 0
          code_change=0
          for f in "${changed[@]}"; do
            case "$f" in
              remake/*) code_change=1 ;;
              apk/remake-*) code_change=1 ;;
              .github/workflows/seven-remake-android.yml) code_change=1 ;;
              .seven-team/reports/autopilot/*) ;;
              *) echo "Autopilot scope violation: $f" >&2; exit 1 ;;
            esac
            case "$f" in
              *.env|*.keystore|*.jks|*credentials*|*id_rsa*|*secret*) echo "Forbidden sensitive path: $f" >&2; exit 1 ;;
            esac
          done
          test "$code_change" -eq 1
          grep -q '^AUTOPILOT_BATCH=COMPLETE$' "$AUTOPILOT_REPORT"

      - name: Remake security and correctness gates
        if: steps.window.outputs.active == 'true'
        working-directory: remake
        run: |
          set -euo pipefail
          npm install
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=moderate
          npm run typecheck
          npm test
          npm run build

      - name: Commit validated batch
        if: steps.window.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf remake/dist
          git add remake .seven-team/reports/autopilot
          if compgen -G 'apk/remake-*' >/dev/null; then git add apk/remake-*; fi
          if test -f .github/workflows/seven-remake-android.yml; then git add .github/workflows/seven-remake-android.yml; fi
          if git diff --cached --quiet; then
            echo "No validated changes to commit."
            exit 0
          fi
          git config user.name 'Seven 24h Autopilot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m "Seven 24h autopilot batch ${GITHUB_RUN_NUMBER}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"$AUTOPILOT_BRANCH"

      - name: Create or update persistent PR
        if: steps.window.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin "$AUTOPILOT_BRANCH" >/dev/null 2>&1; then
            exit 0
          fi
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$AUTOPILOT_BRANCH" --base "$BASE_BRANCH" --json number --jq '.[0].number // empty')"
          if [[ -z "$number" ]]; then
            gh pr create               --repo "$GITHUB_REPOSITORY"               --base "$BASE_BRANCH"               --head "$AUTOPILOT_BRANCH"               --title "Seven AI — 24h autonomous development"               --body "Autonomous 24-hour coding branch. Every committed batch passed remake typecheck, dependency audits, tests and production build before push. Review CI and reports before merge."
          else
            echo "Persistent autopilot PR #$number updated."
          fi

      - name: Dispatch independent Remake CI
        if: steps.window.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$AUTOPILOT_BRANCH" >/dev/null 2>&1; then
            gh workflow run seven-remake-ci.yml --repo "$GITHUB_REPOSITORY" --ref "$AUTOPILOT_BRANCH" || true
          fi
