name: Seven AI tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-save playwright

      - run: npx playwright install --with-deps --only-shell chromium

      - run: node all.cjs

      - name: Upload verified release artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: seven-ai-release
          path: |
            dist/seven_ai-release.html
            dist/release-manifest.json
            release/release-results.json
          if-no-files-found: error
          retention-days: 14
