name: Seven AI tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install

      - run: npx playwright install --with-deps --only-shell chromium

      - run: node all.cjs

      - name: Upload verified Ultimate release artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: seven-ultimate-release
          path: |
            dist/seven-ultimate-release.html
            dist/ultimate-app.js
            dist/ultimate-build.json
            dist/ultimate-metafile.json
            dist/ultimate-release-verify.json
            dist/src/**
          if-no-files-found: error
          retention-days: 14
