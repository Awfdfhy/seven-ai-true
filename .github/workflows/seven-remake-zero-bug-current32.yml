name: Seven Remake Zero Bug Current32

on:
  push:
    branches:
      - remake-manager/zero-bug-pass-01
    paths:
      - '.github/workflows/seven-remake-zero-bug-current32.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seven-remake-zero-bug-current32-final
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - { id: C01, focus: "TaskManager lifecycle terminal states cancellation sealing deadline sealing retention and owner isolation" }
          - { id: C02, focus: "Cancellation races before start during storage during stream after user-cancel seal and at deadline" }
          - { id: C03, focus: "Timeout bounds timer cleanup deadline semantics clock rollback and uncooperative executors" }
          - { id: C04, focus: "Observer listener isolation reentrancy thrown callbacks and snapshot safety" }
          - { id: C05, focus: "Room and message invariants immutable snapshots canonical IDs timestamps duplicate IDs and malformed runtime values" }
          - { id: C06, focus: "Room persistence round trip deterministic ordering invalid writes and abort behavior" }
          - { id: C07, focus: "IndexedDB open blocked upgrade versionchange close transaction abort failure and retry lifecycle" }
          - { id: C08, focus: "ChatService ownership concurrent sends preflight cancellation missing room and input validation" }
          - { id: C09, focus: "Chat persistence failure semantics before user write after user write and during final assistant commit" }
          - { id: C10, focus: "Streaming draft final commit exactly once cancellation partial responses and durable commit boundary" }
          - { id: C11, focus: "Assistant draft resource bounds oversized transport deltas long streams and memory exhaustion" }
          - { id: C12, focus: "Provider message invariant malformed roles content and exactly one leading system message" }
          - { id: C13, focus: "ModelDescriptor runtime validation capabilities numeric edges canonical identities and collision-safe keys" }
          - { id: C14, focus: "ProviderAdapter runtime contract malformed chunks adapter identity provider snapshot and mutable registry races" }
          - { id: C15, focus: "Fallback before meaningful output whitespace prelude empty output malformed chunks and bounded prelude" }
          - { id: C16, focus: "Failure after first meaningful token and prevention of cross-provider answer splicing" }
          - { id: C17, focus: "Provider error normalization retryAfter handling privacy safe diagnostics and unknown thrown values" }
          - { id: C18, focus: "ModelRegistry atomic replacement duplicates immutable snapshots and malformed model lists" }
          - { id: C19, focus: "ModelRouter quick balanced deep determinism tie breaks numeric overflow and capability filtering" }
          - { id: C20, focus: "Preferred model resolution cross-provider collisions qualified model identities and ambiguous bare IDs" }
          - { id: C21, focus: "ProviderHealth penalties cooldowns stale success and stale failure ordering attempt generations and recovery" }
          - { id: C22, focus: "Routing runtime boundary validation modes booleans arrays IDs timestamps plans candidates and provider maps" }
          - { id: C23, focus: "Concurrency across rooms providers TaskManager instances and shared service state" }
          - { id: C24, focus: "Restart restore persistence consistency schema corruption and migration-free current version handling" }
          - { id: C25, focus: "Architecture invariants no mutable Seven globals storage ownership and domain adapter boundaries" }
          - { id: C26, focus: "UI isolation from provider network storage and native concerns in current Phase 1-2 scope" }
          - { id: C27, focus: "Security privacy raw provider errors secrets causes unknown values and diagnostic exposure" }
          - { id: C28, focus: "Performance resource behavior cloning maps arrays listeners timers streams and pathological inputs" }
          - { id: C29, focus: "TypeScript runtime mismatch attacks using malformed JavaScript values at all public boundaries" }
          - { id: C30, focus: "Cross-module contract consistency among chat TaskManager repository router provider health and transport" }
          - { id: C31, focus: "Existing regression blind spots that correspond to concrete current production failures not future work" }
          - { id: C32, focus: "Holistic adversarial review for any concrete Phase 1-2 bug missed by narrower audits" }

    steps:
      - uses: actions/checkout@v4
        with:
          ref: remake-manager/zero-bug-pass-01
          fetch-depth: 0

      - name: Build immutable candidate evidence
        run: |
          set -euo pipefail
          git show HEAD:.seven-team/runtime/kilo_anonymous_relay.py > /tmp/kilo_anonymous_relay.py
          git checkout --detach 9564b2bdcfa7695a2e97668e1fb192818189557d
          python - <<'PY'
          from pathlib import Path
          files=[
            'remake/src/core/errors.ts',
            'remake/src/core/task-manager.ts',
            'remake/src/domain/chat/index.ts',
            'remake/src/storage/room-repository.ts',
            'remake/src/application/chat/chat-service.ts',
            'remake/src/providers/contracts.ts',
            'remake/src/routing/model-router.ts',
            'remake/src/integration/phase12/index.ts',
          ]
          blocks=[]
          for name in files:
              p=Path(name)
              blocks.append(f"===== {name} =====\n{p.read_text(encoding='utf-8',errors='replace')}\n")
          Path('/tmp/evidence.txt').write_text('\n'.join(blocks),encoding='utf-8')
          PY

      - name: Start direct-model relay
        run: |
          set -euo pipefail
          python /tmp/kilo_anonymous_relay.py >/tmp/relay.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8877/v1/models >/tmp/models.json; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Run current candidate audit
        env:
          AUDIT_ID: ${{ matrix.id }}
          AUDIT_FOCUS: ${{ matrix.focus }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,urllib.request
          aid=os.environ['AUDIT_ID']; focus=os.environ['AUDIT_FOCUS']
          evidence=pathlib.Path('/tmp/evidence.txt').read_text(encoding='utf-8')
          catalog=json.load(open('/tmp/models.json'))
          rows=catalog.get('data',catalog if isinstance(catalog,list) else [])
          available={row.get('id') if isinstance(row,dict) else row for row in rows}
          preferred=[
            'poolside/laguna-s-2.1:free',
            'nvidia/nemotron-3.5-lightning:free',
            'nvidia/nemotron-3-ultra-550b-a55b:free',
            'nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free',
          ]
          models=[m for m in preferred if m in available]
          if not models: raise SystemExit('No direct audit models')
          slot=max(0,int(aid[1:])-1)
          models=models[slot%len(models):]+models[:slot%len(models)]
          base='http://127.0.0.1:8877/v1'

          def ask(model,messages,max_tokens=1200,timeout=55):
              body=json.dumps({
                  'model':model,'messages':messages,'temperature':0,
                  'max_tokens':max_tokens,'stream':False
              }).encode()
              req=urllib.request.Request(base+'/chat/completions',data=body,headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=timeout) as res:
                  data=json.load(res)
              choices=data.get('choices') or []
              msg=(choices[0].get('message') or {}) if choices else {}
              vals=[v for v in (msg.get('content'),msg.get('reasoning_content')) if isinstance(v,str) and v.strip()]
              text='\n'.join(vals).strip()
              if not text: raise ValueError('empty response')
              return text

          def validate_findings(findings):
              valid=[]
              if not isinstance(findings,list): return valid
              for finding in findings[:5]:
                  if not isinstance(finding,dict): continue
                  sev=finding.get('severity')
                  path=finding.get('evidence') or finding.get('path')
                  title=finding.get('title')
                  repro=finding.get('repro')
                  fix=finding.get('fix')
                  if sev not in {'CRITICAL','HIGH','MEDIUM','LOW'}: continue
                  if not isinstance(path,str) or not path.startswith('remake/src/'): continue
                  if not isinstance(title,str) or len(title.strip())<8: continue
                  if not isinstance(repro,str) or len(repro.strip())<20: continue
                  if not isinstance(fix,str) or len(fix.strip())<15: continue
                  valid.append({
                    'severity':sev,'title':title.strip(),'evidence':path.strip(),
                    'repro':repro.strip(),'fix':fix.strip()
                  })
              return valid

          def parse_protocol(raw):
              text=raw.strip()
              compact=''.join(text.split()).upper()
              if compact in {'0','PASS'}:
                  return {'status':'PASS','findings':[]}

              cleaned=text
              if cleaned.startswith('\\`\\`\\`'):
                  cleaned=cleaned.strip('\\`').strip()
                  if cleaned.lower().startswith('json'):
                      cleaned=cleaned[4:].strip()

              start=cleaned.find('{'); end=cleaned.rfind('}')
              if start>=0 and end>start:
                  try:
                      data=json.loads(cleaned[start:end+1])
                      status=str(data.get('status','')).upper()
                      findings=validate_findings(data.get('findings'))
                      if status=='PASS' and data.get('findings')==[]:
                          return {'status':'PASS','findings':[]}
                      if status=='BUG' and findings:
                          return {'status':'BUG','findings':findings}
                  except Exception:
                      pass

              findings=[]
              for line in text.splitlines():
                  line=line.strip()
                  if line.startswith('BUG|'):
                      line='1|'+line[4:]
                  if not line.startswith('1|'): continue
                  parts=line.split('|',5)
                  if len(parts)!=6: continue
                  _,sev,path,title,repro,fix=parts
                  findings.extend(validate_findings([{
                    'severity':sev,'evidence':path,'title':title,
                    'repro':repro,'fix':fix
                  }]))
              if findings:
                  return {'status':'BUG','findings':findings[:5]}
              raise ValueError('protocol invalid')

          audit_system=(
            'You are an exacting adversarial TypeScript auditor. Use only supplied source. '
            'Never invent defects. Missing future features, style preferences, and missing tests alone are not bugs.'
          )
          audit_prompt=(
            f'Audit ID {aid}. Focus: {focus}. '
            'Analyze deeply for a deterministic current Phase 1-2 production defect. '
            'If none is provable, output exactly 0. '
            'If one or more are provable, output only lines: '
            '1|SEVERITY|remake/src/path.ts|TITLE|DETERMINISTIC REPRODUCTION|MINIMAL ROOT CAUSE FIX. '
            'No markdown.\n\nSOURCE:\n'+evidence
          )

          def format_raw(model,raw):
              fmt=(
                'Convert the AUDITOR OUTPUT below without changing its meaning. '
                'If it claims no concrete proven bug, output exactly 0. '
                'If it explicitly claims a concrete current bug, output only valid lines in format '
                '1|SEVERITY|remake/src/path.ts|TITLE|DETERMINISTIC REPRODUCTION|MINIMAL ROOT CAUSE FIX. '
                'Do not invent a bug that is not in the auditor output.\n\nAUDITOR OUTPUT:\n'+raw
              )
              return ask(model,[{'role':'system','content':'You are a deterministic report formatter. Preserve meaning exactly.'},{'role':'user','content':fmt}],700,40)

          errors=[]
          prompt_variants=[
            audit_prompt,
            audit_prompt + '\nFINAL OUTPUT MUST BE ONLY 0 OR ONE OR MORE 1|... LINES.',
          ]
          for attempt in range(8):
              model=models[attempt%len(models)]
              prompt=prompt_variants[attempt%len(prompt_variants)]
              try:
                  raw=ask(model,[{'role':'system','content':audit_system},{'role':'user','content':prompt}],1400,70)
                  try:
                      report=parse_protocol(raw)
                  except Exception:
                      formatter=models[(attempt+1)%len(models)]
                      report=parse_protocol(format_raw(formatter,raw))
                  out={'id':aid,'model':model,'status':report['status'],'findings':report['findings']}
                  pathlib.Path('/tmp/report.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
                  print('CURRENT32',aid,report['status'],len(report['findings']),model)
                  raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as exc:
                  errors.append(model+':'+type(exc).__name__)
          raise SystemExit('No valid report '+','.join(errors))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: current32-${{ matrix.id }}
          path: /tmp/report.json
          retention-days: 7

  aggregate:
    runs-on: ubuntu-latest
    needs: audit
    if: always()
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remake-manager/zero-bug-pass-01
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: current32-*
          path: /tmp/reports

      - name: Build strict Current32 report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob,json,pathlib
          expected=[f'C{i:02d}' for i in range(1,33)]
          results=[]
          for f in glob.glob('/tmp/reports/**/report.json',recursive=True):
              try: results.append(json.load(open(f,encoding='utf-8')))
              except Exception: pass
          results.sort(key=lambda x:x['id'])
          ids=[r['id'] for r in results]
          if ids!=expected:
              raise SystemExit(f'Expected 32 valid reports, got {ids}')
          findings=[(r['id'],f) for r in results for f in r['findings']]
          lines=[
            '# Seven Remake — Current32 Final Zero-Bug Audit','',
            'Target SHA: 9564b2bdcfa7695a2e97668e1fb192818189557d',
            'Valid auditor reports: 32/32',
            f'Concrete findings: {len(findings)}','',
            '## Auditor results',
          ]
          for r in results:
              lines.append(f"- {r['id']}: {r['status']} ({len(r['findings'])}) via {r['model']}")
          lines += ['', '## Findings']
          if not findings:
              lines.append('No concrete Phase 1-2 bugs were found in the completed Current32 pass.')
          else:
              for aid,f in findings:
                  lines += [
                    f"### {aid} — {f['severity']} — {f['title']}",
                    f"- Evidence: {f['evidence']}",
                    f"- Repro: {f['repro']}",
                    f"- Fix: {f['fix']}",''
                  ]
          lines += [
            '',
            'CURRENT32_VALID=32/32',
            f'CURRENT32_FINDINGS={len(findings)}',
            'TARGET_SHA=9564b2bdcfa7695a2e97668e1fb192818189557d',
            'CURRENT32=COMPLETE',''
          ]
          pathlib.Path('/tmp/CURRENT32_FINAL.md').write_text('\n'.join(lines),encoding='utf-8')
          pathlib.Path('/tmp/count.json').write_text(json.dumps({'findings':len(findings)}))
          PY
          git pull --rebase origin remake-manager/zero-bug-pass-01
          mkdir -p .seven-team/zero-bug
          cp /tmp/CURRENT32_FINAL.md .seven-team/zero-bug/CURRENT32_FINAL.md
          git add -f .seven-team/zero-bug/CURRENT32_FINAL.md
          git config user.name 'Seven Current32 Audit'
          git config user.email 'actions@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Record Current32 final zero-bug audit'
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:remake-manager/zero-bug-pass-01
          fi
          python - <<'PY'
          import json
          d=json.load(open('/tmp/count.json'))
          assert d['findings']==0,d
          print('CURRENT32 ZERO-BUG GATE PASS')
          PY
