          prompt=pathlib.Path('/tmp/team-b-aider.md').read_text()
          ev=pathlib.Path('.seven-team/bughunt/B06-evidence.txt').read_text()
          body=json.dumps({'model':'kilo-auto/free','messages':[
            {'role':'system','content':'Produce a concrete Seven AI coding/self-dev/GitHub bug audit in Markdown. Use only supplied evidence. Include B06-### IDs, Severity, Confidence, affected surface, evidence/root cause, repro/test idea, fix direction, regression test. End exactly BUGHUNT=COMPLETE.'},
            {'role':'user','content':prompt+'\n\nEVIDENCE:\n'+ev}
