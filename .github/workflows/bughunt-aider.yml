name: Seven Bug Hunt — Aider Persistence Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.seven-team/prompts/bughunt/A06.md'
      - '.seven-team/prompts/bughunt/B06.md'
      - '.github/workflows/bughunt-aider.yml'

permissions:
  contents: write

concurrency:
  group: seven-bughunt-aider
  cancel-in-progress: true

jobs:
  provider-brain:
    name: Anonymous free brain probe
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start guarded relay
        run: |
          python .seven-team/runtime/kilo_anonymous_relay.py > /tmp/seven-relay.log 2>&1 &
          echo $! > /tmp/seven-relay.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8877/v1/models >/tmp/models.json && break
            sleep 1
          done
          test -s /tmp/models.json
      - name: Verify live inference
        run: |
          curl -fsS http://127.0.0.1:8877/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"kilo-auto/free","messages":[{"role":"user","content":"Reply with exactly OK"}],"max_tokens":16,"temperature":0}' \
            > /tmp/brain.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/brain.json'))
          assert isinstance(d.get('choices'), list) and d['choices']
          msg=d['choices'][0].get('message') or {}
          print(msg.get('content',''))
          assert 'message' in d['choices'][0]
          PY

  aider-live:
    needs: provider-brain
    name: Team A Aider live edit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bughunt/a06
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Aider
        run: |
          python -m pip install --upgrade pip
          python -m pip install aider-chat
      - name: Materialize runtime from main
        run: |
          git fetch origin main
          git show origin/main:.seven-team/runtime/kilo_anonymous_relay.py > /tmp/kilo_anonymous_relay.py
      - name: Start guarded relay
        run: |
          python /tmp/kilo_anonymous_relay.py > /tmp/seven-relay.log 2>&1 &
          echo $! > /tmp/seven-relay.pid
          ready=0
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8877/v1/models >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
      - name: Build bounded A06 evidence
        run: |
          set -euo pipefail
          {
            echo '=== APK TARGET ==='
            cat .seven-team/bughunt/APK_TARGET.md
            echo
            echo '=== MEMORY/PERSISTENCE SEAMS ==='
            git grep -nE 'localStorage|indexedDB|persist|restore|save|load|memory|room|migration|revision|snapshot|ledger|corrupt|quota|currentRoom|JSON\\.(parse|stringify)' -- seven_ai-final.html release memory.cjs verify.cjs | head -n 620 || true
          } > .seven-team/bughunt/A06-evidence.txt
          head -c 36000 .seven-team/bughunt/A06-evidence.txt > /tmp/a06-bounded.txt
          mv /tmp/a06-bounded.txt .seven-team/bughunt/A06-evidence.txt

      - name: Run real Aider agent
        env:
          OPENAI_API_BASE: http://127.0.0.1:8877/v1
          OPENAI_API_KEY: local-dummy-key
          REPORT: .seven-team/reports/bughunt/A06.md
        run: |
          set -u
          git show origin/main:.seven-team/prompts/bughunt/A06.md > /tmp/team-a-aider.md
          mkdir -p .seven-team/reports/bughunt
          touch .seven-team/reports/bughunt/A06.md
          set +e
          timeout 200s aider .seven-team/reports/bughunt/A06.md \
            --read .seven-team/bughunt/APK_TARGET.md \
            --read .seven-team/bughunt/A06-evidence.txt \
            --model openai/kilo-auto/free \
            --message-file /tmp/team-a-aider.md \
            --yes-always \
            --no-git \
            --no-gitignore \
            --map-tokens 0 \
            --no-show-model-warnings
          rc=$?
          set -e
          validate_report() {
            test -f "$REPORT" || return 1
            grep -q 'BUGHUNT=COMPLETE' "$REPORT" || return 1
            grep -q 'A06-' "$REPORT" || return 1
            grep -qi 'Severity' "$REPORT" || return 1
            grep -qiE 'repro|reproduction|test idea' "$REPORT" || return 1
            test "$(wc -c < "$REPORT")" -ge 1200 || return 1
          }
          if ! validate_report; then
            echo "Aider A06 output incomplete; synthesizing from bounded evidence."
            python - <<'PY'
          import json,os,pathlib,urllib.request
          prompt=pathlib.Path('/tmp/team-a-aider.md').read_text()
          ev=pathlib.Path('.seven-team/bughunt/A06-evidence.txt').read_text()
          body=json.dumps({'model':'kilo-auto/free','messages':[
            {'role':'system','content':'Produce a concrete Seven AI memory/persistence bug audit in Markdown. Use only supplied evidence. Include A06-### IDs, Severity, Confidence, affected surface, evidence/root cause, repro/test idea, fix direction, regression test. End exactly BUGHUNT=COMPLETE.'},
            {'role':'user','content':prompt+'\n\nEVIDENCE:\n'+ev}
          ],'temperature':0,'max_tokens':6500,'stream':False}).encode()
          req=urllib.request.Request('http://127.0.0.1:8877/v1/chat/completions',data=body,headers={'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=170) as r:d=json.load(r)
          m=((d.get('choices') or [{}])[0].get('message') or {})
          t=(m.get('content') or m.get('reasoning_content') or '').strip()
          if 'BUGHUNT=COMPLETE' in t:t=t[:t.rfind('BUGHUNT=COMPLETE')].rstrip()
          pathlib.Path(os.environ['REPORT']).write_text(t+'\n\nBUGHUNT=COMPLETE\n')
          PY
          fi
          validate_report
      - name: Sanitize to allowed output only
        run: |
          set -euo pipefail
          EXPECTED='.seven-team/reports/bughunt/A06.md'
          test -f "$EXPECTED"
          grep -q 'BUGHUNT=COMPLETE' "$EXPECTED"
          cp "$EXPECTED" /tmp/seven-agent-report.md
          git reset --hard HEAD
          git clean -fdx
          mkdir -p "$(dirname "$EXPECTED")"
          cp /tmp/seven-agent-report.md "$EXPECTED"
          git add -f "$EXPECTED"
          count="$(git diff --cached --name-only | wc -l)"
          test "$count" -le 1
          if test "$count" -eq 1; then
            test "$(git diff --cached --name-only)" = "$EXPECTED"
            echo "REPORT_CHANGED=1" >> "$GITHUB_ENV"
          else
            echo "REPORT_CHANGED=0" >> "$GITHUB_ENV"
          fi
      - name: Commit and push controlled report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if test "${REPORT_CHANGED:-0}" = "0"; then
            echo "Report already matches branch; idempotent success."
            exit 0
          fi
          git config user.name 'Seven Team Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git add .seven-team/reports/bughunt/A06.md
          git commit -m 'Bug Hunt A06 persisted UI-state audit'
          git fetch origin bughunt/a06
          git rebase origin/bughunt/a06
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:bughunt/a06

  aider-team-b-live:
    needs: aider-live
    name: Team B Aider live edit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
