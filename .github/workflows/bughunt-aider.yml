            git grep -nE 'github|branch|commit|pull|workflow|actions|job|logs|repair|protectedPath|self.?dev|coding|token|device|oauth|busy|timeout|retry|failure|rollback|write|patch' -- release seven_ai-final.html native-security-policy.cjs apk verify.cjs | head -n 680 || true
          } > .seven-team/bughunt/B06-evidence.txt
          head -c 40000 .seven-team/bughunt/B06-evidence.txt > /tmp/b06-bounded.txt
          mv /tmp/b06-bounded.txt .seven-team/bughunt/B06-evidence.txt

