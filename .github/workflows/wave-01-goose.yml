name: Seven Wave 01 — Goose Integrity Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.seven-team/prompts/wave-01/A07.md'
      - '.seven-team/prompts/wave-01/B07.md'
      - '.github/workflows/wave-01-goose.yml'

permissions:
  contents: write

concurrency:
  group: seven-wave01-goose
  cancel-in-progress: true

jobs:
  goose-live:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: Wave 01 A07 Goose security audit
            branch: agent/07-security-selfdev
            prompt_path: .seven-team/prompts/wave-01/A07.md
            report: .seven-team/reports/wave-01/A07-selfdev-security.md
            commit_message: Wave 01 A07 Self-Dev security audit
          - name: Wave 01 B07 Goose integrity audit
            branch: agent-b/07-rpg-integrity
            prompt_path: .seven-team/prompts/wave-01/B07.md
            report: .seven-team/reports/wave-01/B07-rpg-integrity.md
            commit_message: Wave 01 B07 RPG integrity audit

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Goose
        run: |
          curl -fsSL https://github.com/aaif-goose/goose/releases/download/stable/download_cli.sh | CONFIGURE=false bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Materialize guarded runtime and prompt from main
        run: |
          git fetch origin main
          git show origin/main:.seven-team/runtime/kilo_anonymous_relay.py > /tmp/kilo_anonymous_relay.py
          git show origin/main:${{ matrix.prompt_path }} > /tmp/goose-prompt.md

      - name: Start guarded relay
        run: |
          python /tmp/kilo_anonymous_relay.py > /tmp/seven-relay.log 2>&1 &
          ready=0
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8877/v1/models >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1

      - name: Run real Goose agent
        env:
          GOOSE_PROVIDER: openai
          GOOSE_MODEL: kilo-auto/free
          GOOSE_MODE: auto
          GOOSE_CONTEXT_STRATEGY: summarize
          GOOSE_MAX_TURNS: '4'
          GOOSE_DISABLE_SESSION_NAMING: 'true'
          OPENAI_API_KEY: local-dummy-key
          OPENAI_HOST: http://127.0.0.1:8877
          OPENAI_BASE_PATH: v1/chat/completions
        run: |
          set -u
          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          mkdir -p "$(dirname "${{ matrix.report }}")"
          set +e
          timeout 150s goose run --no-session --with-builtin developer -t "$(cat /tmp/goose-prompt.md)"
          rc=$?
          set -e
          if test -f "${{ matrix.report }}" && grep -q 'WAVE01=COMPLETE' "${{ matrix.report }}"; then
            echo "Goose produced required report; accepting output (rc=$rc)."
          else
            echo "Goose did not produce required report (rc=$rc)." >&2
            exit "${rc:-1}"
          fi

      - name: Sanitize to allowed output only
        run: |
          set -euo pipefail
          EXPECTED='${{ matrix.report }}'
          cp "$EXPECTED" /tmp/seven-agent-report.md
          git reset --hard HEAD
          git clean -fdx
          mkdir -p "$(dirname "$EXPECTED")"
          cp /tmp/seven-agent-report.md "$EXPECTED"
          git add -f "$EXPECTED"
          count="$(git diff --cached --name-only | wc -l)"
          test "$count" -le 1
          if test "$count" -eq 1; then
            test "$(git diff --cached --name-only)" = "$EXPECTED"
            echo "REPORT_CHANGED=1" >> "$GITHUB_ENV"
          else
            echo "REPORT_CHANGED=0" >> "$GITHUB_ENV"
          fi

      - name: Commit and push controlled report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if test "${REPORT_CHANGED:-0}" = "0"; then
            echo "Report already matches branch; idempotent success."
            exit 0
          fi
          git config user.name 'Seven Team Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m "${{ matrix.commit_message }}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${{ matrix.branch }}
