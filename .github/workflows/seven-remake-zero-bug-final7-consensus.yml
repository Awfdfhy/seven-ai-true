name: Seven Remake Final7 Consensus Recovery

on:
  push:
    branches:
      - remake-manager/zero-bug-pass-01
    paths:
      - '.github/workflows/seven-remake-zero-bug-final7-consensus.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        include:
          - id: F09
            replica: A
            focus: Chat persistence failures before user write after user write and during assistant commit
          - id: F09
            replica: B
            focus: Chat persistence failures before user write after user write and during assistant commit
          - id: F14
            replica: A
            focus: ProviderAdapter runtime contract malformed chunks adapter identity and mutable provider registries
          - id: F14
            replica: B
            focus: ProviderAdapter runtime contract malformed chunks adapter identity and mutable provider registries
          - id: F17
            replica: A
            focus: Provider error normalization retryAfter handling and privacy-safe failure details
          - id: F17
            replica: B
            focus: Provider error normalization retryAfter handling and privacy-safe failure details
          - id: F21
            replica: A
            focus: ProviderHealth penalties cooldowns stale success failure ordering and recovery
          - id: F21
            replica: B
            focus: ProviderHealth penalties cooldowns stale success failure ordering and recovery
          - id: F26
            replica: A
            focus: UI isolation from provider network and storage contracts in current Phase 1-2 scope
          - id: F26
            replica: B
            focus: UI isolation from provider network and storage contracts in current Phase 1-2 scope
          - id: F27
            replica: A
            focus: Security privacy raw provider errors secrets unknown thrown values and diagnostic retention
          - id: F27
            replica: B
            focus: Security privacy raw provider errors secrets unknown thrown values and diagnostic retention
          - id: F32
            replica: A
            focus: Holistic adversarial review for any concrete Phase 1-2 bug missed by narrower reviews
          - id: F32
            replica: B
            focus: Holistic adversarial review for any concrete Phase 1-2 bug missed by narrower reviews

    steps:
      - uses: actions/checkout@v4
        with:
          ref: remake-manager/zero-bug-pass-01
          fetch-depth: 0

      - name: Build pinned evidence
        run: |
          set -euo pipefail
          git show HEAD:.seven-team/runtime/kilo_anonymous_relay.py > /tmp/kilo_anonymous_relay.py
          git checkout --detach 4bce46c60b09f040d586c80a84232c87e12ae354
          python - <<'PY'
          from pathlib import Path
          files=[
            'remake/src/core/errors.ts','remake/src/core/task-manager.ts',
            'remake/src/domain/chat/index.ts','remake/src/storage/room-repository.ts',
            'remake/src/application/chat/chat-service.ts','remake/src/providers/contracts.ts',
            'remake/src/routing/model-router.ts','remake/src/integration/phase12/index.ts',
          ]
          blocks=[]
          for name in files:
              p=Path(name)
              blocks.append(f"===== {name} =====\n{p.read_text(encoding='utf-8',errors='replace')}\n")
          Path('/tmp/evidence.txt').write_text('\n'.join(blocks),encoding='utf-8')
          PY

      - name: Start relay
        run: |
          set -euo pipefail
          python /tmp/kilo_anonymous_relay.py >/tmp/relay.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8877/v1/models >/tmp/models.json; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Run independent auditor
        env:
          AUDIT_ID: ${{ matrix.id }}
          AUDIT_REPLICA: ${{ matrix.replica }}
          AUDIT_FOCUS: ${{ matrix.focus }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,urllib.request
          aid=os.environ['AUDIT_ID']; replica=os.environ['AUDIT_REPLICA']; focus=os.environ['AUDIT_FOCUS']
          evidence=pathlib.Path('/tmp/evidence.txt').read_text(encoding='utf-8')
          catalog=json.load(open('/tmp/models.json'))
          rows=catalog.get('data',catalog if isinstance(catalog,list) else [])
          available={row.get('id') if isinstance(row,dict) else row for row in rows}
          preferred=[
            'poolside/laguna-s-2.1:free',
            'nvidia/nemotron-3.5-lightning:free',
            'nvidia/nemotron-3-ultra-550b-a55b:free',
            'nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free',
          ]
          models=[m for m in preferred if m in available]
          if replica=='B': models=list(reversed(models))
          if not models: raise SystemExit('No preferred audit model')
          base='http://127.0.0.1:8877/v1'

          def ask(model,prompt,timeout=55,max_tokens=1200):
              body=json.dumps({'model':model,'messages':[
                {'role':'system','content':'You are a strict adversarial software auditor. Use only supplied source. Never invent bugs. Missing future features and missing tests alone are not bugs.'},
                {'role':'user','content':prompt}],
                'temperature':0,'max_tokens':max_tokens,'stream':False}).encode()
              req=urllib.request.Request(base+'/chat/completions',data=body,headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=timeout) as res:data=json.load(res)
              choices=data.get('choices') or []
              msg=(choices[0].get('message') or {}) if choices else {}
              vals=[v for v in (msg.get('content'),msg.get('reasoning_content')) if isinstance(v,str) and v.strip()]
              return '\n'.join(vals).strip()

          prompt=(
            f'Audit {aid}-{replica}. Focus: {focus}. '
            'Find only concrete deterministic bugs in the supplied current Phase 1-2 production source. '
            'Think deeply. A possible enhancement or missing test is NOT a bug. '
            'At the END include exactly one verdict line: VERDICT: PASS if you found no proven bug, '
            'or VERDICT: BUG if at least one proven bug exists. '
            'For each proven bug include an exact remake/src/... path and a deterministic reproduction.\n\nSOURCE:\n'+evidence
          )

          errors=[]
          for model in models:
            try:
              raw=ask(model,prompt)
              verdicts=[line.strip() for line in raw.splitlines() if line.strip() in {'VERDICT: PASS','VERDICT: BUG'}]
              if len(verdicts)!=1: raise ValueError('one verdict required')
              verdict='PASS' if verdicts[0].endswith('PASS') else 'BUG'
              if verdict=='BUG':
                if 'remake/src/' not in raw or len(raw)<150:
                  raise ValueError('weak bug evidence')
              result={'id':aid,'replica':replica,'model':model,'verdict':verdict,'analysis':raw[:10000]}
              pathlib.Path('/tmp/report.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
              print('CONSENSUS',aid,replica,verdict,model)
              raise SystemExit(0)
            except SystemExit: raise
            except Exception as exc:
              errors.append(model+':'+type(exc).__name__)
          raise SystemExit('No valid verdict '+','.join(errors))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: final7-${{ matrix.id }}-${{ matrix.replica }}
          path: /tmp/report.json
          retention-days: 7

  aggregate:
    runs-on: ubuntu-latest
    needs: audit
    if: always()
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remake-manager/zero-bug-pass-01
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: final7-*
          path: /tmp/reports

      - name: Enforce consensus and save report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob,json,pathlib
          files=glob.glob('/tmp/reports/**/report.json',recursive=True)
          rows=[]
          for f in files:
              try: rows.append(json.load(open(f,encoding='utf-8')))
              except Exception: pass
          expected={'F09','F14','F17','F21','F26','F27','F32'}
          by={}
          for row in rows:
              by.setdefault(row['id'],[]).append(row)
          if set(by)!=expected:
              raise SystemExit(f'Expected {sorted(expected)}, got {sorted(by)}')
          problems=[]
          lines=['# Seven Remake — Final7 Consensus Recovery','',
                 'Target SHA: 4bce46c60b09f040d586c80a84232c87e12ae354','']
          for aid in sorted(expected):
              reps=by[aid]
              if len(reps)!=2:
                  problems.append(f'{aid}: expected 2 reports, got {len(reps)}')
                  continue
              verdicts=[r['verdict'] for r in reps]
              lines.append(f"- {aid}: {verdicts[0]} / {verdicts[1]} via {reps[0]['model']} + {reps[1]['model']}")
              if verdicts!=['PASS','PASS']:
                  problems.append(f'{aid}: verdicts {verdicts}')
                  for r in reps:
                      if r['verdict']=='BUG':
                          lines += ['',f"## {aid}-{r['replica']} BUG analysis",r['analysis'],'']
          lines += ['',
                    f'VALID_REPORTS={len(rows)}/14',
                    f'CONSENSUS_PROBLEMS={len(problems)}',
                    'FINAL7_CONSENSUS=COMPLETE','']
          pathlib.Path('/tmp/FINAL7_CONSENSUS.md').write_text('\n'.join(lines),encoding='utf-8')
          pathlib.Path('/tmp/problems.json').write_text(json.dumps(problems))
          print('\n'.join(lines[-5:]))
          if problems:
              print('PROBLEMS',problems)
          PY
          git pull --rebase origin remake-manager/zero-bug-pass-01
          mkdir -p .seven-team/zero-bug
          cp /tmp/FINAL7_CONSENSUS.md .seven-team/zero-bug/FINAL7_CONSENSUS.md
          git add -f .seven-team/zero-bug/FINAL7_CONSENSUS.md
          git config user.name 'Seven Final7 Consensus'
          git config user.email 'actions@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Record Final7 consensus recovery'
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:remake-manager/zero-bug-pass-01
          fi
          python - <<'PY'
          import json
          problems=json.load(open('/tmp/problems.json'))
          assert not problems,problems
          print('FINAL7 CONSENSUS ZERO-BUG GATE PASS')
          PY
