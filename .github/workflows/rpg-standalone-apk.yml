name: Seven RPG Standalone APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'rpg/standalone-*'
    paths:
      - 'apk/**'
      - 'release/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/rpg-standalone-apk.yml'

concurrency:
  group: seven-rpg-standalone-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  standalone-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout RPG standalone branch
        uses: actions/checkout@v6.1.0
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Chromium for prebuild regression
        run: npx playwright install --with-deps --only-shell chromium
      - name: Run Seven and RPG regression tests
        run: node all.cjs
      - name: Generate dedicated RPG Android app
        run: npm run android:generate
      - name: Generate native RPG startup test
        run: node apk/materialize-rpg-standalone-test.cjs
      - name: Verify dedicated RPG payload before build
        run: node apk/verify-rpg-standalone.cjs
      - name: Android build + static checks
        working-directory: android
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug
      - name: Verify APK packaging and dedicated RPG identity
        run: |
          npm run android:verify
          node apk/verify-rpg-standalone.cjs
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 14 dedicated RPG startup smoke
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            cd android
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=ai.seven.rpg.SevenRpgStandaloneTest
      - name: Android 16 dedicated RPG startup smoke
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            cd android
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=ai.seven.rpg.SevenRpgStandaloneTest
      - name: Upload RPG instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: seven-rpg-standalone-android-diagnostics
          path: |
            android/app/build/reports/androidTests/**
            android/app/build/outputs/androidTest-results/**
            dist/apk-verification.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Seven RPG APK
        uses: actions/upload-artifact@v7
        with:
          name: seven-rpg-standalone-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
