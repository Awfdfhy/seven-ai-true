name: Seven Bug Hunt — OpenHands Architecture Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.seven-team/runtime/openhands_live.py'
      - '.seven-team/prompts/bughunt/A04.md'
      - '.seven-team/prompts/bughunt/B04.md'
      - '.github/workflows/bughunt-openhands.yml'

permissions:
  contents: write

concurrency:
  group: seven-bughunt-openhands
  cancel-in-progress: true

jobs:
  openhands-live:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: Bug Hunt A04 OpenHands architecture audit
            branch: bughunt/a04
            prompt_path: .seven-team/prompts/bughunt/A04.md
            report: .seven-team/reports/bughunt/A04.md
            commit_message: Bug Hunt A04 design-system map
          - name: Bug Hunt B04 OpenHands RPG engine audit
            branch: bughunt/b04
            prompt_path: .seven-team/prompts/bughunt/B04.md
            report: .seven-team/reports/bughunt/B04.md
            commit_message: Bug Hunt B04 RPG engine map

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install matching OpenHands SDK + Tools from one checkout
        run: |
          python -m pip install --upgrade pip
          git clone --depth 1 https://github.com/OpenHands/software-agent-sdk.git /tmp/software-agent-sdk
          python -m pip install /tmp/software-agent-sdk/openhands-sdk /tmp/software-agent-sdk/openhands-tools
          python - <<'PY'
          import importlib.metadata as m
          print("openhands-sdk", m.version("openhands-sdk"))
          print("openhands-tools", m.version("openhands-tools"))
          assert m.version("openhands-sdk") == m.version("openhands-tools")
          PY

      - name: Materialize runtime and prompt from main
        run: |
          git fetch origin main
          git show origin/main:.seven-team/runtime/kilo_anonymous_relay.py > /tmp/kilo_anonymous_relay.py
          git show origin/main:.seven-team/runtime/openhands_live.py > /tmp/openhands_live.py
          git show origin/main:${{ matrix.prompt_path }} > /tmp/openhands-prompt.md

      - name: Start guarded relay
        run: |
          python /tmp/kilo_anonymous_relay.py > /tmp/seven-relay.log 2>&1 &
          ready=0
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8877/v1/models >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1

      - name: Run real OpenHands agent
        env:
          LLM_API_KEY: local-dummy-key
          LLM_MODEL: openai/kilo-auto/free
          LLM_BASE_URL: http://127.0.0.1:8877/v1
          SEVEN_AGENT_PROMPT: /tmp/openhands-prompt.md
        run: |
          set -u
          mkdir -p "$(dirname "${{ matrix.report }}")"
          set +e
          timeout 300s python /tmp/openhands_live.py
          rc=$?
          set -e
          if test -f "${{ matrix.report }}" && grep -q 'BUGHUNT=COMPLETE' "${{ matrix.report }}"; then
            echo "OpenHands produced required report; accepting output (rc=$rc)."
          else
            echo "OpenHands did not produce required report (rc=$rc)." >&2
            exit 1
          fi

      - name: Sanitize to allowed output only
        run: |
          set -euo pipefail
          EXPECTED='${{ matrix.report }}'
          cp "$EXPECTED" /tmp/seven-agent-report.md
          git reset --hard HEAD
          git clean -fdx
          mkdir -p "$(dirname "$EXPECTED")"
          cp /tmp/seven-agent-report.md "$EXPECTED"
          git add -f "$EXPECTED"
          count="$(git diff --cached --name-only | wc -l)"
          test "$count" -le 1
          if test "$count" -eq 1; then
            test "$(git diff --cached --name-only)" = "$EXPECTED"
            echo "REPORT_CHANGED=1" >> "$GITHUB_ENV"
          else
            echo "REPORT_CHANGED=0" >> "$GITHUB_ENV"
          fi

      - name: Commit and push controlled report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if test "${REPORT_CHANGED:-0}" = "0"; then
            echo "Report already matches branch; idempotent success."
            exit 0
          fi
          git config user.name 'Seven Team Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m "${{ matrix.commit_message }}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${{ matrix.branch }}
