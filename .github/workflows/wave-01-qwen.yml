name: Seven Wave 01 — Qwen Performance Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.seven-team/runtime/kilo_anonymous_relay.py'
      - '.seven-team/prompts/wave-01/A09.md'
      - '.seven-team/prompts/wave-01/B09.md'
      - '.github/workflows/wave-01-qwen.yml'

permissions:
  contents: write

concurrency:
  group: seven-wave01-qwen
  cancel-in-progress: true

jobs:
  qwen-live:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: Wave 01 A09 Qwen UI performance audit
            branch: agent/09-performance
            final_only: '0'
            prompt_path: .seven-team/prompts/wave-01/A09.md
            report: .seven-team/reports/wave-01/A09-ui-performance.md
            commit_message: Wave 01 A09 UI performance audit
          - name: Wave 01 B09 Qwen RPG performance audit
            branch: agent-b/09-rpg-performance
            final_only: '1'
            prompt_path: .seven-team/prompts/wave-01/B09.md
            report: .seven-team/reports/wave-01/B09-rpg-performance.md
            commit_message: Wave 01 B09 RPG performance audit

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Qwen Code
        run: npm install -g @qwen-code/qwen-code@latest

      - name: Materialize runtime and prompt from main
        run: |
          git fetch origin main
          git show origin/main:.seven-team/runtime/kilo_anonymous_relay.py > /tmp/kilo_anonymous_relay.py
          git show origin/main:${{ matrix.prompt_path }} > /tmp/qwen-prompt.md
          cp /tmp/qwen-prompt.md /tmp/qwen-effective-prompt.md

      - name: Prepare B09 one-shot evidence and disable tools
        if: matrix.branch == 'agent-b/09-rpg-performance'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.qwen"
          cat > "$HOME/.qwen/settings.json" <<'JSON'
          {
            "tools": {
              "core": ["structured_output"],
              "disabled": [
                "tool_search","tool_call","agent","list_agents","run_shell_command",
                "read_file","read_many_files","glob","grep_search","write_file",
                "replace","web_fetch","save_memory","enter_plan_mode","exit_plan_mode",
                "task_stop","send_message"
              ]
            },
            "skills": {"disabledLevels": ["project","user","extension","bundled"]},
            "slashCommands": {"disabled": ["auth","mcp","extensions","ide"]}
          }
          JSON
          : > /tmp/b09-evidence.txt
          for file in release/workspaces/rpg.js release/world-runtime.js release/canon-simulator.js memory.cjs; do
            echo "===== $file =====" >> /tmp/b09-evidence.txt
            if test -f "$file"; then
              wc -lc "$file" >> /tmp/b09-evidence.txt
              grep -nE 'localStorage|sessionStorage|persist|save|restore|context|history|message|turn|state|canon|world|knowledge|fetch|generate|render|JSON\.stringify|JSON\.parse' "$file" | head -n 32 >> /tmp/b09-evidence.txt || true
            else
              echo "ABSENT" >> /tmp/b09-evidence.txt
            fi
          done
          head -c 7000 /tmp/b09-evidence.txt > /tmp/b09-evidence-bounded.txt
          {
            cat /tmp/qwen-prompt.md
            cat <<'EOF'

          RECOVERY OVERRIDE — ONE-SHOT MODE:
          Do not call tools or inspect files. A deterministic evidence pack follows.
          Answer immediately and do not spend the response budget on hidden analysis.
          Using ONLY that evidence, output a concise but COMPLETE B09 audit as plain text.
          Keep it <= 45 lines and <= 3200 characters. Cover current costs/risks, bounded-context
          policy, latency/token/persistence budgets, a 20-turn measurement plan, exact seams,
          first optimization slice, and correctness guardrails. Cite supplied file/line evidence,
          mark unknowns instead of guessing, and make the FINAL line exactly WAVE01=COMPLETE.
          EOF
            cat /tmp/b09-evidence-bounded.txt
          } > /tmp/qwen-effective-prompt.md

      - name: Start compatibility relay
        env:
          SEVEN_RELAY_BRIDGE_STREAM: '1'
          SEVEN_RELAY_FINAL_ONLY: ${{ matrix.final_only || '0' }}
        run: |
          python /tmp/kilo_anonymous_relay.py > /tmp/seven-relay.log 2>&1 &
          ready=0
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8877/v1/models >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1

      - name: Select healthy direct free model for B09
        if: matrix.branch == 'agent-b/09-rpg-performance'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error

          base = "http://127.0.0.1:8877/v1"
          with urllib.request.urlopen(base + "/models", timeout=20) as response:
              payload = json.load(response)

          rows = payload.get("data", payload if isinstance(payload, list) else [])
          ids = []
          for row in rows:
              if isinstance(row, dict):
                  model_id = row.get("id") or row.get("model")
              elif isinstance(row, str):
                  model_id = row
              else:
                  model_id = None
              if isinstance(model_id, str) and ":free" in model_id and not model_id.startswith("kilo-auto/"):
                  ids.append(model_id)

          # Prefer model families already documented by Kilo as direct anonymous-free routes,
          # while still probing the live catalog so availability changes do not break Wave 01.
          def rank(model_id):
              low = model_id.lower()
              preferred = (
                  (0, "z-ai/glm"),
                  (1, "minimax/"),
                  (2, "moonshot"),
                  (3, "qwen"),
                  (4, "google/"),
              )
              for score, prefix in preferred:
                  if prefix in low:
                      return (score, model_id)
              return (10, model_id)

          ids = sorted(dict.fromkeys(ids), key=rank)
          if not ids:
              raise SystemExit("No direct :free models returned by Kilo catalog")

          print("B09 direct-free candidates:", ", ".join(ids[:20]))
          selected = None
          errors = []
          for model_id in ids[:12]:
              body = json.dumps({
                  "model": model_id,
                  "messages": [{"role": "user", "content": "Reply exactly OK"}],
                  "temperature": 0,
                  "max_tokens": 12,
                  "stream": False,
              }).encode("utf-8")
              req = urllib.request.Request(
                  base + "/chat/completions",
                  data=body,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=35) as response:
                      data = json.load(response)
                  choices = data.get("choices") or []
                  content = ""
                  if choices:
                      message = choices[0].get("message") or {}
                      content = message.get("content") or message.get("reasoning_content") or ""
                  if isinstance(content, str) and content.strip():
                      selected = model_id
                      print(f"B09 selected healthy direct free model: {model_id}")
                      break
                  errors.append(f"{model_id}: empty response")
              except Exception as exc:
                  errors.append(f"{model_id}: {type(exc).__name__}: {exc}")
                  print("B09 probe failed:", errors[-1])

          if not selected:
              print("B09 model probe failures:")
              for item in errors:
                  print(" -", item)
              raise SystemExit("No healthy direct free model passed B09 probe")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"B09_MODEL={selected}\n")
          PY

      - name: Run real Qwen Code agent
        env:
          OPENAI_API_KEY: local-dummy-key
          OPENAI_BASE_URL: http://127.0.0.1:8877/v1
          OPENAI_MODEL: kilo-auto/free
          QWEN_CODE_SUPPRESS_YOLO_WARNING: 'true'
        run: |
          set -u
          mkdir -p "$(dirname "${{ matrix.report }}")"
          rc=1
          MODEL="${B09_MODEL:-kilo-auto/free}"
          echo "Qwen model selected for ${{ matrix.branch }}: $MODEL"
          for attempt in 1 2 3; do
            echo "Qwen live attempt $attempt/3"
            rm -f /tmp/qwen-wave01.out
            set +e
            timeout 100s qwen -p "$(cat /tmp/qwen-effective-prompt.md)" \
              --approval-mode yolo \
              --output-format text \
              --model "$MODEL" \
              --openai-api-key local-dummy-key \
              --openai-base-url http://127.0.0.1:8877/v1 2>&1 | tee /tmp/qwen-wave01.out
            rc=${PIPESTATUS[0]}
            set -e
            if test -f "${{ matrix.report }}" && grep -q 'WAVE01=COMPLETE' "${{ matrix.report }}"; then
              echo "Qwen produced required repository report; accepting output (attempt=$attempt rc=$rc)."
              rc=0
              break
            fi
            if grep -q 'WAVE01=COMPLETE' /tmp/qwen-wave01.out; then
              echo "Qwen completed the audit in stdout; recovering controlled report."
              mkdir -p "$(dirname "${{ matrix.report }}")"
              cp /tmp/qwen-wave01.out "${{ matrix.report }}"
              rc=0
              break
            fi
            sleep $((attempt * 3))
          done
          if test "$rc" -ne 0; then
            echo "Qwen did not produce required PASS report after retries." >&2
            exit "$rc"
          fi

      - name: Sanitize to allowed output only
        run: |
          set -euo pipefail
          EXPECTED='${{ matrix.report }}'
          cp "$EXPECTED" /tmp/seven-agent-report.md
          git reset --hard HEAD
          git clean -fdx
          mkdir -p "$(dirname "$EXPECTED")"
          cp /tmp/seven-agent-report.md "$EXPECTED"
          git add -f "$EXPECTED"
          count="$(git diff --cached --name-only | wc -l)"
          test "$count" -le 1
          if test "$count" -eq 1; then
            test "$(git diff --cached --name-only)" = "$EXPECTED"
            echo "REPORT_CHANGED=1" >> "$GITHUB_ENV"
          else
            echo "REPORT_CHANGED=0" >> "$GITHUB_ENV"
          fi

      - name: Commit and push controlled report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if test "${REPORT_CHANGED:-0}" = "0"; then
            echo "Report already matches branch; idempotent success."
            exit 0
          fi
          git config user.name 'Seven Team Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m "${{ matrix.commit_message }}"
          git fetch origin "${{ matrix.branch }}"
          git rebase "origin/${{ matrix.branch }}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${{ matrix.branch }}
