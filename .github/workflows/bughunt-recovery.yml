name: Seven Bug Hunt — Recovery Synthesis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bughunt-recovery.yml'

permissions:
  contents: write

concurrency:
  group: seven-bughunt-recovery
  cancel-in-progress: true

jobs:
  recover:
    name: Recover ${{ matrix.id }} bug audit
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - id: A02
            branch: bughunt/a02
            pattern: 'Android|WebView|Capacitor|native|bridge|permission|lifecycle|resume|pause|install|upgrade|manifest|intent|secure|file|keyboard|document'
          - id: B01
            branch: bughunt/b01
            pattern: 'chat|send|stop|copy|stream|retry|room|message|assistant|composer|AbortController|generation|regenerate|switch|history|response'
          - id: B02
            branch: bughunt/b02
            pattern: 'attachment|file|pdf|document|picker|import|export|upload|download|blob|base64|mime|Android|Capacitor|content|uri|filesystem'
          - id: B03
            branch: bughunt/b03
            pattern: 'search|research|web|citation|source|evidence|result|stale|query|fetch|url|rank|rerank|ground|snippet|provider|timeout'
          - id: B05
            branch: bughunt/b05
            pattern: 'rpg|world|canon|character|state|title|scene|story|memory|persist|save|load|runtime|episode|quest|inventory|relationship'
          - id: B07
            branch: bughunt/b07
            pattern: 'fetch\\(|network|offline|timeout|AbortController|retry|fallback|provider|429|503|rate|cooldown|health|stream|error|connection'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize current prompt and relay
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.seven-team/prompts/bughunt/${{ matrix.id }}.md > /tmp/prompt.md
          git show origin/main:.seven-team/runtime/kilo_anonymous_relay.py > /tmp/relay.py

      - name: Build bounded specialization evidence
        env:
          PATTERN: ${{ matrix.pattern }}
        run: |
          set -euo pipefail
          {
            echo '=== APK TARGET ==='
            cat .seven-team/bughunt/APK_TARGET.md
            echo
            echo '=== FILE INVENTORY ==='
            for f in seven_ai-final.html release/*.js release/*.cjs release/workspaces/*.js release/workspaces/*.css apk/*.cjs native-security-policy.cjs verify.cjs; do test -f "$f" && wc -lc "$f"; done
            echo
            echo '=== SPECIALIZATION EVIDENCE ==='
            git grep -nEi "$PATTERN" -- seven_ai-final.html release apk cloudflare native-security-policy.cjs verify.cjs | head -n 720 || true
          } > /tmp/evidence.txt
          head -c 44000 /tmp/evidence.txt > /tmp/evidence-bounded.txt

      - name: Start final-only relay
        env:
          SEVEN_RELAY_BRIDGE_STREAM: '1'
          SEVEN_RELAY_FINAL_ONLY: '1'
        run: |
          python /tmp/relay.py >/tmp/relay.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8877/v1/models >/tmp/models.json; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Select healthy direct free model
        run: |
          python - <<'PY'
          import json,os,urllib.request
          d=json.load(open('/tmp/models.json'))
          ids=[x.get('id') for x in d.get('data',[]) if isinstance(x,dict) and isinstance(x.get('id'),str) and ':free' in x['id'] and not x['id'].startswith('kilo-auto/')]
          def rank(mid):
              low=mid.lower()
              order=('qwen','cohere/','nvidia/nemotron-3-super','nvidia/nemotron-3-ultra','stepfun/')
              for i,t in enumerate(order):
                  if t in low:return (i,mid)
              return (20,mid)
          for mid in sorted(dict.fromkeys(ids),key=rank)[:16]:
              req=urllib.request.Request('http://127.0.0.1:8877/v1/chat/completions',data=json.dumps({'model':mid,'messages':[{'role':'user','content':'Reply OK'}],'max_tokens':8,'stream':False}).encode(),headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:out=json.load(r)
                  m=((out.get('choices') or [{}])[0].get('message') or {})
                  if (m.get('content') or m.get('reasoning_content') or '').strip():
                      with open(os.environ['GITHUB_ENV'],'a') as env:env.write('BUG_MODEL='+mid+'\n')
                      print('Selected',mid)
                      raise SystemExit(0)
              except Exception as e:print('probe',mid,e)
          raise SystemExit('no healthy direct free model')
          PY

      - name: Synthesize missing audit
        env:
          BUG_ID: ${{ matrix.id }}
          REPORT: .seven-team/reports/bughunt/${{ matrix.id }}.md
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$REPORT")"
          python - <<'PY'
          import json,os,pathlib,urllib.request
          prompt=pathlib.Path('/tmp/prompt.md').read_text(encoding='utf-8')
          evidence=pathlib.Path('/tmp/evidence-bounded.txt').read_text(encoding='utf-8',errors='replace')
          system=(
            'You are closing a bug-audit report after the assigned live agent already performed repository exploration but timed out before writing. '
            'Use ONLY the supplied deterministic repository evidence. Do not invent runtime observations. '
            'Produce plain Markdown with concrete '+os.environ['BUG_ID']+'-### bug IDs, Severity, Confidence, affected surface/file/function, user symptom, '
            'technical evidence/root cause, minimal reproduction or deterministic test idea, brief fix direction, and regression test. '
            'Separate VERIFIED/STRONG/NEEDS_RUNTIME_TEST honestly; reject false positives. End exactly BUGHUNT=COMPLETE.'
          )
          body=json.dumps({'model':os.environ['BUG_MODEL'],'messages':[
            {'role':'system','content':system},
            {'role':'user','content':prompt+'\n\nDETERMINISTIC EVIDENCE:\n'+evidence}
          ],'temperature':0,'max_tokens':7000,'stream':False}).encode()
          req=urllib.request.Request('http://127.0.0.1:8877/v1/chat/completions',data=body,headers={'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=170) as r:d=json.load(r)
          m=((d.get('choices') or [{}])[0].get('message') or {})
          text=(m.get('content') or m.get('reasoning_content') or '').strip()
          if 'BUGHUNT=COMPLETE' in text:text=text[:text.rfind('BUGHUNT=COMPLETE')].rstrip()
          pathlib.Path(os.environ['REPORT']).write_text(text+'\n\nBUGHUNT=COMPLETE\n',encoding='utf-8')
          PY
          grep -q 'BUGHUNT=COMPLETE' "$REPORT"
          grep -Eq "^### .*${BUG_ID}-[0-9]{3}" "$REPORT"
          grep -qi 'Severity' "$REPORT"
          grep -qiE 'evidence|root cause|technical evidence' "$REPORT"
          grep -qiE 'repro|reproduction|test idea' "$REPORT"
          bytes="$(wc -c < "$REPORT")"
          test "$bytes" -ge 1200
          test "$bytes" -le 30000

      - name: Sanitize and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: .seven-team/reports/bughunt/${{ matrix.id }}.md
        run: |
          set -euo pipefail
          cp "$REPORT" /tmp/report.md
          git reset --hard HEAD
          git clean -fdx
          mkdir -p "$(dirname "$REPORT")"
          cp /tmp/report.md "$REPORT"
          git add -f "$REPORT"
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'Seven Bug Hunt Recovery'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m "Recover Bug Hunt ${{ matrix.id }} report"
          git fetch origin "${{ matrix.branch }}"
          git rebase "origin/${{ matrix.branch }}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${{ matrix.branch }}
