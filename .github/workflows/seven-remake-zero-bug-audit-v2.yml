name: Seven Remake — Zero Bug Audit V2 Direct

on:
  workflow_dispatch:
  push:
    branches:
      - remake-manager/zero-bug-pass-01
    paths:
      - '.github/workflows/seven-remake-zero-bug-audit-v2.yml'

permissions:
  contents: write

concurrency:
  group: seven-remake-zero-bug-audit-v2
  cancel-in-progress: true

jobs:
  audit:
    name: Direct Zero Audit ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - id: Z01
          - id: Z02
          - id: Z03
          - id: Z04
          - id: Z05
          - id: Z06
          - id: Z07
          - id: Z08
          - id: Z09
          - id: Z10
          - id: Z11
          - id: Z12
          - id: Z13
          - id: Z14
          - id: Z15
          - id: Z16
          - id: Z17
          - id: Z18
          - id: Z19
          - id: Z20
          - id: Z21
          - id: Z22
          - id: Z23
          - id: Z24
          - id: Z25
          - id: Z26
          - id: Z27
          - id: Z28
          - id: Z29
          - id: Z30
          - id: Z31
          - id: Z32

    steps:
      - uses: actions/checkout@v4
        with:
          ref: remake-manager/zero-bug-pass-01
          fetch-depth: 0
          persist-credentials: false

      - name: Pin exact audited code and materialize focus
        env:
          AUDITOR_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          cp .seven-team/zero-bug/manifest.json /tmp/manifest.json
          python - <<'PY'
          import json,os,pathlib
          d=json.load(open('/tmp/manifest.json'))
          aid=os.environ['AUDITOR_ID']
          a=next(x for x in d['auditors'] if x['id']==aid)
          pathlib.Path('/tmp/focus.txt').write_text(a['focus'],encoding='utf-8')
          pathlib.Path('/tmp/target.txt').write_text(d['targetHead'],encoding='utf-8')
          PY
          TARGET_SHA="$(cat /tmp/target.txt)"
          git fetch origin "$TARGET_SHA"
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git show "$TARGET_SHA":.seven-team/runtime/kilo_anonymous_relay.py > /tmp/kilo_anonymous_relay.py

      - name: Build bounded evidence pack
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          roots=[
            Path('remake/src/core'),
            Path('remake/src/domain'),
            Path('remake/src/storage'),
            Path('remake/src/application'),
            Path('remake/src/providers'),
            Path('remake/src/routing'),
            Path('remake/src/integration/phase12'),
          ]
          files=[]
          for root in roots:
              if root.exists():
                  files += sorted(p for p in root.rglob('*') if p.is_file() and p.suffix in {'.ts','.tsx'})
          chunks=[]
          total=0
          cap=160_000
          for p in files:
              raw=p.read_text(encoding='utf-8',errors='replace')
              block=f"===== {p.as_posix()} =====\n{raw}\n"
              if total+len(block)>cap:
                  remaining=cap-total
                  if remaining>500:
                      chunks.append(block[:remaining])
                  break
              chunks.append(block)
              total += len(block)
          evidence='\n'.join(chunks)
          Path('/tmp/evidence.txt').write_text(evidence,encoding='utf-8')
          print('Evidence chars:',len(evidence),'files:',len(files))
          PY

      - name: Start guarded relay
        run: |
          set -euo pipefail
          python /tmp/kilo_anonymous_relay.py >/tmp/relay.log 2>&1 &
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8877/v1/models >/tmp/models.json; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1

      - name: Run direct adversarial audit with model failover
        env:
          AUDITOR_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re,time,urllib.request,urllib.error
          from pathlib import Path

          aid=os.environ['AUDITOR_ID']
          focus=Path('/tmp/focus.txt').read_text(encoding='utf-8')
          evidence=Path('/tmp/evidence.txt').read_text(encoding='utf-8')
          payload=json.load(open('/tmp/models.json'))
          rows=payload.get('data',payload if isinstance(payload,list) else [])
          ids=[]
          for row in rows:
              mid=row.get('id') if isinstance(row,dict) else row if isinstance(row,str) else None
              if isinstance(mid,str) and ':free' in mid and not mid.startswith('kilo-auto/'):
                  ids.append(mid)

          def rank(mid):
              low=mid.lower()
              preferred=(
                  'qwen','z-ai/glm','minimax/','moonshot',
                  'google/','nvidia/nemotron'
              )
              for score,key in enumerate(preferred):
                  if key in low: return (score,mid)
              return (20,mid)

          ids=sorted(dict.fromkeys(ids),key=rank)
          if not ids:
              raise SystemExit('No direct free audit models available')
          slot=max(0,int(aid[1:])-1)
          # Rotate only within the strongest available candidate pool.
          pool=ids[:min(12,len(ids))]
          rotated=pool[slot%len(pool):]+pool[:slot%len(pool)]

          system=(
              "You are a meticulous adversarial software auditor. "
              "Use only the supplied source evidence. Do not invent facts. "
              "Future unimplemented milestones are not bugs. "
              "Return only the required one-line machine result."
          )
          user=f"""AUDITOR ID: {aid}
FOCUS: {focus}

Audit Seven Remake Phase 1-2 for concrete bugs within this focus.
A bug requires exact source evidence and a deterministic reproduction.
If no concrete bug survives scrutiny, return PASS.

Your entire response must be exactly one line beginning with the literal prefix
ZERO_AUDIT_JSON=
followed by one compact JSON object.

The JSON object fields:
id = {aid}
status = PASS or BUG
findings = array

For PASS, findings must be empty.
For BUG, findings must contain 1 to 8 objects. Each object requires:
severity = exactly CRITICAL, HIGH, MEDIUM, or LOW
title = specific title
evidence = at least 20 characters and cite an exact remake/src/... path plus function/logic
repro = at least 20 characters and deterministic
fix = at least 15 characters and root-cause focused

Do not output templates, markdown, code fences, schema examples, or generic advice.

SOURCE EVIDENCE:
{evidence}
"""

          banned={
              'short title','file/function and concrete reason',
              'deterministic test/repro','minimal root-cause fix',
              'CRITICAL|HIGH|MEDIUM|LOW'
          }
          severities={'CRITICAL','HIGH','MEDIUM','LOW'}

          def validate(text):
              text=text.strip()
              if '\n' in text or '\r' in text:
                  raise ValueError('response must be one line')
              prefix='ZERO_AUDIT_JSON='
              if not text.startswith(prefix):
                  raise ValueError('result prefix missing')
              data=json.loads(text[len(prefix):])
              if data.get('id')!=aid: raise ValueError('wrong id')
              if data.get('status') not in {'PASS','BUG'}: raise ValueError('bad status')
              findings=data.get('findings')
              if not isinstance(findings,list) or len(findings)>8: raise ValueError('bad findings')
              if data['status']=='PASS' and findings: raise ValueError('PASS with findings')
              if data['status']=='BUG' and not findings: raise ValueError('BUG without findings')
              titles=set()
              for i,f in enumerate(findings):
                  if not isinstance(f,dict): raise ValueError('finding object required')
                  sev=f.get('severity'); title=f.get('title'); ev=f.get('evidence')
                  repro=f.get('repro'); fix=f.get('fix')
                  if sev not in severities: raise ValueError('bad severity')
                  if not isinstance(title,str) or len(title.strip())<8: raise ValueError('bad title')
                  if title.strip() in titles: raise ValueError('duplicate title')
                  titles.add(title.strip())
                  if not isinstance(ev,str) or len(ev.strip())<20 or 'remake/src/' not in ev:
                      raise ValueError('bad evidence')
                  if not isinstance(repro,str) or len(repro.strip())<20: raise ValueError('bad repro')
                  if not isinstance(fix,str) or len(fix.strip())<15: raise ValueError('bad fix')
                  joined=' '.join([sev,title,ev,repro,fix])
                  if any(token in joined for token in banned): raise ValueError('placeholder')
              return data

          base='http://127.0.0.1:8877/v1'
          failures=[]
          selected=None
          report=None
          raw_selected=None
          for mid in rotated:
              body=json.dumps({
                  'model':mid,
                  'messages':[
                      {'role':'system','content':system},
                      {'role':'user','content':user}
                  ],
                  'temperature':0,
                  'max_tokens':2600,
                  'stream':False,
              }).encode('utf-8')
              req=urllib.request.Request(
                  base+'/chat/completions',
                  data=body,
                  headers={'Content-Type':'application/json'},
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(req,timeout=150) as response:
                      data=json.load(response)
                  choices=data.get('choices') or []
                  msg=(choices[0].get('message') or {}) if choices else {}
                  candidates=[
                      msg.get('content'),
                      msg.get('reasoning_content'),
                  ]
                  valid_texts=[x for x in candidates if isinstance(x,str) and x.strip()]
                  parsed=None
                  used_text=None
                  for raw in valid_texts:
                      # Some models put explanation before the marker; recover only when the
                      # final non-empty line itself is a valid one-line result.
                      final_line=[ln.strip() for ln in raw.splitlines() if ln.strip()]
                      if not final_line: continue
                      try:
                          parsed=validate(final_line[-1])
                          used_text=final_line[-1]
                          break
                      except Exception:
                          continue
                  if parsed is not None:
                      selected=mid; report=parsed; raw_selected=used_text
                      break
                  failures.append(mid+': invalid structured result')
              except Exception as exc:
                  failures.append(mid+': '+type(exc).__name__)
              time.sleep(1)

          if report is None:
              raise SystemExit('No model produced a valid audit report: '+'; '.join(failures))

          wrapped={
              'auditor':aid,
              'model':selected,
              'targetSha':Path('/tmp/target.txt').read_text().strip(),
              'report':report,
          }
          Path('/tmp/report.json').write_text(
              json.dumps(wrapped,ensure_ascii=False,indent=2),
              encoding='utf-8'
          )
          print('VALID_AUDIT',aid,selected,report['status'],len(report['findings']))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: zero-audit-v2-${{ matrix.id }}
          path: /tmp/report.json
          retention-days: 7

  aggregate:
    name: Zero Bug Audit V2 Aggregate
    needs: audit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remake-manager/zero-bug-pass-01
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: zero-audit-v2-*
          path: /tmp/reports

      - name: Build strict V2 summary
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob,json,pathlib
          files=glob.glob('/tmp/reports/**/report.json',recursive=True)
          wrapped=[]
          for f in files:
              try: wrapped.append(json.load(open(f,encoding='utf-8')))
              except Exception: pass
          by_id={}
          target=None
          for w in wrapped:
              aid=w.get('auditor')
              if not isinstance(aid,str): continue
              if aid in by_id: raise SystemExit('duplicate auditor artifact '+aid)
              by_id[aid]=w
              target=target or w.get('targetSha')
              if w.get('targetSha')!=target: raise SystemExit('mixed target SHAs')

          findings=[]
          lines=[
              '# Seven Remake — Zero Bug Audit V2 Direct',
              '',
              f'Target SHA: {target or "NONE"}',
              f'Valid auditor reports: {len(by_id)}/32',
              '',
              '## Auditor status',
          ]
          for n in range(1,33):
              aid=f'Z{n:02d}'
              w=by_id.get(aid)
              if not w:
                  lines.append(f'- {aid}: MISSING')
                  continue
              r=w['report']
              lines.append(f"- {aid}: {r['status']} ({len(r['findings'])} findings) via {w.get('model','?')}")
              for finding in r['findings']:
                  findings.append((aid,finding))
          lines += ['', '## Concrete findings']
          if findings:
              for aid,f in findings:
                  lines += [
                      f"### {aid} — {f['severity']} — {f['title']}",
                      f"- Evidence: {f['evidence']}",
                      f"- Repro: {f['repro']}",
                      f"- Fix: {f['fix']}",
                      ''
                  ]
          else:
              lines.append('No concrete bugs reported.')
          lines += [
              '',
              f'RAW_CONCRETE_FINDINGS={len(findings)}',
              f'VALID_REPORTS={len(by_id)}/32',
              f'TARGET_SHA={target or "NONE"}',
              'ZERO_BUG_AUDIT_V2=COMPLETE' if len(by_id)==32 else 'ZERO_BUG_AUDIT_V2=INCOMPLETE',
              ''
          ]
          out=pathlib.Path('.seven-team/zero-bug/AUDIT_V2_SUMMARY.md')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text('\n'.join(lines),encoding='utf-8')
          pathlib.Path('/tmp/audit-counts.json').write_text(
              json.dumps({'reports':len(by_id),'findings':len(findings),'target':target}),
              encoding='utf-8'
          )
          print('\n'.join(lines[-6:]))
          PY

      - name: Commit V2 summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git add -f .seven-team/zero-bug/AUDIT_V2_SUMMARY.md
          if ! git diff --cached --quiet; then
            git config user.name 'Seven Zero Bug Audit V2'
            git config user.email 'actions@users.noreply.github.com'
            git commit -m 'Collect strict 32-agent zero-bug audit v2'
            git fetch origin remake-manager/zero-bug-pass-01
            git rebase origin/remake-manager/zero-bug-pass-01
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:remake-manager/zero-bug-pass-01
          fi

      - name: Enforce complete zero-finding audit
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/audit-counts.json'))
          assert d['reports']==32, f"Expected 32 valid reports, got {d['reports']}"
          assert d['findings']==0, f"Expected 0 findings, got {d['findings']}"
          print('ZERO BUG AUDIT V2 GATE: PASS')
          PY
