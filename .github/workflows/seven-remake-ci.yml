name: Seven Remake V3 CI

on:
  push:
    branches:
      - seven-remake-v3
    paths:
      - 'remake/**'
      - '.github/workflows/seven-remake-ci.yml'
  pull_request:
    paths:
      - 'remake/**'
      - '.github/workflows/seven-remake-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: remake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Full dependency high-severity audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
