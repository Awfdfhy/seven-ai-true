name: Seven Wave 01 — Codex Android Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.seven-team/runtime/codex_responses_bridge.py'
      - '.seven-team/prompts/wave-01/A02.md'
      - '.seven-team/prompts/wave-01/B02.md'
      - '.github/workflows/wave-01-codex.yml'

permissions:
  contents: write

concurrency:
  group: seven-wave01-codex
  cancel-in-progress: true

jobs:
  codex-live:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: Wave 01 A02 Codex Android audit
            branch: agent/02-android-build
            prompt_path: .seven-team/prompts/wave-01/A02.md
            report: .seven-team/reports/wave-01/A02-android-evidence.md
            commit_message: Wave 01 A02 Android evidence audit
          - name: Wave 01 B02 Codex RPG Android audit
            branch: agent-b/02-android-rpg
            prompt_path: .seven-team/prompts/wave-01/B02.md
            report: .seven-team/reports/wave-01/B02-rpg-android.md
            commit_message: Wave 01 B02 RPG Android audit

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Codex
        run: npm install -g @openai/codex@latest

      - name: Materialize runtime and prompt from main
        run: |
          git fetch origin main
          git show origin/main:.seven-team/runtime/kilo_anonymous_relay.py > /tmp/kilo_anonymous_relay.py
          git show origin/main:.seven-team/runtime/codex_responses_bridge.py > /tmp/codex_responses_bridge.py
          git show origin/main:${{ matrix.prompt_path }} > /tmp/codex-prompt.md

      - name: Start relays
        run: |
          python /tmp/kilo_anonymous_relay.py > /tmp/seven-relay.log 2>&1 &
          python /tmp/codex_responses_bridge.py > /tmp/codex-bridge.log 2>&1 &
          ready=0
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8878/v1/models >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1

      - name: Run real Codex agent
        env:
          SEVEN_CODEX_KEY: local-dummy-key
          CODEX_HOME: /tmp/seven-codex-home
        run: |
          set -u
          mkdir -p "$(dirname "${{ matrix.report }}")" "$CODEX_HOME"
          set +e
          timeout 300s codex exec \
            --skip-git-repo-check \
            -m kilo-auto/free \
            -c 'approval_policy="never"' \
            -c 'sandbox_mode="danger-full-access"' \
            -c 'model_provider="seven"' \
            -c 'model_providers.seven={name="Seven Local Bridge",base_url="http://127.0.0.1:8878/v1",env_key="SEVEN_CODEX_KEY",wire_api="responses",requires_openai_auth=false,supports_websockets=false,request_max_retries=1,stream_max_retries=1}' \
            "$(cat /tmp/codex-prompt.md)"
          rc=$?
          set -e
          if test -f "${{ matrix.report }}" && grep -q 'WAVE01=COMPLETE' "${{ matrix.report }}"; then
            echo "Codex produced required report; accepting output (rc=$rc)."
          else
            echo "Codex did not produce required report (rc=$rc)." >&2
            echo "--- codex bridge log ---" >&2
            tail -100 /tmp/codex-bridge.log >&2 || true
            exit 1
          fi

      - name: Sanitize to allowed output only
        run: |
          set -euo pipefail
          EXPECTED='${{ matrix.report }}'
          cp "$EXPECTED" /tmp/seven-agent-report.md
          git reset --hard HEAD
          git clean -fdx
          mkdir -p "$(dirname "$EXPECTED")"
          cp /tmp/seven-agent-report.md "$EXPECTED"
          git add -f "$EXPECTED"
          count="$(git diff --cached --name-only | wc -l)"
          test "$count" -le 1
          if test "$count" -eq 1; then
            test "$(git diff --cached --name-only)" = "$EXPECTED"
            echo "REPORT_CHANGED=1" >> "$GITHUB_ENV"
          else
            echo "REPORT_CHANGED=0" >> "$GITHUB_ENV"
          fi

      - name: Commit and push controlled report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if test "${REPORT_CHANGED:-0}" = "0"; then exit 0; fi
          git config user.name 'Seven Team Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m "${{ matrix.commit_message }}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${{ matrix.branch }}
