name: Seven Gemini Live Agent Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.seven-team/runtime/gemini_gateway_bridge.py'
      - '.seven-team/prompts/live-smoke/team-a-gemini.md'
      - '.seven-team/prompts/live-smoke/team-b-gemini.md'
      - '.github/workflows/agent-live-gemini-smoke.yml'

permissions:
  contents: write

concurrency:
  group: seven-gemini-live-smoke
  cancel-in-progress: true

jobs:
  gemini-live:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: Team A Gemini live edit
            branch: agent/03-search
            prompt_path: .seven-team/prompts/live-smoke/team-a-gemini.md
            report: .seven-team/reports/team-a-gemini-live-smoke.md
            commit_message: Agent A03 Gemini live runtime smoke report
          - name: Team B Gemini live edit
            branch: agent-b/03-canon-retrieval
            prompt_path: .seven-team/prompts/live-smoke/team-b-gemini.md
            report: .seven-team/reports/team-b-gemini-live-smoke.md
            commit_message: Agent B03 Gemini live runtime smoke report

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli@latest

      - name: Enable documented gateway auth in noninteractive CLI
        run: |
          ROOT="$(npm root -g)/@google/gemini-cli"
          TARGET="$(grep -RIl --include='*.js' "Invalid auth method selected" "$ROOT" | head -n 1)"
          test -n "$TARGET"
          python - "$TARGET" <<'PY'
          import sys
          p=sys.argv[1]
          s=open(p,encoding='utf-8').read()
          variants=[
              "return 'Invalid auth method selected.';",
              'return "Invalid auth method selected.";',
          ]
          for needle in variants:
              if needle in s:
                  s=s.replace(needle,"if (authMethod === 'gateway') return null;\n  "+needle,1)
                  open(p,'w',encoding='utf-8').write(s)
                  print("Patched Gemini CLI gateway validation:",p)
                  break
          else:
              raise SystemExit("Gateway validation target not found in "+p)
          PY

      - name: Materialize runtime and prompt from main
        run: |
          git fetch origin main
          git show origin/main:.seven-team/runtime/kilo_anonymous_relay.py > /tmp/kilo_anonymous_relay.py
          git show origin/main:.seven-team/runtime/gemini_gateway_bridge.py > /tmp/gemini_gateway_bridge.py
          git show origin/main:${{ matrix.prompt_path }} > /tmp/gemini-prompt.md

      - name: Start relays
        run: |
          python /tmp/kilo_anonymous_relay.py > /tmp/seven-relay.log 2>&1 &
          python /tmp/gemini_gateway_bridge.py > /tmp/gemini-bridge.log 2>&1 &
          ready=0
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8879/v1beta/models >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1

      - name: Run real Gemini CLI agent
        env:
          GOOGLE_GEMINI_BASE_URL: http://127.0.0.1:8879
          GEMINI_DEFAULT_AUTH_TYPE: gemini-api-key
          GEMINI_API_KEY: local-dummy-key
          GOOGLE_GENAI_API_VERSION: v1beta
          GEMINI_TELEMETRY_ENABLED: 'false'
        run: |
          set -u
          mkdir -p "$(dirname "${{ matrix.report }}")"
          set +e
          timeout 150s gemini \
            -p "$(cat /tmp/gemini-prompt.md)" \
            --approval-mode=yolo \
            --skip-trust \
            --model kilo-auto/free \
            --output-format text
          rc=$?
          set -e
          if test -f "${{ matrix.report }}" && grep -q 'LIVE_AGENT_SMOKE=PASS' "${{ matrix.report }}"; then
            echo "Gemini produced required report; accepting output (rc=$rc)."
          else
            echo "Gemini did not produce required report (rc=$rc)." >&2
            echo "--- gemini bridge log ---" >&2
            tail -120 /tmp/gemini-bridge.log >&2 || true
            exit 1
          fi

      - name: Sanitize to allowed output only
        run: |
          set -euo pipefail
          EXPECTED='${{ matrix.report }}'
          cp "$EXPECTED" /tmp/seven-agent-report.md
          git reset --hard HEAD
          git clean -fdx
          mkdir -p "$(dirname "$EXPECTED")"
          cp /tmp/seven-agent-report.md "$EXPECTED"
          git add -f "$EXPECTED"
          count="$(git diff --cached --name-only | wc -l)"
          test "$count" -le 1
          if test "$count" -eq 1; then
            test "$(git diff --cached --name-only)" = "$EXPECTED"
            echo "REPORT_CHANGED=1" >> "$GITHUB_ENV"
          else
            echo "REPORT_CHANGED=0" >> "$GITHUB_ENV"
          fi

      - name: Commit and push controlled report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if test "${REPORT_CHANGED:-0}" = "0"; then exit 0; fi
          git config user.name 'Seven Team Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m "${{ matrix.commit_message }}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${{ matrix.branch }}
