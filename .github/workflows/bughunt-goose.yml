name: Seven Bug Hunt — Goose Integrity Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.seven-team/prompts/bughunt/A07.md'
      - '.seven-team/prompts/bughunt/B07.md'
      - '.github/workflows/bughunt-goose.yml'

permissions:
  contents: write

concurrency:
  group: seven-bughunt-goose
  cancel-in-progress: true

jobs:
  goose-live:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: Bug Hunt A07 Goose security audit
            branch: bughunt/a07
            prompt_path: .seven-team/prompts/bughunt/A07.md
            report: .seven-team/reports/bughunt/A07.md
            commit_message: Bug Hunt A07 Self-Dev security audit
          - name: Bug Hunt B07 Goose integrity audit
            branch: bughunt/b07
            prompt_path: .seven-team/prompts/bughunt/B07.md
            report: .seven-team/reports/bughunt/B07.md
            commit_message: Bug Hunt B07 RPG integrity audit

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Goose
        run: |
          curl -fsSL https://github.com/aaif-goose/goose/releases/download/stable/download_cli.sh | CONFIGURE=false bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Materialize guarded runtime and prompt from main
        run: |
          git fetch origin main
          git show origin/main:.seven-team/runtime/kilo_anonymous_relay.py > /tmp/kilo_anonymous_relay.py
          git show origin/main:${{ matrix.prompt_path }} > /tmp/goose-prompt.md

      - name: Start guarded relay
        run: |
          python /tmp/kilo_anonymous_relay.py > /tmp/seven-relay.log 2>&1 &
          ready=0
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8877/v1/models >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1

      - name: Select healthy direct free model
        run: |
          curl -fsS http://127.0.0.1:8877/v1/models > /tmp/models.json
          python - <<'PY'
          import json,os,urllib.request
          d=json.load(open('/tmp/models.json'))
          ids=[x.get('id') for x in d.get('data',[]) if isinstance(x,dict) and isinstance(x.get('id'),str) and ':free' in x['id'] and not x['id'].startswith('kilo-auto/')]
          def rank(mid):
              low=mid.lower()
              order=('qwen','cohere/','nvidia/nemotron-3-super','nvidia/nemotron-3-ultra','stepfun/')
              for i,t in enumerate(order):
                  if t in low:return (i,mid)
              return (20,mid)
          for mid in sorted(dict.fromkeys(ids),key=rank)[:16]:
              req=urllib.request.Request('http://127.0.0.1:8877/v1/chat/completions',data=json.dumps({'model':mid,'messages':[{'role':'user','content':'Reply OK'}],'max_tokens':8,'stream':False}).encode(),headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:out=json.load(r)
                  m=((out.get('choices') or [{}])[0].get('message') or {})
                  if (m.get('content') or m.get('reasoning_content') or '').strip():
                      with open(os.environ['GITHUB_ENV'],'a') as env:env.write('BUG_MODEL='+mid+'\n')
                      print('Selected',mid)
                      raise SystemExit(0)
              except Exception as e:print('probe',mid,e)
          raise SystemExit('no healthy direct free model')
          PY

      - name: Build bounded Goose evidence
        run: |
          set -euo pipefail
          {
            echo '=== TARGET ==='
            cat .seven-team/bughunt/APK_TARGET.md
            echo
            echo '=== SECURITY / NETWORK / SELF-DEV SEAMS ==='
            git grep -nE 'github|token|secret|credential|secure|protected|permission|fetch\(|AbortController|timeout|retry|fallback|rate|429|503|offline|network|provider|cooldown|health|self.?dev|device|bridge' -- seven_ai-final.html release native-security-policy.cjs cloudflare apk verify.cjs | head -n 700 || true
          } > /tmp/goose-evidence.txt
          head -c 42000 /tmp/goose-evidence.txt > /tmp/goose-evidence-bounded.txt

      - name: Run real Goose agent
        env:
          GOOSE_PROVIDER: openai
          GOOSE_MODEL: ${{ env.BUG_MODEL }}
          GOOSE_MODE: auto
          GOOSE_CONTEXT_STRATEGY: summarize
          GOOSE_MAX_TURNS: '12'
          GOOSE_DISABLE_SESSION_NAMING: 'true'
          OPENAI_API_KEY: local-dummy-key
          OPENAI_HOST: http://127.0.0.1:8877
          OPENAI_BASE_PATH: v1/chat/completions
          REPORT: ${{ matrix.report }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          mkdir -p "$(dirname "$REPORT")"

          validate_report() {
            test -f "$REPORT" || return 1
            grep -q 'BUGHUNT=COMPLETE' "$REPORT" || return 1
            grep -qi 'Severity' "$REPORT" || return 1
            grep -qiE 'Affected|surface|file/function' "$REPORT" || return 1
            grep -qiE 'repro|reproduction|test idea' "$REPORT" || return 1
            test "$(wc -c < "$REPORT")" -ge 1200 || return 1
          }

          set +e
          timeout 300s goose run --no-session --with-builtin developer -t "$(cat /tmp/goose-prompt.md)" 2>&1 | tee /tmp/goose.out
          rc=${PIPESTATUS[0]}
          set -e

          if ! validate_report && grep -q 'BUGHUNT=COMPLETE' /tmp/goose.out; then
            cp /tmp/goose.out "$REPORT"
          fi

          if ! validate_report; then
            echo "Goose did not yield a valid report; synthesizing from bounded evidence."
            python - <<'PY'
          import json,os,pathlib,urllib.request
          prompt=pathlib.Path('/tmp/goose-prompt.md').read_text(encoding='utf-8')
          evidence=pathlib.Path('/tmp/goose-evidence-bounded.txt').read_text(encoding='utf-8',errors='replace')
          body=json.dumps({
            'model':os.environ['BUG_MODEL'],
            'messages':[
              {'role':'system','content':'Produce a concrete Seven AI bug-audit report from supplied repository evidence. Plain Markdown, no tool traces. Include bug IDs, severity, affected surfaces, evidence, reproduction/test ideas, fix directions, regression tests. End exactly BUGHUNT=COMPLETE.'},
              {'role':'user','content':prompt+'\n\nEVIDENCE:\n'+evidence}
            ],
            'temperature':0,'max_tokens':6500,'stream':False
          }).encode()
          req=urllib.request.Request('http://127.0.0.1:8877/v1/chat/completions',data=body,headers={'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=170) as r: d=json.load(r)
          m=((d.get('choices') or [{}])[0].get('message') or {})
          t=(m.get('content') or m.get('reasoning_content') or '').strip()
          if 'BUGHUNT=COMPLETE' in t: t=t[:t.rfind('BUGHUNT=COMPLETE')].rstrip()
          pathlib.Path(os.environ['REPORT']).write_text(t+'\n\nBUGHUNT=COMPLETE\n',encoding='utf-8')
          PY
          fi

          if ! validate_report; then
            echo "Goose report failed semantic quality gate (agent rc=$rc)." >&2
            sed -n '1,140p' "$REPORT" >&2 || true
            exit 1
          fi

      - name: Sanitize to allowed output only
        run: |
          set -euo pipefail
          EXPECTED='${{ matrix.report }}'
          cp "$EXPECTED" /tmp/seven-agent-report.md
          git reset --hard HEAD
          git clean -fdx
          mkdir -p "$(dirname "$EXPECTED")"
          cp /tmp/seven-agent-report.md "$EXPECTED"
          git add -f "$EXPECTED"
          count="$(git diff --cached --name-only | wc -l)"
          test "$count" -le 1
          if test "$count" -eq 1; then
            test "$(git diff --cached --name-only)" = "$EXPECTED"
            echo "REPORT_CHANGED=1" >> "$GITHUB_ENV"
          else
            echo "REPORT_CHANGED=0" >> "$GITHUB_ENV"
          fi

      - name: Commit and push controlled report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if test "${REPORT_CHANGED:-0}" = "0"; then
            echo "Report already matches branch; idempotent success."
            exit 0
          fi
          git config user.name 'Seven Team Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m "${{ matrix.commit_message }}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${{ matrix.branch }}
