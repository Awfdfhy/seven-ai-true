name: Seven Hermes Live Agent Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.seven-team/prompts/live-smoke/team-a-hermes.md'
      - '.seven-team/prompts/live-smoke/team-b-hermes.md'
      - '.github/workflows/agent-live-hermes-smoke.yml'

permissions:
  contents: write

concurrency:
  group: seven-hermes-live-smoke
  cancel-in-progress: true

jobs:
  hermes-live:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: Team A Hermes live review
            branch: agent/10-integration-review
            prompt_path: .seven-team/prompts/live-smoke/team-a-hermes.md
            report: .seven-team/reports/team-a-hermes-live-smoke.md
            commit_message: Agent A10 Hermes live runtime smoke report
          - name: Team B Hermes live review
            branch: agent-b/10-rpg-review
            prompt_path: .seven-team/prompts/live-smoke/team-b-hermes.md
            report: .seven-team/reports/team-b-hermes-live-smoke.md
            commit_message: Agent B10 Hermes live runtime smoke report

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Hermes Agent
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Materialize guarded runtime and prompt from main
        run: |
          git fetch origin main
          git show origin/main:.seven-team/runtime/kilo_anonymous_relay.py > /tmp/kilo_anonymous_relay.py
          git show origin/main:${{ matrix.prompt_path }} > /tmp/hermes-prompt.md

      - name: Start guarded relay
        run: |
          python /tmp/kilo_anonymous_relay.py > /tmp/seven-relay.log 2>&1 &
          ready=0
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8877/v1/models >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1

      - name: Run real Hermes agent
        env:
          CUSTOM_BASE_URL: http://127.0.0.1:8877/v1
          OPENAI_BASE_URL: http://127.0.0.1:8877/v1
          OPENAI_API_KEY: local-dummy-key
          HERMES_YOLO_MODE: '1'
        run: |
          set -u
          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          mkdir -p "$(dirname "${{ matrix.report }}")"
          set +e
          timeout 150s hermes \
            --provider custom \
            -m kilo-auto/free \
            --yolo \
            --ignore-rules \
            chat -Q --max-turns 4 -q "$(cat /tmp/hermes-prompt.md)"
          rc=$?
          set -e
          if test -f "${{ matrix.report }}" && grep -q 'LIVE_AGENT_SMOKE=PASS' "${{ matrix.report }}"; then
            echo "Hermes produced required report; accepting output (rc=$rc)."
          else
            echo "Hermes did not produce required report (rc=$rc)." >&2
            exit "${rc:-1}"
          fi

      - name: Sanitize to allowed output only
        run: |
          set -euo pipefail
          EXPECTED='${{ matrix.report }}'
          cp "$EXPECTED" /tmp/seven-agent-report.md
          git reset --hard HEAD
          git clean -fdx
          mkdir -p "$(dirname "$EXPECTED")"
          cp /tmp/seven-agent-report.md "$EXPECTED"
          git add -f "$EXPECTED"
          count="$(git diff --cached --name-only | wc -l)"
          test "$count" -le 1
          if test "$count" -eq 1; then
            test "$(git diff --cached --name-only)" = "$EXPECTED"
            echo "REPORT_CHANGED=1" >> "$GITHUB_ENV"
          else
            echo "REPORT_CHANGED=0" >> "$GITHUB_ENV"
          fi

      - name: Commit and push controlled report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if test "${REPORT_CHANGED:-0}" = "0"; then
            echo "Report already matches branch; idempotent success."
            exit 0
          fi
          git config user.name 'Seven Team Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m "${{ matrix.commit_message }}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${{ matrix.branch }}
