name: Seven Live Agent Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.seven-team/runtime/**'
      - '.seven-team/prompts/live-smoke/**'
      - '.github/workflows/agent-live-smoke.yml'

permissions:
  contents: write

concurrency:
  group: seven-live-agent-smoke
  cancel-in-progress: true

jobs:
  provider-brain:
    name: Anonymous free brain probe
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start guarded relay
        run: |
          python .seven-team/runtime/kilo_anonymous_relay.py > /tmp/seven-relay.log 2>&1 &
          echo $! > /tmp/seven-relay.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8877/v1/models >/tmp/models.json && break
            sleep 1
          done
          test -s /tmp/models.json
      - name: Verify live inference
        run: |
          curl -fsS http://127.0.0.1:8877/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"kilo-auto/free","messages":[{"role":"user","content":"Reply with exactly OK"}],"max_tokens":16,"temperature":0}' \
            > /tmp/brain.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/brain.json'))
          assert isinstance(d.get('choices'), list) and d['choices']
          msg=d['choices'][0].get('message') or {}
          print(msg.get('content',''))
          assert 'message' in d['choices'][0]
          PY

  aider-live:
    name: Team A Aider live edit
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/06-memory-context
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Aider
        run: |
          python -m pip install --upgrade pip
          python -m pip install aider-chat
      - name: Materialize runtime from main
        run: |
          git fetch origin main
          git show origin/main:.seven-team/runtime/kilo_anonymous_relay.py > /tmp/kilo_anonymous_relay.py
      - name: Start guarded relay
        run: |
          python /tmp/kilo_anonymous_relay.py > /tmp/seven-relay.log 2>&1 &
          echo $! > /tmp/seven-relay.pid
          ready=0
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8877/v1/models >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
      - name: Run real Aider agent
        env:
          OPENAI_API_BASE: http://127.0.0.1:8877/v1
          OPENAI_API_KEY: local-dummy-key
        run: |
          git show origin/main:.seven-team/prompts/live-smoke/team-a-aider.md > /tmp/team-a-aider.md
          mkdir -p .seven-team/reports
          touch .seven-team/reports/team-a-aider-live-smoke.md
          aider .seven-team/reports/team-a-aider-live-smoke.md \
            --model openai/kilo-auto/free \
            --message-file /tmp/team-a-aider.md \
            --yes-always \
            --no-auto-commits \
            --no-dirty-commits \
            --no-gitignore \
            --no-show-model-warnings
      - name: Sanitize to allowed output only
        run: |
          set -euo pipefail
          EXPECTED='.seven-team/reports/team-a-aider-live-smoke.md'
          test -f "$EXPECTED"
          grep -q 'LIVE_AGENT_SMOKE=PASS' "$EXPECTED"
          cp "$EXPECTED" /tmp/seven-agent-report.md
          git reset --hard HEAD
          git clean -fdx
          mkdir -p "$(dirname "$EXPECTED")"
          cp /tmp/seven-agent-report.md "$EXPECTED"
          git add -f "$EXPECTED"
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "$EXPECTED"
      - name: Commit and push controlled report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'Seven Team Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git add .seven-team/reports/team-a-aider-live-smoke.md
          git commit -m 'Agent A06 live runtime smoke report'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:agent/06-memory-context

  aider-team-b-live:
    name: Team B Aider live edit
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-b/06-rpg-memory
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Aider
        run: |
          python -m pip install --upgrade pip
          python -m pip install aider-chat
      - name: Materialize runtime from main
        run: |
          git fetch origin main
          git show origin/main:.seven-team/runtime/kilo_anonymous_relay.py > /tmp/kilo_anonymous_relay.py
      - name: Start guarded relay
        run: |
          python /tmp/kilo_anonymous_relay.py > /tmp/seven-relay.log 2>&1 &
          echo $! > /tmp/seven-relay.pid
          ready=0
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8877/v1/models >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
      - name: Run real Aider agent
        env:
          OPENAI_API_BASE: http://127.0.0.1:8877/v1
          OPENAI_API_KEY: local-dummy-key
        run: |
          git show origin/main:.seven-team/prompts/live-smoke/team-b-aider.md > /tmp/team-b-aider.md
          mkdir -p .seven-team/reports
          touch .seven-team/reports/team-b-aider-live-smoke.md
          aider .seven-team/reports/team-b-aider-live-smoke.md \
            --model openai/kilo-auto/free \
            --message-file /tmp/team-b-aider.md \
            --yes-always \
            --no-auto-commits \
            --no-dirty-commits \
            --no-gitignore \
            --no-show-model-warnings
      - name: Sanitize to allowed output only
        run: |
          set -euo pipefail
          EXPECTED='.seven-team/reports/team-b-aider-live-smoke.md'
          test -f "$EXPECTED"
          grep -q 'LIVE_AGENT_SMOKE=PASS' "$EXPECTED"
          cp "$EXPECTED" /tmp/seven-agent-report.md
          git reset --hard HEAD
          git clean -fdx
          mkdir -p "$(dirname "$EXPECTED")"
          cp /tmp/seven-agent-report.md "$EXPECTED"
          test "$(git status --porcelain | wc -l)" -eq 1
      - name: Commit and push controlled report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'Seven Team Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git add .seven-team/reports/team-b-aider-live-smoke.md
          git commit -m 'Agent B06 live runtime smoke report'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:agent-b/06-rpg-memory
