name: Seven Live Agent Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.seven-team/runtime/**'
      - '.seven-team/prompts/live-smoke/**'
      - '.github/workflows/agent-live-smoke.yml'

permissions:
  contents: write

concurrency:
  group: seven-live-agent-smoke
  cancel-in-progress: true

jobs:
  provider-brain:
    name: Anonymous free brain probe
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start guarded relay
        run: |
          python .seven-team/runtime/kilo_anonymous_relay.py > /tmp/seven-relay.log 2>&1 &
          echo $! > /tmp/seven-relay.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8877/v1/models >/tmp/models.json && break
            sleep 1
          done
          test -s /tmp/models.json
      - name: Verify live inference
        run: |
          curl -fsS http://127.0.0.1:8877/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"kilo-auto/free","messages":[{"role":"user","content":"Reply with exactly SEVEN_BRAIN_OK"}],"max_tokens":32,"temperature":0}' \
            > /tmp/brain.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/brain.json'))
          text=d['choices'][0]['message']['content']
          print(text)
          assert 'SEVEN_BRAIN_OK' in text
          PY

  aider-live:
    name: Team A Aider live edit
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/06-memory-context
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Aider
        run: |
          python -m pip install --upgrade pip
          python -m pip install aider-chat
      - name: Start guarded relay
        run: |
          python .seven-team/runtime/kilo_anonymous_relay.py > /tmp/seven-relay.log 2>&1 &
          echo $! > /tmp/seven-relay.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8877/v1/models >/dev/null && break
            sleep 1
          done
      - name: Run real Aider agent
        env:
          OPENAI_API_BASE: http://127.0.0.1:8877/v1
          OPENAI_API_KEY: local-dummy-key
        run: |
          mkdir -p .seven-team/reports
          aider \
            --model openai/kilo-auto/free \
            --message-file .seven-team/prompts/live-smoke/team-a-aider.md \
            --yes-always \
            --no-auto-commits \
            --no-dirty-commits \
            --no-show-model-warnings
      - name: Enforce write boundary
        run: |
          set -euo pipefail
          EXPECTED='.seven-team/reports/team-a-aider-live-smoke.md'
          test -f "$EXPECTED"
          grep -q 'LIVE_AGENT_SMOKE=PASS' "$EXPECTED"
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //' | sort -u)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$EXPECTED"
      - name: Commit and push controlled report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'Seven Team Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git add .seven-team/reports/team-a-aider-live-smoke.md
          git commit -m 'Agent A06 live runtime smoke report'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:agent/06-memory-context

  qwen-live:
    name: Team B Qwen live edit
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-b/09-rpg-performance
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Qwen Code
        run: npm install -g @qwen-code/qwen-code@latest
      - name: Start guarded relay
        run: |
          python .seven-team/runtime/kilo_anonymous_relay.py > /tmp/seven-relay.log 2>&1 &
          echo $! > /tmp/seven-relay.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8877/v1/models >/dev/null && break
            sleep 1
          done
      - name: Run real Qwen Code agent
        env:
          OPENAI_API_KEY: local-dummy-key
          OPENAI_BASE_URL: http://127.0.0.1:8877/v1
          OPENAI_MODEL: kilo-auto/free
          QWEN_CODE_SUPPRESS_YOLO_WARNING: 'true'
        run: |
          mkdir -p .seven-team/reports
          qwen -p "$(cat .seven-team/prompts/live-smoke/team-b-qwen.md)" \
            --approval-mode yolo \
            --output-format text \
            --model kilo-auto/free \
            --openai-api-key local-dummy-key \
            --openai-base-url http://127.0.0.1:8877/v1
      - name: Enforce write boundary
        run: |
          set -euo pipefail
          EXPECTED='.seven-team/reports/team-b-qwen-live-smoke.md'
          test -f "$EXPECTED"
          grep -q 'LIVE_AGENT_SMOKE=PASS' "$EXPECTED"
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //' | sort -u)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$EXPECTED"
      - name: Commit and push controlled report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'Seven Team Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git add .seven-team/reports/team-b-qwen-live-smoke.md
          git commit -m 'Agent B09 live runtime smoke report'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:agent-b/09-rpg-performance
