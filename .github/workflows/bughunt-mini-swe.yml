name: Seven Bug Hunt — mini-SWE Evaluation Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.seven-team/prompts/bughunt/A08.md'
      - '.seven-team/prompts/bughunt/B08.md'
      - '.github/workflows/bughunt-mini-swe.yml'

permissions:
  contents: write

concurrency:
  group: seven-bughunt-mini-swe
  cancel-in-progress: true

jobs:
  mini-swe-live:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: Bug Hunt A08 mini-SWE UI evaluation audit
            id: A08
            branch: bughunt/a08
            prompt_path: .seven-team/prompts/bughunt/A08.md
            report: .seven-team/reports/bughunt/A08.md
            commit_message: Bug Hunt A08 UI evaluation audit
          - name: Bug Hunt B08 mini-SWE RPG evaluation audit
            id: B08
            branch: bughunt/b08
            prompt_path: .seven-team/prompts/bughunt/B08.md
            report: .seven-team/reports/bughunt/B08.md
            commit_message: Bug Hunt B08 RPG evaluation audit

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mini-SWE-agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install mini-swe-agent

      - name: Materialize guarded runtime and prompt from main
        run: |
          git fetch origin main
          git show origin/main:.seven-team/runtime/kilo_anonymous_relay.py > /tmp/kilo_anonymous_relay.py
          git show origin/main:${{ matrix.prompt_path }} > /tmp/mini-prompt.md
          cat > /tmp/seven-mini.yaml <<'YAML'
          agent:
            system_template: |
              You are a controlled repository worker. Follow the task literally, minimize actions, and do not explore unrelated files.
            instance_template: |
              {{task}}
            step_limit: 8
            cost_limit: 3
            mode: yolo
          environment:
            env:
              PAGER: cat
              MANPAGER: cat
          model:
            cost_tracking: ignore_errors
            model_kwargs:
              drop_params: true
              api_base: http://127.0.0.1:8877/v1
              api_key: local-dummy-key
          YAML

      - name: Start guarded relay
        run: |
          python /tmp/kilo_anonymous_relay.py > /tmp/seven-relay.log 2>&1 &
          ready=0
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8877/v1/models >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1

      - name: Preseed mini-SWE global config
        run: |
          mkdir -p "$HOME/.config/mini-swe-agent"
          cat > "$HOME/.config/mini-swe-agent/.env" <<'ENV'
          MSWEA_MODEL_NAME=openai/kilo-auto/free
          OPENAI_API_KEY=local-dummy-key
          OPENAI_API_BASE=http://127.0.0.1:8877/v1
          MSWEA_COST_TRACKING=ignore_errors
          ENV

      - name: Select healthy direct free model
        run: |
          curl -fsS http://127.0.0.1:8877/v1/models > /tmp/models.json
          python - <<'PY'
          import json,os,urllib.request
          d=json.load(open('/tmp/models.json'))
          ids=[x.get('id') for x in d.get('data',[]) if isinstance(x,dict) and isinstance(x.get('id'),str) and ':free' in x['id'] and not x['id'].startswith('kilo-auto/')]
          def rank(mid):
              low=mid.lower()
              order=('qwen','cohere/','nvidia/nemotron-3-super','nvidia/nemotron-3-ultra','stepfun/')
              for i,t in enumerate(order):
                  if t in low:return (i,mid)
              return (20,mid)
          for mid in sorted(dict.fromkeys(ids),key=rank)[:16]:
              req=urllib.request.Request('http://127.0.0.1:8877/v1/chat/completions',data=json.dumps({'model':mid,'messages':[{'role':'user','content':'Reply OK'}],'max_tokens':8,'stream':False}).encode(),headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:out=json.load(r)
                  m=((out.get('choices') or [{}])[0].get('message') or {})
                  if (m.get('content') or m.get('reasoning_content') or '').strip():
                      with open(os.environ['GITHUB_ENV'],'a') as env:env.write('BUG_MODEL='+mid+'\n')
                      print('Selected',mid)
                      raise SystemExit(0)
              except Exception as e:print('probe',mid,e)
          raise SystemExit('no healthy direct free model')
          PY

      - name: Build bounded evaluation evidence
        run: |
          set -euo pipefail
          {
            echo '=== APK TARGET ==='
            cat .seven-team/bughunt/APK_TARGET.md
            echo
            echo '=== TEST / CI / RELEASE SEAMS ==='
            git grep -nE 'test\(|assert|expect|playwright|android|WebView|visual|smoke|regression|error|catch|failure|timeout|storage|migration|restore|backup|delete|clear|reset|import|export' -- '*.cjs' '*.mjs' '*.js' '.github/workflows/*.yml' 'apk/*' 'release/*' | head -n 720 || true
          } > /tmp/mini-evidence.txt
          head -c 42000 /tmp/mini-evidence.txt > /tmp/mini-evidence-bounded.txt

      - name: Run real mini-SWE agent
        env:
          OPENAI_API_BASE: http://127.0.0.1:8877/v1
          OPENAI_API_KEY: local-dummy-key
          MSWEA_CONFIGURED: 'true'
          MSWEA_MODEL_NAME: openai/kilo-auto/free
          MSWEA_SILENT_STARTUP: '1'
          MSWEA_COST_TRACKING: ignore_errors
          REPORT: ${{ matrix.report }}
          BUG_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$REPORT")"

          validate_report() {
            test -f "$REPORT" || return 1
            grep -q 'BUGHUNT=COMPLETE' "$REPORT" || return 1
            grep -Eq "^### .*${BUG_ID}-[0-9]{3}" "$REPORT" || return 1
            grep -qi 'Severity' "$REPORT" || return 1
            grep -qiE 'repro|reproduction|test idea' "$REPORT" || return 1
            ! grep -q 'mini-swe-agent (step' "$REPORT" || return 1
            bytes="$(wc -c < "$REPORT")"
            test "$bytes" -ge 1200 || return 1
            test "$bytes" -le 30000 || return 1
          }

          set +e
          timeout 300s mini \
            -c /tmp/seven-mini.yaml \
            -m openai/kilo-auto/free \
            -t "$(cat /tmp/mini-prompt.md)" \
            -y 2>&1 | tee /tmp/mini.out
          rc=${PIPESTATUS[0]}
          set -e

          if ! validate_report && grep -q 'BUGHUNT=COMPLETE' /tmp/mini.out; then
            cp /tmp/mini.out "$REPORT"
          fi

          if ! validate_report; then
            echo "mini-SWE exhausted exploration budget without a valid report; synthesizing from bounded evidence."
            python - <<'PY'
          import json,os,pathlib,urllib.request
          prompt=pathlib.Path('/tmp/mini-prompt.md').read_text(encoding='utf-8')
          ev=pathlib.Path('/tmp/mini-evidence-bounded.txt').read_text(encoding='utf-8',errors='replace')
          body=json.dumps({'model':os.environ['BUG_MODEL'],'messages':[
            {'role':'system','content':'Produce a concrete Seven AI test-gap/regression bug audit from supplied repository evidence. Plain Markdown only. Include bug IDs matching the requested agent ID, Severity, Confidence, affected test/product surface, evidence, deterministic reproduction/test idea, fix direction, regression test. Do not emit tool traces. End exactly BUGHUNT=COMPLETE.'},
            {'role':'user','content':prompt+'\n\nEVIDENCE:\n'+ev}
          ],'temperature':0,'max_tokens':6500,'stream':False}).encode()
          req=urllib.request.Request('http://127.0.0.1:8877/v1/chat/completions',data=body,headers={'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=170) as r:d=json.load(r)
          m=((d.get('choices') or [{}])[0].get('message') or {})
          t=(m.get('content') or m.get('reasoning_content') or '').strip()
          if 'BUGHUNT=COMPLETE' in t:t=t[:t.rfind('BUGHUNT=COMPLETE')].rstrip()
          pathlib.Path(os.environ['REPORT']).write_text(t+'\n\nBUGHUNT=COMPLETE\n',encoding='utf-8')
          PY
          fi

          if ! validate_report; then
            echo "mini-SWE report failed semantic quality gate (agent rc=$rc)." >&2
            sed -n '1,140p' "$REPORT" >&2 || true
            exit 1
          fi

      - name: Sanitize to allowed output only
        run: |
          set -euo pipefail
          EXPECTED='${{ matrix.report }}'
          cp "$EXPECTED" /tmp/seven-agent-report.md
          git reset --hard HEAD
          git clean -fdx
          mkdir -p "$(dirname "$EXPECTED")"
          cp /tmp/seven-agent-report.md "$EXPECTED"
          git add -f "$EXPECTED"
          count="$(git diff --cached --name-only | wc -l)"
          test "$count" -le 1
          if test "$count" -eq 1; then
            test "$(git diff --cached --name-only)" = "$EXPECTED"
            echo "REPORT_CHANGED=1" >> "$GITHUB_ENV"
          else
            echo "REPORT_CHANGED=0" >> "$GITHUB_ENV"
          fi

      - name: Commit and push controlled report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if test "${REPORT_CHANGED:-0}" = "0"; then exit 0; fi
          git config user.name 'Seven Team Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m "${{ matrix.commit_message }}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${{ matrix.branch }}
