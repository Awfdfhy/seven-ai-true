name: One-time Seven branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-cleanup-branches.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 1

      - name: Delete every remote branch except main
        shell: bash
        run: |
          set -u
          failed=0
          deleted=0
          while IFS= read -r ref; do
            branch="${ref#refs/heads/}"
            [ "$branch" = "main" ] && continue
            echo "Deleting: $branch"
            if git push origin --delete "$branch"; then
              deleted=$((deleted + 1))
            else
              echo "::error::Failed to delete $branch"
              failed=$((failed + 1))
            fi
          done < <(git ls-remote --heads origin | awk '{print $2}')
          echo "Deleted $deleted branches"
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed branch deletions failed"
            exit 1
          fi
