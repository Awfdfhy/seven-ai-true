# Pinned main validation is also run on an isolated release/rc-* branch.
name: Seven Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - apk-finalization
      - main
      - 'release/rc-*'
    paths:
      - 'seven_ai-final.html'
      - 'release/**'
      - 'apk/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: seven-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install JS build dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium for release gate
        run: npx playwright install --with-deps --only-shell chromium

      - name: Re-run Seven pre-APK release gate
        run: node all.cjs

      - name: Generate native Android project
        env:
          SEVEN_EMBED_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SEVEN_EMBED_NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SEVEN_EMBED_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SEVEN_EMBED_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEVEN_EMBED_LLM7_API_TOKEN: ${{ secrets.LLM7_API_TOKEN }}
          SEVEN_EMBED_AION_API_KEY: ${{ secrets.AION_API_KEY }}
          SEVEN_EMBED_MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SEVEN_EMBED_ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: npm run android:generate

      - name: Android lint, unit tests and APK build
        working-directory: android
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Verify packaged APK contents and size
        run: npm run android:verify

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 WebView device smoke test
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # The runner starts a separate shell for each line; preserve the test result while collecting evidence.
          script: |
            adb shell rm -rf /data/local/tmp/seven-visual || true
            adb shell mkdir -p /data/local/tmp/seven-visual
            rm -rf visual-evidence/android16
            mkdir -p visual-evidence/android16
            seven_test_status=0; (cd android && ./gradlew --no-daemon :app:connectedDebugAndroidTest) || seven_test_status=$?; adb pull /data/local/tmp/seven-visual/. visual-evidence/android16/ || true; if [ "$seven_test_status" -ne 0 ]; then exit "$seven_test_status"; fi
            bash apk/run-rpg-force-stop.sh

      - name: Android 14 WebView UI regression test
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # The runner starts a separate shell for each line; preserve the test result while collecting evidence.
          script: |
            adb shell settings put system font_scale 1.15 || true
            adb shell rm -rf /data/local/tmp/seven-visual || true
            adb shell mkdir -p /data/local/tmp/seven-visual
            rm -rf visual-evidence/android14
            mkdir -p visual-evidence/android14
            seven_test_status=0; (cd android && ./gradlew --no-daemon :app:connectedDebugAndroidTest) || seven_test_status=$?; adb pull /data/local/tmp/seven-visual/. visual-evidence/android14/ || true; if [ "$seven_test_status" -ne 0 ]; then exit "$seven_test_status"; fi
            bash apk/run-rpg-force-stop.sh

      - name: Upload Android UI visual evidence
        if: ${{ always() && hashFiles('visual-evidence/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: seven-ui-visual-evidence
          path: visual-evidence
          if-no-files-found: error
          retention-days: 3

      - name: Upload Android gate diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: seven-android-gate-diagnostics
          path: |
            android/app/build/reports/androidTests/**
            android/app/build/outputs/androidTest-results/**
            android/app/build/reports/lint-results-debug.html
            dist/apk-verification.json
          if-no-files-found: warn
          retention-days: 7

      - name: Verify APK again after device tests
        run: npm run android:verify

      - name: Upload installable Seven APK
        uses: actions/upload-artifact@v7
        with:
          path: android/app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK identity and verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: seven-apk-verification
          path: dist/apk-verification.json
          if-no-files-found: error
          retention-days: 14

      - name: Resolve RPG Live LLM provider
        id: rpg-provider
        env:
          SEVEN_RPG_GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          SEVEN_RPG_OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SEVEN_RPG_NVIDIA_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SEVEN_RPG_MISTRAL_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          if [ -n "$SEVEN_RPG_GROQ_KEY" ] || [ -n "$SEVEN_RPG_OPENROUTER_KEY" ] || [ -n "$SEVEN_RPG_NVIDIA_KEY" ] || [ -n "$SEVEN_RPG_MISTRAL_KEY" ]; then
            echo "local=false" >> "$GITHUB_OUTPUT"
          else
            echo "local=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Ollama for real local RPG acceptance
        if: steps.rpg-provider.outputs.local == 'true'
        uses: ai-action/setup-ollama@v2

      - name: Start local real AI and pull Qwen
        if: steps.rpg-provider.outputs.local == 'true'
        run: |
          ollama serve > "$RUNNER_TEMP/ollama-rpg.log" 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:11434/api/version > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/version > /dev/null
          ollama pull qwen2.5:1.5b-instruct

      - name: Real RPG Live LLM + Canon acceptance
        env:
          SEVEN_RPG_GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          SEVEN_RPG_OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SEVEN_RPG_NVIDIA_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SEVEN_RPG_MISTRAL_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SEVEN_RPG_ALLOW_LOCAL_LLM: ${{ steps.rpg-provider.outputs.local }}
        run: node apk/rpg-live-llm-acceptance.cjs
