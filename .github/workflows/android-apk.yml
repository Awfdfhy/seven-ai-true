name: Seven Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - ultimate-polish-v1
      - apk-finalization
      - main
    paths:
      - 'seven_ai-final.html'
      - 'release/**'
      - 'apk/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install JS build dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Materialize dependency audit lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Enforce production dependency audit gate
        run: |
          npm audit --json > /tmp/seven-audit-full.json || true
          npm audit --omit=dev --json > /tmp/seven-audit-prod.json || true
          node release/dependency-audit-gate.cjs /tmp/seven-audit-full.json /tmp/seven-audit-prod.json release/dependency-audit-summary.json

      - name: Install Chromium for release gate
        run: npx --no-install playwright install --with-deps --only-shell chromium

      - name: Re-run Seven pre-APK release gate
        run: node all.cjs

      - name: Generate native Android project
        run: npm run android:generate

      - name: Create deterministic CI signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Seven CI,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Android lint, unit tests, debug APK, release test APK and signed release APK
        working-directory: android
        run: |
          ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug :app:assembleReleaseAndroidTest :app:assembleRelease \
            -PsevenCiKeystore="$HOME/.android/debug.keystore" \
            -PsevenCiStorePass=android \
            -PsevenCiKeyAlias=androiddebugkey \
            -PsevenCiKeyPass=android

      - name: Verify debug and release package contents
        run: |
          npm run android:verify
          SEVEN_APK_PATH=android/app/build/outputs/apk/release/app-release.apk npm run android:verify

      - name: Verify CI signer parity for release instrumentation
        run: |
          set -euo pipefail
          RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          TEST_APK="android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          cert_digest() {
            "$APKSIGNER" verify --verbose --print-certs "$1" >/dev/null
            "$APKSIGNER" verify --print-certs "$1" | awk -F': ' '/certificate SHA-256 digest/ {print $NF; exit}' | tr -d ':[:space:]'
          }
          RELEASE_SIGNER="$(cert_digest "$RELEASE_APK")"
          DEBUG_SIGNER="$(cert_digest "$DEBUG_APK")"
          TEST_SIGNER="$(cert_digest "$TEST_APK")"
          test -n "$RELEASE_SIGNER"
          test "$RELEASE_SIGNER" = "$DEBUG_SIGNER"
          test "$RELEASE_SIGNER" = "$TEST_SIGNER"
          echo "Android CI signer parity: PASS (release = debug = release visual instrumentation)"

      - name: Seal exact CI release artifact identity
        run: |
          set -euo pipefail
          RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$RELEASE_APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK"
          SIGNER_SHA256="$("$APKSIGNER" verify --print-certs "$RELEASE_APK" | awk -F': ' '/certificate SHA-256 digest/ {print $NF; exit}' | tr -d ':[:space:]')"
          BADGING="$("$AAPT" dump badging "$RELEASE_APK" | head -n 1)"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          test -n "$SIGNER_SHA256"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          node release/android-ci-release-artifact.cjs \
            --apk "$RELEASE_APK" \
            --out-dir evidence/android \
            --branch "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --application-id ai.seven.app \
            --version-name "$VERSION_NAME" \
            --version-code "$VERSION_CODE" \
            --signer "$SIGNER_SHA256" \
            --source-ref "github-actions:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 release WebView integration smoke
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd android && ./gradlew --no-daemon :app:connectedReleaseAndroidTest -PsevenCiKeystore="$HOME/.android/debug.keystore" -PsevenCiStorePass=android -PsevenCiKeyAlias=androiddebugkey -PsevenCiKeyPass=android -Pandroid.testInstrumentationRunnerArguments.class=ai.seven.app.SevenSmokeTest

      - name: Capture compact API 33 release-app plus adaptive-launcher evidence
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 33
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 1080x2160
            adb shell wm density 480
            SEVEN_ANDROID_PROFILE_ID=api33-compact node apk/capture-android-release-profile.cjs
            SEVEN_ANDROID_PROFILE_ID=api33-compact SEVEN_SYSTEM_SCENARIOS=launcher-adaptive node apk/capture-android-system-visuals.cjs

      - name: Capture modern API 36 release-app themed-launcher and splash evidence
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis_playstore
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            SEVEN_ANDROID_PROFILE_ID=api36-modern node apk/capture-android-release-profile.cjs
            node apk/prepare-pixel-launcher-home.cjs
            node apk/patch-themed-resolver-fallback.cjs
            SEVEN_ANDROID_PROFILE_ID=api36-modern node apk/capture-android-themed-launcher-ui.cjs
            SEVEN_ANDROID_PROFILE_ID=api36-modern SEVEN_SYSTEM_SCENARIOS=splash node apk/capture-android-splash-burst.cjs

      - name: Capture API 24 genuine legacy-launcher evidence
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 24
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: SEVEN_ANDROID_PROFILE_ID=api24-legacy SEVEN_SYSTEM_SCENARIOS=launcher-legacy node apk/capture-android-legacy-launcher-ui.cjs

      - name: Merge complete release-device Android visual matrix
        run: |
          node release/merge-android-visual-evidence.cjs \
            --build evidence/android/build-identity.json \
            --profile evidence/android/profiles/api24-legacy/profile-evidence.json \
            --profile evidence/android/profiles/api33-compact/profile-evidence.json \
            --profile evidence/android/profiles/api36-modern/profile-evidence.json \
            --out evidence/android/android-visual-certification.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('evidence/android/android-visual-certification.json','utf8'));
          if(x.certification.verdict!=='PASS')throw Error(`Wave 22 Android visual certification is ${x.certification.verdict}: missing=${x.certification.missing.join(',')} failures=${x.certification.failures.join(',')}`);
          if(x.certification.covered.length!==11||x.certification.missing.length!==0)throw Error('complete 11-scenario Android visual matrix required');
          console.log('Wave 22 Android visual certification: PASS (11/11 genuine release-device scenarios)');
          NODE

      - name: Verify APK again after device tests
        run: |
          npm run android:verify
          SEVEN_APK_PATH=android/app/build/outputs/apk/release/app-release.apk npm run android:verify

      - name: Final Seven exact-RC verification and closure
        run: |
          node release/final-seven-closure.cjs \
            --rc evidence/android/exact-rc.json \
            --visual evidence/android/android-visual-certification.json \
            --dependency-audit release/dependency-audit-summary.json \
            --apk android/app/build/outputs/apk/release/app-release.apk \
            --out evidence/android/final-seven-closure.json \
            --branch "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --source-ref "github-actions:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:final-seven"

      - name: Upload installable Seven debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seven-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed CI release candidate APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seven-ci-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload Wave 22 release-device evidence bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seven-wave22-release-visual-evidence
          path: evidence/android
          if-no-files-found: error
          retention-days: 14
