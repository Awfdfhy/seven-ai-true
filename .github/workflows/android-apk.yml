name: Seven Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - ultimate-polish-v1
      - apk-finalization
      - main
    paths:
      - 'seven_ai-final.html'
      - 'release/**'
      - 'apk/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install JS build dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Materialize dependency audit lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Enforce production dependency audit gate
        run: |
          npm audit --json > /tmp/seven-audit-full.json || true
          npm audit --omit=dev --json > /tmp/seven-audit-prod.json || true
          node release/dependency-audit-gate.cjs /tmp/seven-audit-full.json /tmp/seven-audit-prod.json release/dependency-audit-summary.json

      - name: Install Chromium for release gate
        run: npx --no-install playwright install --with-deps --only-shell chromium

      - name: Re-run Seven pre-APK release gate
        run: node all.cjs

      - name: Generate native Android project
        run: npm run android:generate

      - name: Create deterministic CI signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Seven CI,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Android lint, unit tests, debug test APK and signed release APK
        working-directory: android
        run: |
          ./gradlew --no-daemon \
            lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease \
            -Pandroid.injected.signing.store.file="$HOME/.android/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: Verify debug and release package contents
        run: |
          npm run android:verify
          SEVEN_APK_PATH=android/app/build/outputs/apk/release/app-release.apk npm run android:verify

      - name: Seal exact CI release artifact identity
        run: |
          set -euo pipefail
          RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$RELEASE_APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK"
          SIGNER_SHA256="$("$APKSIGNER" verify --print-certs "$RELEASE_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ':[:space:]')"
          BADGING="$("$AAPT" dump badging "$RELEASE_APK" | head -n 1)"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          test -n "$SIGNER_SHA256"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          node release/android-ci-release-artifact.cjs \
            --apk "$RELEASE_APK" \
            --out-dir evidence/android \
            --branch "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --application-id ai.seven.app \
            --version-name "$VERSION_NAME" \
            --version-code "$VERSION_CODE" \
            --signer "$SIGNER_SHA256" \
            --source-ref "github-actions:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 debug WebView integration smoke
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd android && ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Capture compact API 28 signed-release in-app visual evidence
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 28
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 1080x2160
            adb shell wm density 480
            SEVEN_RELEASE_APK=android/app/build/outputs/apk/release/app-release.apk \
            SEVEN_ANDROID_TEST_APK=android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            SEVEN_ANDROID_BUILD_IDENTITY=evidence/android/build-identity.json \
            SEVEN_ANDROID_PROFILE_ID=api28-compact \
            SEVEN_ANDROID_PROFILE_OUT=evidence/android/profiles/api28-compact \
            SEVEN_ANDROID_ENVIRONMENT=EMULATOR \
            node apk/capture-android-release-profile.cjs

      - name: Capture modern API 36 signed-release in-app visual evidence
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            SEVEN_RELEASE_APK=android/app/build/outputs/apk/release/app-release.apk \
            SEVEN_ANDROID_TEST_APK=android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            SEVEN_ANDROID_BUILD_IDENTITY=evidence/android/build-identity.json \
            SEVEN_ANDROID_PROFILE_ID=api36-modern \
            SEVEN_ANDROID_PROFILE_OUT=evidence/android/profiles/api36-modern \
            SEVEN_ANDROID_ENVIRONMENT=EMULATOR \
            node apk/capture-android-release-profile.cjs

      - name: Merge release-device visual evidence without laundering missing system contexts
        run: |
          node release/merge-android-visual-evidence.cjs \
            --build evidence/android/build-identity.json \
            --profile evidence/android/profiles/api28-compact/profile-evidence.json \
            --profile evidence/android/profiles/api36-modern/profile-evidence.json \
            --out evidence/android/android-visual-certification.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('evidence/android/android-visual-certification.json','utf8'));
          if(x.certification.verdict==='BLOCK')throw Error('visual evidence BLOCK');
          const expected=['launcher-adaptive','launcher-themed','launcher-legacy','splash'];
          for(const s of expected)if(!x.certification.missing.includes(s))throw Error('unexpectedly promoted uncollected system scenario: '+s);
          if(x.certification.covered.length!==7)throw Error('expected seven genuine in-app release scenarios');
          console.log('Wave 22 CI evidence checkpoint: truthful INCONCLUSIVE with 7/11 genuine scenarios');
          NODE

      - name: Verify APK again after device tests
        run: |
          npm run android:verify
          SEVEN_APK_PATH=android/app/build/outputs/apk/release/app-release.apk npm run android:verify

      - name: Upload installable Seven debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seven-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed CI release candidate APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seven-ci-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload Wave 22 release-device evidence bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seven-wave22-release-visual-evidence
          path: evidence/android
          if-no-files-found: error
          retention-days: 14
