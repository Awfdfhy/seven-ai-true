# RC integration validation: application sources are pinned; Android runs on isolated release/rc-* refs.
name: Seven Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - apk-finalization
      - main
      - 'release/rc-*'
    paths:
      - 'seven_ai-final.html'
      - 'release/**'
      - 'apk/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: seven-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install JS build dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium for release gate
        run: npx playwright install --with-deps --only-shell chromium

      - name: Re-run Seven pre-APK release gate
        run: node all.cjs

      - name: Generate native Android project
        env:
          SEVEN_EMBED_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SEVEN_EMBED_NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SEVEN_EMBED_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SEVEN_EMBED_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEVEN_EMBED_LLM7_API_TOKEN: ${{ secrets.LLM7_API_TOKEN }}
          SEVEN_EMBED_AION_API_KEY: ${{ secrets.AION_API_KEY }}
          SEVEN_EMBED_MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SEVEN_EMBED_ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: npm run android:generate

      - name: Android lint, unit tests and APK build
        working-directory: android
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Verify packaged APK contents and size
        run: npm run android:verify

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 WebView device smoke test
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # The runner starts a separate shell for each line; preserve the test result while collecting evidence.
          script: |
            adb shell rm -rf /data/local/tmp/seven-visual || true
            adb shell mkdir -p /data/local/tmp/seven-visual
            rm -rf visual-evidence/android16
            mkdir -p visual-evidence/android16
            seven_test_status=0; (cd android && ./gradlew --no-daemon :app:connectedDebugAndroidTest) || seven_test_status=$?; adb pull /data/local/tmp/seven-visual/. visual-evidence/android16/ || true; exit "$seven_test_status"

      - name: Android 14 WebView UI regression test
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # The runner starts a separate shell for each line; preserve the test result while collecting evidence.
          script: |
            adb shell settings put system font_scale 1.15 || true
            adb shell rm -rf /data/local/tmp/seven-visual || true
            adb shell mkdir -p /data/local/tmp/seven-visual
            rm -rf visual-evidence/android14
            mkdir -p visual-evidence/android14
            seven_test_status=0; (cd android && ./gradlew --no-daemon :app:connectedDebugAndroidTest) || seven_test_status=$?; adb pull /data/local/tmp/seven-visual/. visual-evidence/android14/ || true; exit "$seven_test_status"

      - name: Upload Android UI visual evidence
        if: ${{ always() && hashFiles('visual-evidence/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: seven-ui-visual-evidence
          path: visual-evidence
          if-no-files-found: error
          retention-days: 3

      - name: Upload Android gate diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: seven-android-gate-diagnostics
          path: |
            android/app/build/reports/androidTests/**
            android/app/build/outputs/androidTest-results/**
            android/app/build/reports/lint-results-debug.html
            dist/apk-verification.json
          if-no-files-found: warn
          retention-days: 7

      - name: Verify APK again after device tests
        run: npm run android:verify

      - name: Upload installable Seven APK
        uses: actions/upload-artifact@v7
        with:
          path: android/app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK identity and verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: seven-apk-verification
          path: dist/apk-verification.json
          if-no-files-found: error
          retention-days: 14
