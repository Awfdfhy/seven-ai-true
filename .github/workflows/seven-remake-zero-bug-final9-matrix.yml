name: Seven Remake Zero Bug Final9 Matrix

on:
  push:
    branches:
      - remake-manager/zero-bug-pass-01
    paths:
      - '.github/workflows/seven-remake-zero-bug-final9-matrix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
          - id: F03
            focus: Timeout deadline bounds timer cleanup clock rollback and abort semantics
          - id: F05
            focus: Room message invariants immutable snapshots timestamps duplicate IDs and malformed runtime values
          - id: F09
            focus: Chat persistence failures before user write after user write and during assistant commit
          - id: F14
            focus: ProviderAdapter runtime contract malformed chunks models and adapter identity
          - id: F15
            focus: Fallback before meaningful output whitespace prelude empty output and malformed chunks
          - id: F20
            focus: Preferred model resolution cross-provider collisions and qualified model identities
          - id: F21
            focus: ProviderHealth penalties cooldowns stale success failure ordering and recovery
          - id: F28
            focus: Performance resource behavior cloning cost unbounded arrays maps listeners timers and pathological provider behavior
          - id: F32
            focus: Holistic adversarial review for any concrete Phase 1-2 bug missed by narrower focuses

    steps:
      - uses: actions/checkout@v4
        with:
          ref: remake-manager/zero-bug-pass-01
          fetch-depth: 0

      - name: Build compact evidence
        run: |
          set -euo pipefail
          git show HEAD:.seven-team/runtime/kilo_anonymous_relay.py > /tmp/kilo_anonymous_relay.py
          git checkout --detach 4bce46c60b09f040d586c80a84232c87e12ae354
          python - <<'PY'
          from pathlib import Path
          files=[
            'remake/src/core/errors.ts',
            'remake/src/core/task-manager.ts',
            'remake/src/domain/chat/index.ts',
            'remake/src/storage/room-repository.ts',
            'remake/src/application/chat/chat-service.ts',
            'remake/src/providers/contracts.ts',
            'remake/src/routing/model-router.ts',
            'remake/src/integration/phase12/index.ts',
          ]
          blocks=[]
          for name in files:
              p=Path(name)
              blocks.append(f"===== {name} =====\n{p.read_text(encoding='utf-8',errors='replace')}\n")
          Path('/tmp/evidence.txt').write_text('\n'.join(blocks),encoding='utf-8')
          PY

      - name: Start free model relay
        run: |
          set -euo pipefail
          python /tmp/kilo_anonymous_relay.py >/tmp/relay.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8877/v1/models >/tmp/models.json; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Audit focus
        env:
          AUDIT_ID: ${{ matrix.id }}
          AUDIT_FOCUS: ${{ matrix.focus }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,urllib.request
          aid=os.environ['AUDIT_ID']; focus=os.environ['AUDIT_FOCUS']
          evidence=pathlib.Path('/tmp/evidence.txt').read_text(encoding='utf-8')
          catalog=json.load(open('/tmp/models.json'))
          rows=catalog.get('data',catalog if isinstance(catalog,list) else [])
          available={row.get('id') if isinstance(row,dict) else row for row in rows}
          preferred=[
            'poolside/laguna-s-2.1:free',
            'nvidia/nemotron-3.5-lightning:free',
            'nvidia/nemotron-3-ultra-550b-a55b:free',
            'nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free',
          ]
          models=[m for m in preferred if m in available]
          if not models: raise SystemExit('No preferred free audit model')
          base='http://127.0.0.1:8877/v1'

          system='You are a strict adversarial software auditor. Use only supplied code. Never invent bugs. Missing future features and missing tests alone are not bugs.'
          prompt=(
            f'Audit ID {aid}. Focus: {focus}. '
            'If no deterministic current Phase 1-2 production bug is proven, return exactly the single word PASS. '
            'If a bug is proven, return only lines formatted BUG|SEVERITY|remake/src/path.ts|title|reproduction|fix. '
            'Severity must be CRITICAL HIGH MEDIUM or LOW. Evidence must refer to code actually supplied.\n\n'+evidence
          )

          def ask(model):
              body=json.dumps({'model':model,'messages':[{'role':'system','content':system},{'role':'user','content':prompt}],
                               'temperature':0,'max_tokens':900,'stream':False}).encode()
              req=urllib.request.Request(base+'/chat/completions',data=body,headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=50) as res:data=json.load(res)
              choices=data.get('choices') or []
              msg=(choices[0].get('message') or {}) if choices else {}
              vals=[v for v in (msg.get('content'),msg.get('reasoning_content')) if isinstance(v,str) and v.strip()]
              return '\n'.join(vals).strip()

          def parse(raw):
              text=raw.strip()
              lines=[line.strip() for line in text.splitlines() if line.strip()]
              if any(line=='PASS' for line in lines):
                  if any(line.startswith('BUG|') for line in lines):
                      raise ValueError('mixed PASS and BUG')
                  return {'id':aid,'status':'PASS','findings':[]}

              start=text.find('{'); end=text.rfind('}')
              if start>=0 and end>start:
                  try:
                      data=json.loads(text[start:end+1])
                      if data.get('id') not in {None,aid}: raise ValueError('wrong id')
                      status=data.get('status')
                      findings=data.get('findings')
                      if status=='PASS' and findings==[]:
                          return {'id':aid,'status':'PASS','findings':[]}
                      if status=='BUG' and isinstance(findings,list) and findings:
                          valid=[]
                          for finding in findings[:5]:
                              if not isinstance(finding,dict): continue
                              sev=finding.get('severity'); path=finding.get('evidence','')
                              title=finding.get('title',''); repro=finding.get('repro',''); fix=finding.get('fix','')
                              if sev not in {'CRITICAL','HIGH','MEDIUM','LOW'}: continue
                              if 'remake/src/' not in path: continue
                              if len(title.strip())<8 or len(repro.strip())<15 or len(fix.strip())<12: continue
                              valid.append({'severity':sev,'title':title.strip(),'evidence':path.strip(),'repro':repro.strip(),'fix':fix.strip()})
                          if valid:
                              return {'id':aid,'status':'BUG','findings':valid}
                  except (json.JSONDecodeError,TypeError,AttributeError):
                      pass

              fs=[]
              for line in lines:
                  if not line.startswith('BUG|'): continue
                  parts=line.split('|',5)
                  if len(parts)!=6: continue
                  _,sev,path,title,repro,fix=parts
                  if sev not in {'CRITICAL','HIGH','MEDIUM','LOW'}: continue
                  if not path.startswith('remake/src/'): continue
                  if len(title.strip())<8 or len(repro.strip())<15 or len(fix.strip())<12: continue
                  fs.append({'severity':sev,'title':title.strip(),'evidence':path.strip(),'repro':repro.strip(),'fix':fix.strip()})
              if fs:return {'id':aid,'status':'BUG','findings':fs[:5]}
              raise ValueError('invalid format')

          errors=[]
          for model in models:
              for attempt in range(2):
                  try:
                      raw=ask(model)
                      report=parse(raw)
                      out={'id':aid,'model':model,'report':report}
                      pathlib.Path('/tmp/report.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
                      print('VALID',aid,report['status'],len(report['findings']),model)
                      raise SystemExit(0)
                  except SystemExit: raise
                  except Exception as exc:
                      errors.append(f'{model}:{type(exc).__name__}')
          raise SystemExit('No valid report '+','.join(errors))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: final9-${{ matrix.id }}
          path: /tmp/report.json
          retention-days: 7

  aggregate:
    runs-on: ubuntu-latest
    needs: audit
    if: always()
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remake-manager/zero-bug-pass-01
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: final9-*
          path: /tmp/reports

      - name: Enforce and save Final9 Matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob,json,pathlib
          files=glob.glob('/tmp/reports/**/report.json',recursive=True)
          results=[]
          for f in files:
              try: results.append(json.load(open(f,encoding='utf-8')))
              except Exception: pass
          results.sort(key=lambda x:x['id'])
          ids=[r['id'] for r in results]
          expected=['F03','F05','F09','F14','F15','F20','F21','F28','F32']
          if ids!=expected: raise SystemExit(f'Expected {expected}, got {ids}')
          findings=[(r['id'],f) for r in results for f in r['report']['findings']]
          lines=['# Seven Remake — Final9 Matrix Recovery','',
                 'Target SHA: 4bce46c60b09f040d586c80a84232c87e12ae354',
                 'Valid reports: 9/9',
                 f'Concrete findings: {len(findings)}','']
          for r in results:
              lines.append(f"- {r['id']}: {r['report']['status']} ({len(r['report']['findings'])}) via {r['model']}")
          lines+=['','## Findings']
          if not findings: lines.append('No concrete bugs found by the nine recovery auditors.')
          else:
              for aid,f in findings:
                  lines += [f"### {aid} — {f['severity']} — {f['title']}",
                            f"- Evidence: {f['evidence']}",f"- Repro: {f['repro']}",f"- Fix: {f['fix']}",'']
          lines += ['','FINAL9_MATRIX_VALID=9/9',f'FINAL9_MATRIX_FINDINGS={len(findings)}','FINAL9_MATRIX=COMPLETE','']
          pathlib.Path('/tmp/FINAL9_MATRIX.md').write_text('\n'.join(lines),encoding='utf-8')
          pathlib.Path('/tmp/count.json').write_text(json.dumps({'findings':len(findings)}))
          PY
          git pull --rebase origin remake-manager/zero-bug-pass-01
          mkdir -p .seven-team/zero-bug
          cp /tmp/FINAL9_MATRIX.md .seven-team/zero-bug/FINAL9_MATRIX.md
          git add -f .seven-team/zero-bug/FINAL9_MATRIX.md
          git config user.name 'Seven Final9 Matrix'
          git config user.email 'actions@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Record Final9 matrix recovery'
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:remake-manager/zero-bug-pass-01
          fi
          python - <<'PY'
          import json
          d=json.load(open('/tmp/count.json'))
          assert d['findings']==0,d
          print('FINAL9 MATRIX ZERO-BUG GATE PASS')
          PY
