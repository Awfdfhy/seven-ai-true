name: Seven mini-SWE Live Agent Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.seven-team/prompts/live-smoke/team-a-mini-swe.md'
      - '.seven-team/prompts/live-smoke/team-b-mini-swe.md'
      - '.github/workflows/agent-live-mini-swe-smoke.yml'

permissions:
  contents: write

concurrency:
  group: seven-mini-swe-live-smoke
  cancel-in-progress: true

jobs:
  mini-swe-live:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: Team A mini-SWE live edit
            branch: agent/08-testing-ci
            prompt_path: .seven-team/prompts/live-smoke/team-a-mini-swe.md
            report: .seven-team/reports/team-a-mini-swe-live-smoke.md
            commit_message: Agent A08 mini-SWE live runtime smoke report
          - name: Team B mini-SWE live edit
            branch: agent-b/08-rpg-testing
            prompt_path: .seven-team/prompts/live-smoke/team-b-mini-swe.md
            report: .seven-team/reports/team-b-mini-swe-live-smoke.md
            commit_message: Agent B08 mini-SWE live runtime smoke report

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mini-SWE-agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install mini-swe-agent

      - name: Materialize guarded runtime and prompt from main
        run: |
          git fetch origin main
          git show origin/main:.seven-team/runtime/kilo_anonymous_relay.py > /tmp/kilo_anonymous_relay.py
          git show origin/main:${{ matrix.prompt_path }} > /tmp/mini-prompt.md
          cat > /tmp/seven-mini.yaml <<'YAML'
          agent:
            system_template: |
              You are a controlled repository worker. Follow the task literally, minimize actions, and do not explore unrelated files.
            instance_template: |
              {{task}}
            step_limit: 4
            cost_limit: 3
            mode: yolo
          environment:
            env:
              PAGER: cat
              MANPAGER: cat
          model:
            cost_tracking: ignore_errors
            model_kwargs:
              drop_params: true
              api_base: http://127.0.0.1:8877/v1
              api_key: local-dummy-key
          YAML

      - name: Start guarded relay
        run: |
          python /tmp/kilo_anonymous_relay.py > /tmp/seven-relay.log 2>&1 &
          ready=0
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8877/v1/models >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1

      - name: Run real mini-SWE agent
        env:
          OPENAI_API_BASE: http://127.0.0.1:8877/v1
          OPENAI_API_KEY: local-dummy-key
          MSWEA_COST_TRACKING: ignore_errors
        run: |
          set -u
          mkdir -p "$(dirname "${{ matrix.report }}")"
          set +e
          timeout 150s mini \
            -c /tmp/seven-mini.yaml \
            -m openai/kilo-auto/free \
            -t "$(cat /tmp/mini-prompt.md)" \
            -y
          rc=$?
          set -e
          if test -f "${{ matrix.report }}" && grep -q 'LIVE_AGENT_SMOKE=PASS' "${{ matrix.report }}"; then
            echo "mini-SWE produced required report; accepting output (rc=$rc)."
          else
            echo "mini-SWE did not produce required report (rc=$rc)." >&2
            exit "${rc:-1}"
          fi

      - name: Sanitize to allowed output only
        run: |
          set -euo pipefail
          EXPECTED='${{ matrix.report }}'
          cp "$EXPECTED" /tmp/seven-agent-report.md
          git reset --hard HEAD
          git clean -fdx
          mkdir -p "$(dirname "$EXPECTED")"
          cp /tmp/seven-agent-report.md "$EXPECTED"
          git add -f "$EXPECTED"
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "$EXPECTED"

      - name: Commit and push controlled report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'Seven Team Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m "${{ matrix.commit_message }}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${{ matrix.branch }}
