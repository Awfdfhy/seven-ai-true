name: Seven Superloop Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce an unbroken running + successor chain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow seven-24h-superloop.yml --limit 30 --json databaseId,status,createdAt)"
          now="$(date -u +%s)"

          stale_ids="$(jq -r --argjson now "$now" '
            .[]
            | select(.status=="in_progress")
            | ((.createdAt | fromdateiso8601) // $now) as $started
            | select(($now - $started) > 11400)
            | .databaseId
          ' <<<"$runs")"

          if [[ -n "$stale_ids" ]]; then
            while read -r stale_id; do
              [[ -z "$stale_id" ]] && continue
              echo "Cancelling stale Superloop run $stale_id (>190 minutes old)."
              gh run cancel "$stale_id" --repo "$GITHUB_REPOSITORY" || true
            done <<<"$stale_ids"
            sleep 5
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow seven-24h-superloop.yml --limit 30 --json databaseId,status,createdAt)"
          fi

          running="$(jq '[.[] | select(.status=="in_progress")] | length' <<<"$runs")"
          queued="$(jq '[.[] | select(.status=="queued" or .status=="waiting" or .status=="requested" or .status=="pending")] | length' <<<"$runs")"

          echo "Superloop health: running=$running queued=$queued"

          if (( running > 0 && queued > 0 )); then
            echo "Healthy conveyor: an active cycle has a successor waiting."
            exit 0
          fi

          if (( running > 0 && queued == 0 )); then
            gh workflow run seven-24h-superloop.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "Active cycle had no successor; watchdog queued one immediately."
            exit 0
          fi

          if (( running == 0 && queued > 0 )); then
            echo "A successor is already queued and will acquire the concurrency slot."
            exit 0
          fi

          gh workflow run seven-24h-superloop.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "No active or queued cycle existed; watchdog restarted the conveyor."
