name: Seven Remake Zero Bug Final7 Recovery

on:
  push:
    branches:
      - remake-manager/zero-bug-pass-01
    paths:
      - '.github/workflows/seven-remake-zero-bug-final7-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - id: F09
            focus: Chat persistence failures before user write after user write and during assistant commit
          - id: F14
            focus: ProviderAdapter runtime contract malformed chunks models adapter identity and dispatch
          - id: F17
            focus: Provider error normalization retry-after behavior privacy-safe failure details and unknown thrown values
          - id: F21
            focus: ProviderHealth penalties cooldowns stale success-failure ordering and recovery
          - id: F26
            focus: UI isolation from provider network and storage contracts in current Phase 1-2
          - id: F27
            focus: Security and privacy raw provider errors secrets unknown thrown values and diagnostic retention
          - id: F32
            focus: Holistic adversarial review for any concrete Phase 1-2 production bug missed by narrower audits

    steps:
      - uses: actions/checkout@v4
        with:
          ref: remake-manager/zero-bug-pass-01
          fetch-depth: 0

      - name: Build immutable evidence
        run: |
          set -euo pipefail
          git show HEAD:.seven-team/runtime/kilo_anonymous_relay.py > /tmp/kilo_anonymous_relay.py
          git checkout --detach 4bce46c60b09f040d586c80a84232c87e12ae354
          python - <<'PY'
          from pathlib import Path
          files=[
            'remake/src/core/errors.ts',
            'remake/src/core/task-manager.ts',
            'remake/src/domain/chat/index.ts',
            'remake/src/storage/room-repository.ts',
            'remake/src/application/chat/chat-service.ts',
            'remake/src/providers/contracts.ts',
            'remake/src/routing/model-router.ts',
            'remake/src/integration/phase12/index.ts',
          ]
          blocks=[]
          for name in files:
              p=Path(name)
              blocks.append(f"===== {name} =====\n{p.read_text(encoding='utf-8',errors='replace')}\n")
          Path('/tmp/evidence.txt').write_text('\n'.join(blocks),encoding='utf-8')
          PY

      - name: Start relay
        run: |
          set -euo pipefail
          python /tmp/kilo_anonymous_relay.py >/tmp/relay.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8877/v1/models >/tmp/models.json; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Run recovery auditor
        env:
          AUDIT_ID: ${{ matrix.id }}
          AUDIT_FOCUS: ${{ matrix.focus }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,urllib.request
          aid=os.environ['AUDIT_ID']; focus=os.environ['AUDIT_FOCUS']
          evidence=pathlib.Path('/tmp/evidence.txt').read_text(encoding='utf-8')
          catalog=json.load(open('/tmp/models.json'))
          rows=catalog.get('data',catalog if isinstance(catalog,list) else [])
          available={row.get('id') if isinstance(row,dict) else row for row in rows}
          preferred=[
            'poolside/laguna-s-2.1:free',
            'nvidia/nemotron-3.5-lightning:free',
            'nvidia/nemotron-3-ultra-550b-a55b:free',
            'nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free',
          ]
          models=[m for m in preferred if m in available]
          if not models: raise SystemExit('No audit model available')

          base='http://127.0.0.1:8877/v1'
          system=(
            'You audit software source code. Use only supplied source. '
            'Do not report missing future features or missing tests as bugs. '
            'Only report a deterministic current production defect.'
          )
          # Protocol deliberately uses tiny tokens to avoid JSON formatting failures.
          user=(
            f'Audit focus: {focus}. '
            'If you cannot prove a concrete bug, your entire response must be the single character 0. '
            'If you prove a bug, output only one or more lines beginning with 1| and formatted '
            '1|SEVERITY|remake/src/path.ts|TITLE|DETERMINISTIC REPRODUCTION|MINIMAL FIX. '
            'Allowed severities: CRITICAL HIGH MEDIUM LOW. No markdown and no commentary.\n\nSOURCE:\n'+evidence
          )

          def ask(model):
              body=json.dumps({
                  'model':model,
                  'messages':[{'role':'system','content':system},{'role':'user','content':user}],
                  'temperature':0,'max_tokens':1000,'stream':False
              }).encode()
              req=urllib.request.Request(base+'/chat/completions',data=body,headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=55) as res:
                  data=json.load(res)
              choices=data.get('choices') or []
              msg=(choices[0].get('message') or {}) if choices else {}
              vals=[v for v in (msg.get('content'),msg.get('reasoning_content')) if isinstance(v,str) and v.strip()]
              return '\n'.join(vals).strip()

          def parse(raw):
              compact=''.join(raw.split())
              if compact=='0':
                  return {'id':aid,'status':'PASS','findings':[]}
              findings=[]
              for line in raw.splitlines():
                  line=line.strip()
                  if not line.startswith('1|'): continue
                  parts=line.split('|',5)
                  if len(parts)!=6: continue
                  _,sev,path,title,repro,fix=parts
                  if sev not in {'CRITICAL','HIGH','MEDIUM','LOW'}: continue
                  if not path.startswith('remake/src/'): continue
                  if len(title.strip())<6 or len(repro.strip())<15 or len(fix.strip())<10: continue
                  findings.append({
                    'severity':sev,'title':title.strip(),'evidence':path.strip(),
                    'repro':repro.strip(),'fix':fix.strip()
                  })
              if findings:
                  return {'id':aid,'status':'BUG','findings':findings[:4]}
              raise ValueError('invalid protocol')

          attempts=[]
          for model in models:
              for _ in range(2):
                  try:
                      raw=ask(model)
                      report=parse(raw)
                      out={'id':aid,'model':model,'report':report}
                      pathlib.Path('/tmp/report.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
                      print('RECOVERED',aid,report['status'],len(report['findings']),model)
                      raise SystemExit(0)
                  except SystemExit:
                      raise
                  except Exception as exc:
                      raw_preview=locals().get('raw','')
                      print('INVALID_RAW',aid,model,type(exc).__name__,repr(raw_preview[:1200]),flush=True)
                      attempts.append(model+':'+type(exc).__name__)
          raise SystemExit('No valid report '+','.join(attempts))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: final7-${{ matrix.id }}
          path: /tmp/report.json
          retention-days: 7

  aggregate:
    runs-on: ubuntu-latest
    needs: audit
    if: always()
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remake-manager/zero-bug-pass-01
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: final7-*
          path: /tmp/reports

      - name: Aggregate Final7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob,json,pathlib
          expected=['F09','F14','F17','F21','F26','F27','F32']
          results=[]
          for f in glob.glob('/tmp/reports/**/report.json',recursive=True):
              try: results.append(json.load(open(f,encoding='utf-8')))
              except Exception: pass
          results.sort(key=lambda x:x['id'])
          ids=[r['id'] for r in results]
          if ids!=expected: raise SystemExit(f'Expected {expected}, got {ids}')
          findings=[(r['id'],f) for r in results for f in r['report']['findings']]
          lines=['# Seven Remake — Final7 Recovery Audit','',
                 'Target SHA: 4bce46c60b09f040d586c80a84232c87e12ae354',
                 'Valid reports: 7/7',
                 f'Concrete findings: {len(findings)}','']
          for r in results:
              lines.append(f"- {r['id']}: {r['report']['status']} ({len(r['report']['findings'])}) via {r['model']}")
          lines+=['','## Findings']
          if not findings:
              lines.append('No concrete bugs found by the seven recovered auditors.')
          else:
              for aid,f in findings:
                  lines += [
                    f"### {aid} — {f['severity']} — {f['title']}",
                    f"- Evidence: {f['evidence']}",
                    f"- Repro: {f['repro']}",
                    f"- Fix: {f['fix']}",''
                  ]
          lines += ['','FINAL7_VALID=7/7',f'FINAL7_FINDINGS={len(findings)}','FINAL7_RECOVERY=COMPLETE','']
          pathlib.Path('/tmp/FINAL7_RECOVERY.md').write_text('\n'.join(lines),encoding='utf-8')
          pathlib.Path('/tmp/count.json').write_text(json.dumps({'findings':len(findings)}))
          PY
          git pull --rebase origin remake-manager/zero-bug-pass-01
          mkdir -p .seven-team/zero-bug
          cp /tmp/FINAL7_RECOVERY.md .seven-team/zero-bug/FINAL7_RECOVERY.md
          git add -f .seven-team/zero-bug/FINAL7_RECOVERY.md
          git config user.name 'Seven Final7 Recovery'
          git config user.email 'actions@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Record Final7 recovery audit'
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:remake-manager/zero-bug-pass-01
          fi
          python - <<'PY'
          import json
          d=json.load(open('/tmp/count.json'))
          assert d['findings']==0,d
          print('FINAL7 ZERO-BUG GATE PASS')
          PY
