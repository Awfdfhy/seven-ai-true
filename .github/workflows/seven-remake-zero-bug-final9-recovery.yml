name: Seven Remake Zero Bug Final9 Recovery

on:
  push:
    branches:
      - remake-manager/zero-bug-pass-01
    paths:
      - '.github/workflows/seven-remake-zero-bug-final9-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remake-manager/zero-bug-pass-01
          fetch-depth: 0
          persist-credentials: false

      - name: Pin candidate and build compact production evidence
        run: |
          set -euo pipefail
          git show HEAD:.seven-team/runtime/kilo_anonymous_relay.py > /tmp/kilo_anonymous_relay.py
          git checkout --detach 0e8e04d20a6beb798101f555fe38ae5870bef96f
          python - <<'PY'
          from pathlib import Path
          files=[
            Path('remake/src/core/errors.ts'),
            Path('remake/src/core/task-manager.ts'),
            Path('remake/src/domain/chat/index.ts'),
            Path('remake/src/storage/room-repository.ts'),
            Path('remake/src/application/chat/chat-service.ts'),
            Path('remake/src/providers/contracts.ts'),
            Path('remake/src/routing/model-router.ts'),
            Path('remake/src/integration/phase12/index.ts'),
          ]
          text=[]
          for p in files:
              raw=p.read_text(encoding='utf-8',errors='replace')
              text.append(f"===== {p.as_posix()} =====\n{raw}\n")
          evidence='\n'.join(text)
          Path('/tmp/evidence.txt').write_text(evidence,encoding='utf-8')
          print('evidence_chars',len(evidence))
          PY

      - name: Start free model relay
        run: |
          set -euo pipefail
          python /tmp/kilo_anonymous_relay.py >/tmp/relay.log 2>&1 &
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8877/v1/models >/tmp/models.json; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1

      - name: Recover nine invalid audits
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures as cf
          import json, pathlib, urllib.request

          evidence=pathlib.Path('/tmp/evidence.txt').read_text(encoding='utf-8')
          missing={
            'F03':"Timeout/deadline bounds, timer cleanup, clock rollback and abort semantics",
            'F05':"Room/message invariants, immutable snapshots, timestamps, duplicate IDs and malformed runtime values",
            'F09':"Chat persistence failures before user write, after user write and during assistant commit",
            'F14':"ProviderAdapter runtime contract, malformed chunks/models and adapter identity",
            'F15':"Fallback before meaningful output, whitespace prelude, empty output and malformed chunks",
            'F20':"Preferred model resolution, cross-provider collisions and qualified model identities",
            'F21':"ProviderHealth penalties, cooldowns, stale success/failure ordering and recovery",
            'F28':"Performance/resource behavior: cloning cost, unbounded arrays/maps/listeners/timers and pathological provider behavior",
            'F32':"Holistic adversarial review: any concrete Phase 1-2 bug missed by narrower focuses",
          }

          catalog=json.load(open('/tmp/models.json'))
          rows=catalog.get('data',catalog if isinstance(catalog,list) else [])
          mids=[]
          for row in rows:
              mid=row.get('id') if isinstance(row,dict) else row if isinstance(row,str) else None
              if isinstance(mid,str) and ':free' in mid and not mid.startswith('kilo-auto/'):
                  mids.append(mid)
          preferred=[
            'poolside/laguna-s-2.1:free',
            'nvidia/nemotron-3.5-lightning:free',
            'nvidia/nemotron-3-ultra-550b-a55b:free',
            'nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free',
          ]
          mids=[m for m in preferred if m in mids] + [m for m in mids if m not in preferred]
          if not mids: raise SystemExit('No free models available')
          base='http://127.0.0.1:8877/v1'

          def ask(mid,messages,max_tokens=1200,timeout=55):
              body=json.dumps({
                  'model':mid,'messages':messages,'temperature':0,
                  'max_tokens':max_tokens,'stream':False
              }).encode()
              req=urllib.request.Request(base+'/chat/completions',data=body,headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=timeout) as res:
                  data=json.load(res)
              choices=data.get('choices') or []
              msg=(choices[0].get('message') or {}) if choices else {}
              parts=[v for v in (msg.get('content'),msg.get('reasoning_content')) if isinstance(v,str) and v.strip()]
              return '\n'.join(parts).strip()

          def parse(aid,raw):
              compact=' '.join(raw.strip().split())
              if compact == 'PASS':
                  return {'id':aid,'status':'PASS','findings':[]}
              # Accept one or more strict BUG lines:
              # BUG|SEVERITY|path|title|repro|fix
              findings=[]
              for line in raw.splitlines():
                  line=line.strip()
                  if not line.startswith('BUG|'): continue
                  parts=line.split('|',5)
                  if len(parts)!=6: continue
                  _,sev,path,title,repro,fix=parts
                  if sev not in {'CRITICAL','HIGH','MEDIUM','LOW'}: continue
                  if not path.startswith('remake/src/'): continue
                  if len(title.strip())<8 or len(repro.strip())<20 or len(fix.strip())<15: continue
                  findings.append({
                    'severity':sev,
                    'title':title.strip(),
                    'evidence':path.strip(),
                    'repro':repro.strip(),
                    'fix':fix.strip(),
                  })
              if findings:
                  return {'id':aid,'status':'BUG','findings':findings[:5]}
              raise ValueError('invalid recovery output')

          system=(
            "You are a strict software auditor. Use only supplied code. "
            "Do not invent issues. A future feature or missing test alone is not a bug."
          )

          def one(item):
              aid,focus=item
              prompt=(
                f"Audit ID {aid}. Focus only on: {focus}. "
                "Audit current Seven Remake Phase 1-2 production behavior. "
                "If you cannot prove a concrete deterministic bug, reply with exactly PASS and nothing else. "
                "If you prove a bug, output one line per bug in exactly this format: "
                "BUG|HIGH|remake/src/path.ts|short title|deterministic reproduction in at least 20 chars|minimal root cause fix in at least 15 chars. "
                "Use CRITICAL/HIGH/MEDIUM/LOW only. No markdown, no explanations outside these lines.\n\nSOURCE:\n"+evidence
              )
              errs=[]
              for mid in mids[:6]:
                  try:
                      raw=ask(mid,[{'role':'system','content':system},{'role':'user','content':prompt}])
                      data=parse(aid,raw)
                      return {'id':aid,'model':mid,'report':data,'raw':raw[:4000]}
                  except Exception as exc:
                      errs.append(mid+':'+type(exc).__name__)
              raise RuntimeError(aid+' '+','.join(errs))

          results=[]; errors=[]
          with cf.ThreadPoolExecutor(max_workers=4) as ex:
              futs={ex.submit(one,item):item[0] for item in missing.items()}
              for fut in cf.as_completed(futs):
                  aid=futs[fut]
                  try:
                      r=fut.result()
                      results.append(r)
                      print('RECOVERY',aid,r['report']['status'],len(r['report']['findings']),r['model'],flush=True)
                  except Exception as exc:
                      errors.append((aid,str(exc)))
                      print('RECOVERY_FAIL',aid,str(exc),flush=True)

          results.sort(key=lambda x:x['id'])
          pathlib.Path('/tmp/recovery.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          if errors:
              pathlib.Path('/tmp/recovery-errors.json').write_text(json.dumps(errors,ensure_ascii=False,indent=2),encoding='utf-8')
              raise SystemExit('Recovery invalid: '+','.join(a for a,_ in errors))
          if len(results)!=9:
              raise SystemExit(f'Expected 9 valid recovery reports, got {len(results)}')
          findings=[(r['id'],f) for r in results for f in r['report']['findings']]
          pathlib.Path('/tmp/recovery-counts.json').write_text(json.dumps({'reports':9,'findings':len(findings)}))
          PY

      - name: Build and save recovery report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          results=json.load(open('/tmp/recovery.json'))
          findings=[(r['id'],f) for r in results for f in r['report']['findings']]
          lines=[
            '# Seven Remake — Final9 Recovery Audit',
            '',
            'Target SHA: 0e8e04d20a6beb798101f555fe38ae5870bef96f',
            f'Valid recovery reports: {len(results)}/9',
            f'Concrete findings: {len(findings)}',
            '',
          ]
          for r in results:
              lines.append(f"- {r['id']}: {r['report']['status']} ({len(r['report']['findings'])}) via {r['model']}")
          lines += ['', '## Findings']
          if not findings:
              lines.append('No concrete bugs found by the nine recovery auditors.')
          else:
              for aid,f in findings:
                  lines += [
                    f"### {aid} — {f['severity']} — {f['title']}",
                    f"- Evidence: {f['evidence']}",
                    f"- Repro: {f['repro']}",
                    f"- Fix: {f['fix']}",
                    ''
                  ]
          lines += [
            '',
            'RECOVERY_VALID=9/9',
            f'RECOVERY_FINDINGS={len(findings)}',
            'FINAL9_RECOVERY=COMPLETE',
            ''
          ]
          pathlib.Path('/tmp/FINAL9_RECOVERY.md').write_text('\n'.join(lines),encoding='utf-8')
          print('\n'.join(lines[-5:]))
          PY
          git checkout remake-manager/zero-bug-pass-01
          git pull --rebase origin remake-manager/zero-bug-pass-01
          mkdir -p .seven-team/zero-bug
          cp /tmp/FINAL9_RECOVERY.md .seven-team/zero-bug/FINAL9_RECOVERY.md
          git add -f .seven-team/zero-bug/FINAL9_RECOVERY.md
          git config user.name 'Seven Final9 Recovery'
          git config user.email 'actions@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Record Final9 recovery audit'
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:remake-manager/zero-bug-pass-01
          fi

      - name: Enforce zero recovery findings
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/recovery-counts.json'))
          assert d['reports']==9,d
          assert d['findings']==0,d
          print('FINAL9 RECOVERY ZERO-BUG GATE PASS')
          PY
