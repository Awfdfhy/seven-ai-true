name: Seven RPG Live LLM Canon
on:
  workflow_dispatch:
  push:
    branches:
      - 'release/rc-*'
    paths:
      - 'apk/rpg-live-llm-acceptance.cjs'
      - '.github/workflows/rpg-live-canon.yml'
      - 'release/workspaces/rpg-state.js'
      - 'release/workspaces/rpg-context.js'
permissions:
  contents: read
jobs:
  live-rpg-canon:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run real LLM plus Canon gate
        env:
          SEVEN_RPG_GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          SEVEN_RPG_OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SEVEN_RPG_NVIDIA_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SEVEN_RPG_MISTRAL_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: node apk/rpg-live-llm-acceptance.cjs
