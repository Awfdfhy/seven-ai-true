name: Seven RPG Live LLM Canon
on:
  workflow_dispatch:
  push:
    branches:
      - 'release/rc-*'
    paths:
      - 'apk/rpg-live-llm-acceptance.cjs'
      - '.github/workflows/rpg-live-canon.yml'
      - '.github/workflows/android-apk.yml'
      - 'release/workspaces/rpg-state.js'
      - 'release/workspaces/rpg-context.js'
permissions:
  contents: read
jobs:
  live-rpg-canon:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve live AI test provider
        id: provider
        env:
          SEVEN_RPG_GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          SEVEN_RPG_OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SEVEN_RPG_NVIDIA_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SEVEN_RPG_MISTRAL_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          if [ -n "$SEVEN_RPG_GROQ_KEY" ] || [ -n "$SEVEN_RPG_OPENROUTER_KEY" ] || [ -n "$SEVEN_RPG_NVIDIA_KEY" ] || [ -n "$SEVEN_RPG_MISTRAL_KEY" ]; then
            echo "local=false" >> "$GITHUB_OUTPUT"
            echo "Cloud credential available; testing the production-style inference endpoint."
          else
            echo "local=true" >> "$GITHUB_OUTPUT"
            echo "Cloud credential absent. Run real open-weight Qwen inference locally; do not claim cloud credential verification."
          fi
      - name: Install Ollama inference engine
        if: steps.provider.outputs.local == 'true'
        uses: ai-action/setup-ollama@v2
      - name: Start local real LLM and pull model
        if: steps.provider.outputs.local == 'true'
        run: |
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:11434/api/version > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/version > /dev/null
          ollama pull qwen2.5:1.5b-instruct
          ollama list
      - name: Test actual live LLM + RPG Canon
        env:
          SEVEN_RPG_GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          SEVEN_RPG_OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SEVEN_RPG_NVIDIA_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SEVEN_RPG_MISTRAL_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SEVEN_RPG_ALLOW_LOCAL_LLM: ${{ steps.provider.outputs.local }}
        run: node apk/rpg-live-llm-acceptance.cjs
      - name: Upload local inference diagnostics only on failure
        if: failure() && steps.provider.outputs.local == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: seven-rpg-local-llm-diagnostics
          path: ${{ runner.temp }}/ollama.log
          if-no-files-found: ignore
          retention-days: 3
