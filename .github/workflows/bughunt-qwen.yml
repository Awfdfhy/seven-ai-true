name: Seven Bug Hunt — Qwen Stress Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.seven-team/prompts/bughunt/A09.md'
      - '.seven-team/prompts/bughunt/B09.md'
      - '.github/workflows/bughunt-qwen.yml'
permissions:
  contents: write
concurrency:
  group: seven-bughunt-qwen
  cancel-in-progress: true
jobs:
  qwen-live:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: Bug Hunt A09 Qwen performance audit
            id: A09
            branch: bughunt/a09
            prompt: .seven-team/prompts/bughunt/A09.md
            report: .seven-team/reports/bughunt/A09.md
          - name: Bug Hunt B09 Qwen race audit
            id: B09
            branch: bughunt/b09
            prompt: .seven-team/prompts/bughunt/B09.md
            report: .seven-team/reports/bughunt/B09.md
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Qwen Code
        run: npm install -g @qwen-code/qwen-code@latest
      - name: Materialize runtime and prompt
        run: |
          git fetch origin main
          git show origin/main:.seven-team/runtime/kilo_anonymous_relay.py > /tmp/relay.py
          git show origin/main:${{ matrix.prompt }} > /tmp/prompt.md
      - name: Start relay
        env:
          SEVEN_RELAY_BRIDGE_STREAM: '1'
          SEVEN_RELAY_FINAL_ONLY: '1'
        run: |
          python /tmp/relay.py >/tmp/relay.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8877/v1/models >/tmp/models.json; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Select healthy direct free model
        run: |
          python - <<'PY'
          import json,os,urllib.request
          base='http://127.0.0.1:8877/v1'
          d=json.load(open('/tmp/models.json'))
          ids=[x.get('id') for x in d.get('data',[]) if isinstance(x,dict) and isinstance(x.get('id'),str) and ':free' in x['id'] and not x['id'].startswith('kilo-auto/')]
          for mid in ids[:16]:
              req=urllib.request.Request(base+'/chat/completions',data=json.dumps({'model':mid,'messages':[{'role':'user','content':'Reply OK'}],'max_tokens':8,'stream':False}).encode(),headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: out=json.load(r)
                  msg=((out.get('choices') or [{}])[0].get('message') or {})
                  if (msg.get('content') or msg.get('reasoning_content') or '').strip():
                      with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as env:
                          env.write('BUG_MODEL='+mid+'\n')
                      print('Selected',mid)
                      raise SystemExit(0)
              except Exception as e:
                  print('probe failed',mid,type(e).__name__,e)
          raise SystemExit('no healthy direct free model')
          PY
      - name: Build bounded Seven evidence pack
        run: |
          set -euo pipefail
          {
            echo '=== FILE SIZES ==='
            for f in seven_ai-final.html release/workspaces/*.js release/workspaces/*.css release/native-bridge.js release/github-self-dev.js native-security-policy.cjs verify.cjs; do
              test -f "$f" && wc -lc "$f"
            done
            echo
            echo '=== BUG-PRONE SEAMS ==='
            git grep -nE 'localStorage|sessionStorage|MutationObserver|innerHTML|setTimeout|fetch\(|AbortController|sendMessageLocked|isGenerating|retry|fallback|catch\s*\(|finally|stop|stream|room|currentRoom|persist|restore|save|load|race|lock|pending|controller' -- seven_ai-final.html release native-security-policy.cjs verify.cjs | head -n 520 || true
          } > /tmp/bug-evidence.txt
          head -c 30000 /tmp/bug-evidence.txt > /tmp/bug-evidence-bounded.txt

      - name: Run Qwen audit
        env:
          REPORT: ${{ matrix.report }}
          BUG_ID: ${{ matrix.id }}
          OPENAI_API_KEY: local-dummy-key
          OPENAI_BASE_URL: http://127.0.0.1:8877/v1
          QWEN_CODE_SUPPRESS_YOLO_WARNING: 'true'
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$REPORT")"

          validate_report() {
            test -f "$REPORT" || return 1
            grep -q 'BUGHUNT=COMPLETE' "$REPORT" || return 1
            grep -q "${BUG_ID}-" "$REPORT" || return 1
            grep -qi 'Severity' "$REPORT" || return 1
            grep -qiE 'Affected|surface|file/function' "$REPORT" || return 1
            grep -qiE 'repro|reproduction|test idea' "$REPORT" || return 1
            test "$(wc -c < "$REPORT")" -ge 1200 || return 1
          }

          rm -f /tmp/qwen.out
          set +e
          timeout 180s qwen -p "$(cat /tmp/prompt.md)" \
            --approval-mode yolo \
            --output-format text \
            --model "$BUG_MODEL" \
            --openai-api-key local-dummy-key \
            --openai-base-url http://127.0.0.1:8877/v1 2>&1 | tee /tmp/qwen.out
          rc=${PIPESTATUS[0]}
          set -e

          cp /tmp/qwen.out "$REPORT" || true
          if ! validate_report; then
            echo "Qwen CLI output is not a valid audit; synthesizing from bounded repository evidence."
            python - <<'PY'
          import json,os,pathlib,urllib.request
          prompt=pathlib.Path('/tmp/prompt.md').read_text(encoding='utf-8')
          evidence=pathlib.Path('/tmp/bug-evidence-bounded.txt').read_text(encoding='utf-8',errors='replace')
          task=prompt+"\n\nDETERMINISTIC REPOSITORY EVIDENCE:\n"+evidence+"\n\nReturn a concrete report, not tool calls or JSON traces."
          req=urllib.request.Request(
              'http://127.0.0.1:8877/v1/chat/completions',
              data=json.dumps({
                  'model':os.environ['BUG_MODEL'],
                  'messages':[
                      {'role':'system','content':'You are the final bug-audit synthesizer. Use only supplied repository evidence. Produce a plain Markdown report with concrete bug IDs, severity, affected surfaces, evidence, repro/test ideas, fix directions, and regression tests. Do not emit tool-call JSON. End exactly BUGHUNT=COMPLETE.'},
                      {'role':'user','content':task}
                  ],
                  'temperature':0,'max_tokens':6500,'stream':False
              }).encode(),
              headers={'Content-Type':'application/json'}
          )
          with urllib.request.urlopen(req,timeout=170) as r: d=json.load(r)
          m=((d.get('choices') or [{}])[0].get('message') or {})
          t=(m.get('content') or m.get('reasoning_content') or '').strip()
          if 'BUGHUNT=COMPLETE' in t:
              t=t[:t.rfind('BUGHUNT=COMPLETE')].rstrip()
          t=t+'\n\nBUGHUNT=COMPLETE\n'
          pathlib.Path(os.environ['REPORT']).write_text(t,encoding='utf-8')
          PY
          fi

          if ! validate_report; then
            echo "Qwen report failed semantic quality gate." >&2
            sed -n '1,120p' "$REPORT" >&2 || true
            exit 1
          fi

      - name: Sanitize and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          R='${{ matrix.report }}'
          cp "$R" /tmp/report.md
          git reset --hard HEAD
          git clean -fdx
          mkdir -p "$(dirname "$R")"
          cp /tmp/report.md "$R"
          git add -f "$R"
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'Seven Bug Hunt'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m "Bug Hunt ${{ matrix.name }}"
          git fetch origin "${{ matrix.branch }}"
          git rebase "origin/${{ matrix.branch }}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${{ matrix.branch }}
